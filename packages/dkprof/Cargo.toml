[package]
name = "dkprof"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Profiles: the dk.profile/1 artifact, names for raw counters from the address map, per-module and per-function self aggregates, and the C-ABI wasm of apps/web/public/dkprof.wasm"

[lib]
name = "dkprof"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Plain data and lookups: builds for the host and wasm32.
[dependencies]
dkaddrmap = { path = "../dkaddrmap" }
dksharc = { path = "../dksharc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
