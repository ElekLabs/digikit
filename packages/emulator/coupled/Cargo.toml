[package]
name = "digi-coupled"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Coupled ColdFire + SHARC+ run loop shared by the desktop app and the headless runner"

[lib]
name = "digi_coupled"

[features]
# Local-only SHARC+ coupling: generated DSP code must never be distributed.
sharc = ["sharc-peer/host", "dep:sharc-native"]
# Playback through the default output device (cpal).
play = ["elektron-native-boot/play"]
# Enable this with `sharc`; it forwards to the optional native cores.
region-profile = ["sharc-native?/region-profile"]
# Run-time switchable ColdFire profile (off until `set_cf_profile(true)`); compiled in to measure the cost of the disabled branches.
cf-profile = ["elektron-native-boot/cf-profile"]
# Exact ColdFire instruction mix per PC (boot/src/cfmix.rs); DIGI_CF_MIX_OUT=DIR makes coupled-run write it.
cf-mix = ["elektron-native-boot/cf-mix"]
# SHARC_FAST_DUMP kernel and call capture (--diag dump); the hooks are absent otherwise.
fast-dump = ["sharc-native?/fast-dump"]

[dependencies]
device-profile = { path = "../device-profile" }
elektron-native-boot = { path = "../boot" }
emmc-card = { path = "../card" }
serde_json = "1"
sha2 = "0.10"
sharc-peer = { path = "../sharc-peer" }
sharc-native = { path = "../sharc", optional = true }

[[bin]]
name = "coupled-run"
path = "src/bin/coupled_run.rs"
required-features = ["sharc"]
