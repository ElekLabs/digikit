[package]
name = "digi-coupled"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Coupled ColdFire + SHARC+ run loop shared by the desktop app and the headless runner"

[lib]
name = "digi_coupled"

[features]
# Local-only DN2 coupling: generated DSP code must never be distributed.
coupled-audio = ["elektron-native-boot/sharc", "elektron-native-boot/play", "dep:sharc-fast-cl", "dep:sharc-native"]
# A second generated core (SHARC_GEN_DIR_2) next to the first: the firmware's device picks the core
# (src/dsp_core.rs). Implies coupled-audio.
second-core = ["coupled-audio", "elektron-native-boot/second-core", "dep:sharc-native-2", "dep:sharc-fast-cl-2"]
# Enable this with coupled-audio; it forwards only to the optional native core.
region-profile = ["sharc-native?/region-profile"]
# Exact ColdFire instruction mix per PC (boot/src/cfmix.rs); DIGI_CF_MIX_OUT=DIR makes coupled-run write it.
cf-mix = ["elektron-native-boot/cf-mix"]
# SHARC_FAST_DUMP kernel and call capture (--diag dump); the hooks are absent otherwise.
fast-dump = ["sharc-native?/fast-dump"]

[dependencies]
device-profile = { path = "../device-profile" }
elektron-native-boot = { path = "../boot" }
emmc-card = { path = "../card" }
serde_json = "1"
sha2 = "0.10"
sharc-fast-cl = { path = "../sharc-fast-cl", optional = true }
sharc-native = { path = "../sharc", optional = true }
sharc-native-2 = { path = "../sharc-2", optional = true }
sharc-fast-cl-2 = { path = "../sharc-fast-cl-2", optional = true }

[[bin]]
name = "coupled-run"
path = "src/bin/coupled_run.rs"
required-features = ["coupled-audio"]

[dev-dependencies]
plusdrive-format = { path = "../plusdrive" }
