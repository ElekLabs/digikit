[package]
name = "plusdrive-format"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Portable +Drive metadata format primitives"

[lib]
name = "plusdrive_format"
path = "src/lib.rs"

[dependencies]
dksample = { path = "../../dksample" }
dkneeds = { path = "../../dkneeds" }
emmc-card = { path = "../card" }
device-profile = { path = "../device-profile" }
dt2-firmware-loader = { path = "../loader" }
sha2 = "0.10"

[[bin]]
name = "plusdrive"
path = "src/bin/plusdrive.rs"
