[package]
name = "live-audio"
license.workspace = true
repository.workspace = true
version = "0.0.1"
edition = "2024"
publish = false
description = "Live audio output path for the Digitakt II emulator: a lock-free SPSC ring, a FIFO repeater for SPI2 TX frames, and a cpal real-time output callback. No SHARC+ semantics live here (see packages/emulator/sharc); this crate is driven by frame sources, one of which will later be the native SHARC core."

# cpal is Em-approved for audio output. Everything else stays on std: this
# crate's own job (ring buffer, repeater, WAV decode, C ABI) needs nothing
# else.
[dependencies]
cpal = "0.18"
dynlib = { path = "../dynlib" }

[lib]
name = "live_audio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "live_play"
path = "src/bin/live_play.rs"
