[package]
name = "digi-wasm-core"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The browser core: the raw wasm ABI over the ColdFire emulator and, with `sharc`, the coupled SHARC+ engine"

[lib]
name = "digi_wasm_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostic-profile = ["elektron-native-boot/diagnostic-profile"]
diagnostic-events = ["elektron-native-boot/diagnostic-events"]
# Opt-in live ColdFire<->SHARC+ coupling (SharcPeer). Needs SHARC_GEN_DIR at
# build time for real DSP execution (see packages/emulator/sharc/build.rs).
sharc = ["sharc-peer/sharc", "dep:sharc-peer", "dep:sharc-native", "dep:sharc-gen"]
# The browser core runs the DSP fast tier as wasm kernels the page compiles
# (packages/emulator/sharc-fast-wasm `host`): digi_sharc_fast.
fast-wasm = ["sharc", "dep:sharc-fast-wasm"]

[dependencies]
elektron-native-boot = { path = "../boot" }
periph = { path = "../periph", default-features = false }
serde_json = "1"
sharc-peer = { path = "../sharc-peer", optional = true }
sharc-native = { path = "../sharc", optional = true }
sharc-gen = { path = "../sharc-gen", optional = true }
sharc-fast-wasm = { path = "../sharc-fast-wasm", optional = true }
