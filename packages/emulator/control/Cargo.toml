[package]
name = "digi-control"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Host-agnostic emulator controller and control protocol (JSON-RPC over NDJSON), shared by the desktop app and the headless daemon"

[lib]
name = "digi_control"
# No doctests here (only text blocks). Compiling them links digi_coupled from the shared
# target dir, which a parallel verify step may be rebuilding with other features (E0463).
doctest = false

[features]
default = ["server"]
# Unix-socket transport and the discovery file (unix only; not for wasm).
server = []
# Local-only DN2 coupling: generated DSP code must never be distributed.
# ColdFire path/PC profile (`cf.profile` method).
cf-profile = ["elektron-native-boot/cf-profile"]
# DSP execution counts (`sharc.profile` method): per-entry dispatch costs of the fast and block tiers plus interpreted PC counts.
sharc-profile = ["coupled-audio", "digi-coupled/region-profile"]
coupled-audio = ["digi-coupled/coupled-audio"]
# Both devices' generated cores in one binary (SHARC_GEN_DIR and SHARC_GEN_DIR_2).
second-core = ["coupled-audio", "digi-coupled/second-core"]

[dependencies]
digi-coupled = { path = "../coupled" }
dt2-firmware-loader = { path = "../loader" }
elektron-native-boot = { path = "../boot" }
emmc-card = { path = "../card" }
patchkit = { path = "../../patchkit" }
plusdrive-format = { path = "../plusdrive" }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "digi-emud"
path = "src/bin/digi_emud.rs"
required-features = ["server"]
