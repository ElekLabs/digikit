[package]
name = "elektron-native-boot"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Bounded Oracle cold-boot diagnostic runner"

[lib]
name = "elektron_native_boot"
crate-type = ["rlib"]

[features]
default = []
diagnostic-profile = []
diagnostic-events = []
# Host-time and PC profile of the ColdFire execution paths (src/cfprof.rs).
cf-profile = []
# Exact executed-instruction mix per PC and operand references per region (src/cfmix.rs).
cf-mix = []
# Opt-in PCM playback through packages/emulator/live (cpal output ring).
play = ["dep:live-audio"]

[dependencies]
coldfire = { path = "../coldfire" }
device-profile = { path = "../device-profile" }
dt2-firmware-loader = { path = "../loader" }
emmc-card = { path = "../card" }
machine = { path = "../machine" }
patchkit = { path = "../../patchkit" }
periph = { path = "../periph", default-features = false }
plusdrive-format = { path = "../plusdrive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
live-audio = { path = "../live", optional = true }
