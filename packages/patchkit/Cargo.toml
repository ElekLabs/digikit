[package]
name = "patchkit"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Firmware modules for Digitakt II and Digitone II: port lockfiles, linker, patch apply, verify"

[lib]
name = "patchkit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "patchkit"
path = "src/main.rs"

# The patch-time tool: no generated SHARC core, no toolchain. Builds in seconds and for wasm32.
[dependencies]
dt2-firmware-loader = { path = "../emulator/loader" }
coldfire = { path = "../emulator/coldfire" }
dkaddrmap = { path = "../dkaddrmap" }
dksharc = { path = "../dksharc" }
dkneeds = { path = "../dkneeds" }
dkupload = { path = "../dkupload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9.12"
# `patchkit build`: reads the ELF objects of the ColdFire toolchain. Read-only, no_std features: builds for wasm32.
object = { version = "0.37", default-features = false, features = ["read_core", "elf"] }
# `patchkit build` for SHARC+: the public Selache assembler as a library, at the commit tools/patchkit/pk_toolchains.py pins
# (SELACHE_REV; a test keeps the two equal). Pure Rust, std only: builds for wasm32.
selas = { git = "https://github.com/ElekLabs/selache", rev = "967c1d1e4d02e41f483181964f0ba333558a1fa7" }
selelf = { git = "https://github.com/ElekLabs/selache", rev = "967c1d1e4d02e41f483181964f0ba333558a1fa7" }
selinstr = { git = "https://github.com/ElekLabs/selache", rev = "967c1d1e4d02e41f483181964f0ba333558a1fa7" }
# The instruction decoder of the SHARC+ runtime (public ISA table): the re-decode of every assembled instruction. No dependencies.
sharc-rt = { path = "../emulator/sharc-rt" }
regex-lite = "0.1"
# Readable names of Rust symbols in the address map (no_std features: builds for wasm32).
proc-macro2 = { version = "1", default-features = false } # tokenize Rust for service-check
rustc-demangle = "0.1"
# The settings record's decoder (the code the runtime uses); no_std, builds for every target.
dkrt-sdk = { path = "../../runtime/core/sdk" }
# The fit rule (the code the DIGIKIT menu runs); no_std, builds for every target.
dkrt-fit = { path = "../../runtime/core/fit" }

# `patchkit store dump` reads card images, `patchkit flash` sends to a MIDI port: the binary only (not wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.11"
tempfile = "3"
plusdrive-format = { path = "../emulator/plusdrive" }
emmc-card = { path = "../emulator/card" }
# `patchkit budget` reads the rule of dkprof; dkprof has its own wasm, so patchkit.wasm leaves it out and stays small.
dkprof = { path = "../dkprof" }
# Native system package validation uses the resident ABI of this build.
dkrt-abi = { path = "../../runtime/core/abi" }
# `patchkit records --check` runs the inherent `validate` of the service that owns each record kind (src/record_rules.rs): no core, no host fake.
# They are optional (feature `record-rules`): a library user (digi-control, the app) does not build them.
dkrt-svc-lfo = { path = "../../services/lfo", optional = true }
dkrt-svc-shortcuts = { path = "../../services/shortcuts", optional = true }
dkrt-svc-fx = { path = "../../services/fx", optional = true }
dkrt-svc-machines = { path = "../../services/machines", optional = true }

[features]
# `patchkit records --check`: the validators of the services. Enabled for the patchkit binary build and the patchkit tests (tools/nx/cargo.mjs), not for
# library users (the daemons), so the services' sources are no build input of a daemon. Not for wasm32.
record-rules = ["dep:dkrt-svc-lfo", "dep:dkrt-svc-shortcuts", "dep:dkrt-svc-fx", "dep:dkrt-svc-machines"]

[dev-dependencies]
machine = { path = "../emulator/machine" }
