# Front-panel drawing for Syntakt, read by packages/workbench-core/src/data/faceplates.ts.
#
# Positions are centres in millimetres from the panel's top-left corner,
# measured from a top-view photo (screws as reference, about 0.5 mm accuracy).
# Legends are the printed silkscreen.
# Codes are wire positions of the Syntakt panel (devices/syntakt.toml [panel], finding 70 "Panel sweep"): code = channel * 8 + bit + 1.

[faceplate]
device = "syntakt.toml"
width = 215.0
height = 176.0
accent = "#d2566c"
func_legend = "#682e34"
wordmark = "digikit"

[display]
bezel = [33.0, 22.1, 107.3, 73.2]
glass = [39.5, 28.9, 100.6, 62.1]
wordmark = [39.1, 70.2]

# One row of four pattern-page LEDs (1:4 to 4:4).
[leds]
x = [185.7, 191.7, 197.7, 203.8]
y = [102.3]
r = 1.5
# The keyboard LED under the TRK key. Its panel LED index is not known yet (finding 70), so it is never lit.
extra = [{ x = 20.3, y = 118.0, r = 1.2 }]

[controls]
screws = [
  { x = 9.8, y = 4.9 },
  { x = 100.0, y = 5.2 },
  { x = 205.1, y = 4.9 },
  { x = 9.8, y = 170.6 },
  { x = 100.6, y = 170.9 },
  { x = 204.8, y = 171.2 },
]
# style: jack (connector labels), label, sub (grey), dim, icon (the headphones glyph), updown (a label with a small up/down glyph
# before it), split (the part before the first "/" in the silk colour, the rest in the accent colour)
