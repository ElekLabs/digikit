# Only writes to that array show: p-lock, sound lock, LFO and MIDI CC take other paths (docs/findings/119-param-change-observer.md).
[[log.kind]]
id = 42
name = "PARAM_CHANGE"
args = ["track", "index", "old", "new", "-"]

# a module of the boot selection did not load because a module it imports from is not in the image (right after its MOD_LOAD with result E_IMPORT, error level):
# the selection index and the name of the missing module without the `core/` prefix (usb-bulk), 12 characters in three words. Also in DkrtBootInfo.needs.
[[log.kind]]
id = 43
name = "MOD_NEEDS"
args = ["index", "name0", "name1", "name2", "-"]

# a module was committed (its builder calls checked and its rows written; info level, kept at boot): the selection index (0xffffffff: not a boot load),
# `rows` = machine_rows | param_rows << 8 | page_rows << 16 (the rows the module's own declarations use: what `module:check` writes to `[uses]`), the RAM address and the byte
# size of the module's committed record block (the `register` section format of docs/design/digikit-registry.md, header and records, big-endian; it stays in the module's
# arena share while the module is loaded).
[[log.kind]]
id = 44
name = "MODULE_COMMIT"
args = ["index", "rows", "records_addr", "records_size", "-"]

# a machine of a module of api major 3 declared latched parameters (info level, once per such machine, right before its module's MODULE_COMMIT): the selection index
# (0xffffffff: not a boot load), the machine's ordinal in the module and its latch mask (bit w: the machine's parameter word w, its w-th parameter, is latched at note-on).
# The record block has no latched flag; `commit_records` reads the masks from these events.
[[log.kind]]
id = 45
name = "MODULE_LATCH"
args = ["index", "machine", "latched", "-", "-"]

# one event of the DSP link queue (info level; an error is at warn level; none is kept in the small ring): `what` 1 submit (owner, id, kind | steps << 8, bytes), 2 start
# (owner, id), 3 done (owner, id), 4 error (owner, id, link error code, step), 5 resend of a live word (slot, version, attempt), 6 live word taken (slot, version, window, word).
# The owner is 0 loader, 1 tracks, 2 core, 0xff a live word (its id is 0x8000 | slot).
[[log.kind]]
id = 46
name = "DSP_LINK"
args = ["what", "a", "b", "c", "d"]

[protocol]          # the digikit SysEx protocol (F0 7D 64 6B ...); docs/design/digikit-upload.md
version = 1         # the request version byte; a request with another version gets E_PROTO

[protocol.limits]   # sizes of the upload protocol; every host and the runtime take them from here
max_chunk = 32768   # bytes of one PUT chunk (DATA body); the runtime's BEGIN reply sends it
read_max = 768      # bytes of one READ (and SETTINGS) reply
peek_max = 512      # bytes of one PEEK reply
max_request_wire = 40960  # the largest request on the wire, SysEx-encoded (40 KiB)
max_reply_wire = 1024     # the largest reply on the wire, SysEx-encoded

[protocol.commands] # command numbers; never reuse or renumber (additive only)
INFO = 0x01
LIST = 0x02
MODULES = 0x03      # the loaded modules with their ranges, types and faults
CAPACITY = 0x04     # per resource: the limit, what is used and the largest free piece (kinds in [capacity.kinds])
LOADS = 0x05        # what this boot's selection did, for a host without the debug module: u8 version (1), u8 n, then per module i32 result (OK, a negative E_*, or LOADING), needs[12] (with E_IMPORT: the missing module, e.g. usb-bulk) and name[28] (file name), NUL padded
BEGIN = 0x10
DATA = 0x11
END = 0x12
DELETE = 0x13
CLEAR = 0x14
ABORT = 0x15
READ = 0x16         # a byte range of a store file: path, u32 offset, u32 length (at most 768); reply: u32 file size, the bytes
VERIFY = 0x17       # re-read a store file from the card and hash it: path; reply: sha256[32]
MKDIR = 0x18        # make a folder (a folder entry with nothing in it): path; ok when it exists
RENAME = 0x1a       # rename or move a file or an empty folder: from path NUL, to path NUL; the data and its hash stay, the folder it leaves stays
SETTINGS = 0x19     # read-only: the active settings record (docs/design/digikit-store.md, "The settings record"): u32 offset, u16 length (at most 768); reply: u8 copy (0 A, 1 B), u32 seq, u32 used, the bytes
FAULT = 0x23        # dev: make the runtime fail on purpose to test the fault path; body byte 0 = 1: a Rust panic (a bounds check)
SELECT = 0x30
RESTART = 0x31

[protocol.ranges]   # command numbers a run-time module may register with dk_host_register (a request number is 6 bits: bit 6 of the command byte marks a reply)
remote = [0x38, 0x3d]   # digikit/remote: key and turn of the panel (docs/plans/remote-control.md)
remote_state = [0x3e, 0x3f]   # digikit/remote: the state
probe = [0x32, 0x35]   # digikit/probe: collector status, raw reads, reset (docs/plans/debug-mode-and-probes.md)
debug = [0x20, 0x22]   # digikit/debug: LOG, PEEK, LOGCFG (docs/findings/46-digikit-debug.md)
file_write_test = [0x24, 0x27]   # test/file-write: start an I/O job that writes a file, its status, wake it, a file call outside an I/O step
usb_fast = [0x36, 0x37]   # usb-fast: SET_NONCE (the host proves which USB device is on its MIDI port, docs/plans/usb-fast.md section 5)
file_write_test_b = [0x28, 0x2b]   # test/file-write-b: the same commands for a second module
usb_echo_test = [0x2c, 0x2f]   # test/usb-echo: its status, hold, reenable, disable
entry_demo_test = [0x1c, 0x1d]   # test/entry-demo: its report (what init and tick saw), and a settings write that tick runs

[protocol.service]  # the commands of run-time service modules, by name; each lies in a range above (a module registers them with dk_host_register)
REMOTE_KEY = 0x38      # digikit/remote: code (u8), down (u8)
REMOTE_TURN = 0x39     # encoder (u8), delta (s8); the reply body is the delta taken (s8, at most 30 either way)
REMOTE_RELEASE = 0x3a  # release every key the module holds
LOG = 0x20             # digikit/debug: body u32 from_seq; reply u32 oldest, u32 newest, u8 n, then n events of 32 bytes
PEEK = 0x21            # digikit/debug: body u32 addr, u16 len (1 to 512, inside the device file's `[digikit] peek` ranges); reply u32 addr, u16 len, the bytes
LOGCFG = 0x22          # digikit/debug: body u8 op (0 get, 1 set: u8 default, 8 module levels); reply u8 default, 8 module levels, u8 debug_on (1 while loaded); op 2 = card log get (no more body), op 3 = card log set (body: u8 op=3, u8 on); reply for op 2 and op 3 (16 bytes): u8 on, u8 file (0 a, 1 b), u8 state (0 off, 1 on, 2 full, 3 error), u8 0, u32 writes (this boot), i32 last_status, u32 ms_since_write (0xffffffff = none yet); a debug module without the card log replies to op 2 with an error status
USB_FAST_NONCE = 0x36  # usb-fast: body nonce[8]; the module keeps it and returns it in the INFO reply of the bulk link; reply empty
REMOTE_STATE = 0x3e    # reply: enabled (u8, always 1 while the module is loaded), state format (u8), turn limit (u8)

[protocol.bulk]     # the bulk link: a vendor interface 2 (class 0xFF) on EP2 OUT/IN, no SysEx framing, big-endian (docs/plans/usb-fast.md section 5)
# request: magic[4] | cmd u8 | seq u8 | flags u16 | len u32 | body[len];  reply: magic[4] | cmd|reply_flag u8 | seq u8 | status i16 | len u32 | body[len]
magic = "DKB1"
reply_flag = 0x40   # set in the command byte of a reply
header = 12         # bytes of a request header and of a reply header
data_max = 65536    # bytes of one DATA request (offset u32 + up to this many data bytes, a multiple of 512 except the last)
align = 512         # DATA offsets and lengths are multiples of this, except the last piece
vid = 0x1935        # USB vendor id of Elektron
class = 0xFF        # interface class of the bulk interface
packet = 512        # the bulk packet size (high speed). An OUT transfer whose length is a multiple of this is followed by a zero-length OUT transfer (ZLP): the device RX buffers (16 KiB multi-page dTDs) complete only when full or on a short packet. The device keeps ZLT on for EP2 IN: after a reply that is a multiple of this the host receives a zero-length IN transfer, which means "no bytes", never end or error
nonce_len = 8       # bytes of the nonce of the identity handshake: SET_NONCE over SysEx, then INFO returns it (body: version u8, flags u8, reserved u16, data_max u32, align u32, nonce[8])
frame_slack = 64    # a frame whose body length exceeds data_max + 4 + this is a protocol error: fatal, the link is closed, no resync

[protocol.bulk.flags]     # bits of the `flags` u16 of a request header (BEGIN)
REPLACE = 0x0001    # the destination may exist: the device replaces it atomically at END (DN2: the store's replace commit; DT2: temp file, then rename); a failed or aborted upload keeps the old file. Clear: an existing file gives E_EXISTS

[protocol.bulk.commands]  # never reuse or renumber (additive only)
INFO = 0x01         # reply body: version u8, flags u8, u16 reserved, u32 data_max, u32 align, nonce[8] (20 bytes)
BEGIN = 0x02        # body: root u32, path (NUL-terminated), size u32, expected hash 4 bytes (all zero: none)
DATA = 0x03         # body: offset u32, then the bytes; the next offset only
END = 0x04          # reply body: the device's hash|1 of the file (4 bytes, big-endian)
ABORT = 0x05        # drop the open file
VERIFY = 0x06       # reserved, not implemented by usb-fast: the reply is E_PROTO (the host verifies over SysEx: DN2 VERIFY, DT2 file info; both are device-CPU bound with tiny replies)

[protocol.status]   # reply status codes of the upload commands (0 = ok); never renumber
E_MSG = { code = -50, text = "body too short or malformed" }
E_PATH = { code = -51, text = "path breaks the store rules" }
E_FULL = { code = -52, text = "not enough free sectors in the store" }
E_STATE = { code = -53, text = "no upload open (or not in this state)" }
E_OFFSET = { code = -54, text = "offset is neither the next byte nor a retry" }
E_LENGTH = { code = -55, text = "bad chunk length, or the file would pass its size" }
E_HASH = { code = -56, text = "the staged file does not match the file hash of BEGIN" }
E_WRITE = { code = -57, text = "the firmware's block write failed" }
E_READ = { code = -58, text = "the firmware's block read failed" }
E_NOFILE = { code = -59, text = "that path is not in the store" }
E_PROTO = { code = -60, text = "unknown protocol version, command or option" }
E_NOSTORE = { code = -61, text = "the store header is unreadable (CLEAR still works)" }
E_INUSE = { code = -62, text = "the card's store area is not ours and not blank" }
E_PEEK = { code = -63, text = "PEEK range not allowed, or length 0 or over 512" }
E_CMD_RANGE = { code = -64, text = "command range not reserved, taken, or empty" }
E_SET_KEY = { code = -66, text = "a settings key breaks the rules (1 to 47 printable ASCII characters)" }
E_SET_FULL = { code = -67, text = "the settings area is full" }
E_SET_NOKEY = { code = -68, text = "no such settings key (or no settings record)" }
E_SET_VALUE = { code = -69, text = "a settings value is too long, or the buffer is too small" }
E_SET_OFF = { code = -70, text = "settings store off: an older store reaches its area, or no store" }
E_FILE_IN_USE = { code = -71, text = "a sample is still loading from that file: wait and try again" }
E_AGAIN = { code = -72, text = "usb_bulk_send: the engine refused and nothing is in flight; wait for the wake, retry" }

[protocol.caps]     # INFO capability bits (bit numbers of the `caps` word)
LOG = 0
PEEK = 1
LOGCFG = 2
SELECT = 3
RESTART = 4
MODULES = 5
CAPACITY = 6
READ = 7
VERIFY = 8
SERVICE_CMDS = 9    # modules register commands (dk_host_register)
FOLDERS = 10        # LIST takes a prefix, MKDIR, CAPACITY kind STORE
SETTINGS = 11       # the SETTINGS command (read the settings record), CAPACITY kind SETTINGS
FILEHASH = 12       # store format 4: the 32-byte hash of BEGIN, END, LIST and VERIFY is the content hash (4 bytes, big-endian, then 28 zeros), not a SHA-256
RENAME = 13         # the RENAME command (rename or move one store entry)
READBACK = 14       # END (and the SDK file_close) read the written file back from the card and compare its content hash with the running hash and BEGIN's before the commit: a host may skip its VERIFY after a successful END
LOADS = 15          # the LOADS command (the result of each module of the boot selection, and the missing module of an E_IMPORT)

[capacity.kinds]   # the `kind` byte of a CAPACITY entry (u8 kind, u32 limit, u32 used, u32 largest); additive: a number is never reused.
                   # `fit = true`: a resource a fit looks at, with its `label` for a person (CAP_FIT in the generated code); every kind is in CAP_KINDS
MODULES = { id = 1, fit = true, label = "module records" }   # module records; used: loaded; largest: 0
SELECTION = { id = 2, fit = true, label = "selection paths" }   # paths of the selection record; used: paths this boot loaded
ARENA = { id = 3, fit = true, label = "CPU memory" }   # ColdFire arena bytes; used: taken (headers included); largest: the largest free block's payload
STAGE = { id = 4, fit = true, label = "file" }   # the staging buffer: the largest .dkm file; used: 0
DSP_AREA = { id = 5, fit = true, label = "DSP memory" }   # DSP run-time area bytes; used: taken, alignment gaps counted as free; largest: the largest free range
MACHINE_ROWS = { id = 6, fit = true, label = "machine rows" }   # run-time machine types (registry machine rows) in use
VOICE_ROWS = { id = 7, fit = true, label = "voice rows" }   # DSP voice rows in use
PARAM_ROWS = { id = 8, fit = true, label = "parameter rows" }   # parameter rows core/dynreg reserves, in use
PAGE_ROWS = { id = 9, fit = true, label = "page rows" }   # page rows core/dynreg reserves (Digitone II), in use
FX_SLOTS = { id = 10, fit = true, label = "effect slots" }   # effects in the chain: the device's limit (`[limits] fx_slots`); used: run-time effects claimed (the effect rows of core/dynfx); largest: 0
MAP_ENTRIES = { id = 11 }   # sticky machine-type map entries in use
STORE = { id = 12 }   # the module and sample store, in KiB (a store can be 22 GiB); used: KiB taken; largest: 0 (BEGIN says E_FULL with the free bytes)
SETTINGS = { id = 13 }   # the settings record, in bytes: limit: the area of one copy (`[settings]`); used: the record's bytes (header and entries); largest: 0
SEND_SLOTS = { id = 14 }   # effects that run on a send bus: the device's limit (`[limits] send_slots`, 0 when the image has no send page); used: loaded effects with the send route; largest: 0

# The in-crate services of the runtime, in the order the core calls them (samples first: its DSP-section checks and its track-table claim ran before the
# voice and effect parts, and the unreserve of its table before theirs; machines before fx: the registry applies machines, pages and native pages before
# effect pages, and the removal runs the other way round). `rust` is the type that implements `Service` in the runtime crate (path from its root).
# `patchkit gen` writes the static table of these rows (modules/core/runtime/src/rs/src/gen_services.rs); a new service is a row here, its folder in
# src/services/ and its `[records.kinds]`.
[[service]]
name = "samples"
rust = "services::samples::records::Samples"

[[service]]
name = "machines"
rust = "services::machines::records::Machines"

[[service]]
name = "fx"
rust = "services::fx::records::Fx"

# The record kinds of the `register` section of a `.dkm` (docs/plans/runtime-and-services.md R7): one table for the runtime, dkneeds and patchkit
# (`patchkit gen` writes `records::KINDS` and one `KIND_<NAME>` and `LEN_<NAME>` per kind into gen_sdk.rs and packages/dkneeds/src/gen_limits.rs).
# `len` is the whole record, the 8-byte header (kind, length) included. `service` is the in-crate service that owns the kind: it checks, applies and
# removes the records. A number is never reused. A kind is added here and in its service only; the registry, the collector, the loader, dkneeds and
# patchkit do not name it. `generic = true`: a module emits the record with `dk_record_add(ctx, kind, bytes, len)` (the typed kinds have their builders); the
# owning service checks it at the commit.
[records.kinds]
PARAM = { id = 1, len = 0x50, service = "machines" }
MACHINE = { id = 2, len = 0x6c, service = "machines" }
PAGE = { id = 3, len = 0x60, service = "machines" }
EFFECT = { id = 4, len = 0x1a4, service = "fx" }
ACTION = { id = 5, len = 0x10, service = "machines" }
NATIVE_PAGE = { id = 6, len = 0x90, service = "machines" }
NATIVE_PAGE_V2 = { id = 7, len = 0x98, service = "machines" }

# The resources a module counts in its `uses` (R7, the header table of a `.dkm`): one id each. `capacity` names the [capacity.kinds] entry the
# runtime reports for it. `reserved = true`: the id is taken and no module counts it yet.
[records.resources]
MACHINE_ROWS = { id = 1, capacity = "MACHINE_ROWS" }
PARAM_ROWS = { id = 2, capacity = "PARAM_ROWS" }
PAGE_ROWS = { id = 3, capacity = "PAGE_ROWS" }
RECORD_BYTES = { id = 4 }     # arena bytes of the record block `init` commits
DSP_COST = { id = 5, reserved = true }   # DSP cycles of a module (S5, docs/plans/sdk.md); not counted yet

[limits.max]        # contract maxima (capacity plan, docs/plans/capacity-isolation.md): a device's `[limits]` value in devices/*.toml may not exceed them
                    # (`patchkit gen` refuses it). Names are the keys of `[limits]` and, for dsp_area_bytes, of `[digikit]`.
modules = 8         # module records: the selection record holds SEL_MAX = 8 paths (record format, modules/core/runtime/sdk/src/lib.rs)
map_entries = 8     # sticky machine-type map entries: MAP_N = 8 (record format: bytes 28-31 and 480-507)
fx_slots = 4        # effects in the chain: DK_FX_MAX of [fx] (kept equal by packages/patchkit/tests/sdkgen.rs)
send_slots = 2      # effects on a send bus: the Sound array's free indices a send page can use, [fx] send_indices (at most SEND_MAX = 2 in core/fxpages)
dsp_area_bytes = 524288  # the 17-bit word offset of a core/dsp-link chunk reaches 2^17 words
param_rows = 16     # parameter rows core/dynreg reserves (tied to its manifest by packages/patchkit/tests/devdata.rs)
page_rows = 8       # page rows core/dynreg reserves (Digitone II)
machine_rows = 8    # run-time machine types core/dynreg reserves (tied to its manifest by packages/patchkit/tests/devdata.rs)
stage_bytes = 65536  # the runtime's staging buffer: the largest .dkm file (patchkit refuses a larger one)

[limits.format]     # format limits of the `.dkm` loader (packages/dkneeds, modules/core/runtime/src/rs/src/loader.rs, dsp.rs, arena.rs); generated into every language
                    # (`patchkit gen`: dkneeds::NAME, dkproto.py, gen_proto.ts). Also generated, from other keys: MAX_VOICES ([limits.max] machine_rows) and MAX_FX ([limits.max] fx_slots).
dkm_header = 160    # 0xa0: the header of a `.dkm` (init, fini, menu and tick offsets, the keys table pair at 0x90/0x94, then the tables follow); `dkneeds::HEADER`
# The header table of a `.dkm` (spec: packages/dkneeds/src/keys.rs; patchkit writes it, the runtime, the boot planner, dkneeds and the host tools read it). The header
# pair at 0x90 and 0x94 is `table_off` and `table_size` (bytes from the start of the file; `table_off` is a multiple of 4). A versioned, tagged table, big-endian:
#   +0  u32 magic "DKTB" (`table_magic`)   +4  u16 version (`table_version`)   +6  u16 n_entries
#   then, in ascending tag order, each tag at most once: u16 tag, u16 count, u32 payload_bytes, the payload.
# Tags: 1 NEEDS (service name hash, minimum version, hard or optional), 2 USES (resource id, count; ids in [records.resources]), 3 KEYS (record kind, n, keys: the
# machine keys, effect ids and the keys of a service's kind), 4 KINDS (kind, length, handler entry: a service module's kinds), 5 SLOTS, 6 HOOKS, 7 EXPORTS, 8 RESOURCES.
# A module that needs and keeps nothing has the 8-byte head. A file with no table, or another magic, is the format of runtime 0.7: E_CONTRACT.
dsp_header = 64     # 0x40: the header of the DSP section
max_records = 32    # records of the `register` table
max_relocs = 4096   # ColdFire relocations
max_imports = 32    # imports of the DSP section
max_cf_imports = 64  # imports of the ColdFire import table (a different table from the DSP section's)
max_state_voices = 64  # voice states of one voice record
max_state_bytes = 16777216  # bytes of one voice state (1 << 24, the loader's most: the DSP area)
granule = 64        # the DSP area's placement granule
dsp_slack = 8       # bytes the DSP range may start before its alignment
arena_hdr = 16      # the arena's block header
table_magic = 1145390146  # 0x444b5442 "DKTB": the first word of the header table of a `.dkm` (packages/dkneeds/src/keys.rs); another word is a file of the 0.7 format
table_version = 1   # the version of the header table (a change is a MINOR of the runtime)
collect_bytes = 7078  # `size_of::<Collect>()` of the runtime's collect.rs on the ColdFire: the builder calls of one `init`, held in an arena block until the commit (the runtime checks it at compile time; the host's struct has more padding)

# The settings store (docs/design/digikit-store.md, "The settings record"): one record in two copies in the store range, next to the selection
# record. `sectors` is the size of ONE copy; the runtime keeps the record in RAM and writes the copy that is not current. The area is part of the
# store's tail (`store::TAIL`), and `[card.store] settings_sectors` of the device files must equal `copies * sectors` (patchkit gen refuses another value).
[settings]
copies = 2
sectors = 16        # per copy: 8 KiB
key_max = 47        # bytes of a key (printable ASCII 0x21 to 0x7e)
value_max = 1024    # bytes of a value

# The keys by owner. A key that starts with `prefix` is owned by that part of digikit; `value` names the decoding that the host readers
# (`patchkit store dump`, tools/device/dksettings.py) print: `u8` one byte, `route` one byte (0 master, 1 send), `u8x16` sixteen bytes (one per track).
# A run-time module will own `<module id>/...` (reserved, not built: no module API yet).
[[settings.key]]
prefix = "fx/route/"    # + the module id: where the effect runs
value = "route"

[[settings.key]]
prefix = "fx/send/"     # + the module id: the send amounts of the 16 tracks, 0 to 127
value = "u8x16"

[load.status]       # result codes of `dkrt_load` and the boot-time selection (also the status of SELECT); never renumber
E_NOT_FOUND = { code = -1, text = "no store, or no such file or module" }
E_BAD_STORE = { code = -2, text = "store header or table check failed" }
E_READ = { code = -3, text = "the firmware's block read failed" }
E_SHA = { code = -4, text = "store file hash or .dkm sha256 does not match" }
E_FORMAT = { code = -5, text = "bad magic, version, bounds or alignment of the .dkm" }
E_RUNTIME = { code = -6, text = "the module needs a newer runtime" }  # reserved
E_IMPORT = { code = -7, text = "an import is unknown, or a provider the module needs is absent" }
E_NOMEM = { code = -8, text = "arena full" }
E_INIT = { code = -9, text = "init returned non-zero" }
E_LOADED = { code = -10, text = "a module of that name is loaded" }
E_BUSY = { code = -12, text = "a task is still inside the module, or the store is in use (try again)" }
E_TOO_BIG = { code = -13, text = "larger than the staging buffer" }
E_TABLE_FULL = { code = -14, text = "no free module record" }
E_LOST = { code = -15, text = "the sample backing was lost and the reload failed" }
E_POOL = { code = -16, text = "the sample pool is full" }
E_CHANGED = { code = -17, text = "the sample file differs from the selection snapshot" }
E_EXISTS = { code = -18, text = "the file exists already (dk_files_create does not overwrite)" }
E_CONTEXT = { code = -19, text = "the call is not allowed in this context (dk_files_* writes run in an I/O step)" }
E_NO_REGISTRY = { code = -20, text = "register records, but the image has no registry" }
E_REG_DEVICE = { code = -21, text = "the records are for another device" }
E_TYPE_RANGE = { code = -22, text = "machine type outside the range, or bad clone_of" }
E_TYPE_USED = { code = -23, text = "the type number is in use" }
E_PARAM_FULL = { code = -24, text = "no free reserved parameter row" }
E_PAGE_FULL = { code = -25, text = "no free reserved page row (Digitone II)" }
E_TYPE_IN_USE = { code = -26, text = "reserved (hot reload is archived); never returned" }
E_DECL_ID = { code = -27, text = "a builder call names a machine or effect id that the keys table of the header lacks" }
E_DECL_USES = { code = -28, text = "init declared more machine, param or page rows than the [uses] counts of the header say" }
E_FX_ID_DUP = { code = -29, text = "an effect id of the module is already loaded (or twice in the module)" }
E_DECL_FULL = { code = -74, text = "init made more builder calls than the record limit allows" }
E_PLAN_KIND = { code = -75, text = "the boot plan refused the module: a record kind of its header table has no owning service" }
E_PLAN_OWNER = { code = -76, text = "the boot plan refused the module: another module owns the kind, slot or hook site it takes" }
E_PLAN_KEY = { code = -77, text = "the boot plan refused the module: another module of the selection has the same key for a kind" }
E_PLAN_FIT = { code = -78, text = "the boot plan refused the module: its uses do not fit what the earlier modules of the selection left" }
E_DECL_KIND = { code = -79, text = "a service declared a record kind that the header table does not carry, or with another length" }
E_NO_DSP = { code = -30, text = "DSP code in the file, no DSP loader in the image" }
E_DSP_FORMAT = { code = -31, text = "the DSP section is malformed" }
E_DSP_IMPORT = { code = -32, text = "a DSP symbol is not exported by the image" }
E_DSP_NOSPACE = { code = -33, text = "no free range in the DSP area" }
E_DSP_ROWS = { code = -34, text = "no free voice or effect row" }
E_DSP_XFER = { code = -35, text = "the transfer to the DSP failed or timed out" }
E_DSP_DEVICE = { code = -36, text = "the DSP code is for the other device" }
E_DSP_TYPE = { code = -37, text = "voice type out of range, or used by another module" }
E_SEL_PATH = { code = -40, text = "a selection path is empty, too long or bad" }
E_SEL_COUNT = { code = -41, text = "more selection paths than the record holds" }
E_SEL_WRITE = { code = -42, text = "the firmware's block write failed" }
E_CARD_BUSY = { code = -43, text = "a card transfer is in flight" }
E_SAFE_MODE = { code = -44, text = "this boot is in safe mode: no module was loaded" }
E_BOOT_ONLY = { code = -45, text = "the module set is fixed after the boot hook" }
E_RANGE = { code = -46, text = "a card write outside the store range" }
E_CARD_RO = { code = -47, text = "the card's store area is not ours and not blank" }
E_CONTRACT = { code = -48, text = "the module needs another runtime version than this one (another major or minor, or a higher patch)" }
E_TABLE = { code = -49, text = "the runtime's tables failed their check" }
E_MISSING = { code = -73, text = "the service is not in the image (the module that provides it is not loaded)" }

[sample]            # the sample pool contract (<dk/sample/pool.h>, dsp/sample/pool.inc); `patchkit gen` writes sdk/include/dk/gen/sample.h and sdk/dsp/contract/dk_sample_pool.inc (DK_SAMPLE_POOL_*) from it
peak_bins = 512     # bins of sample_pool_peaks
window_max = 128    # most columns of sample_pool_peaks_window
pool_entries = 16   # entries of one pool (DK_SAMPLE_POOL_ENTRIES)
pool_entry = ["ready", "token", "frames", "rate", "channels", "fmt", "base_l", "base_r"]   # the 32-bit words of dk_sample_pool_entry
pool_ctl = ["closed", "count", "fault"]   # the words of one control set
pool_ctl_words = 4  # words reserved for one control set
