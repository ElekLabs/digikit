# The module contract: version numbers, log kinds and the SysEx protocol numbers. `patchkit gen` writes
# modules/core/runtime/sdk/src/gen_sdk.rs, tools/device/dklog_kinds.py, tools/device/dkproto.py and
# packages/dkupload/src/gen_proto.rs, packages/dk-session/src/gen_proto.ts, sdk/dsp/contract/dk_machine.inc, sdk/dsp/contract/dk_fx.inc,
# sdk/dsp/contract/dk_sample_pool.inc, sdk/include/dk/core/status.h and sdk/include/dk/gen/machine_consts.h, fx_consts.h, machine.h, fx.h, imports.h, page_consts.h, limits.h
# and sample.h from this file (`patchkit gen --check` fails when they are stale).

[runtime]           # the digikit runtime release: the one version of the SDK (semantic version; packed major<<16 | minor<<8 | patch)
table = "0.8.0"     # the runtime version that introduced the header table of a `.dkm` (R7): `patchkit pack` writes at least this as the version the module needs, so the loader refuses a module of the 0.7 format with E_CONTRACT
version = "0.8.0"   # 0.x (stable is 1.0.0): a MINOR may break (an import changed or removed, the module file format, the store format, the SysEx protocol); a PATCH only adds
# The one-version rule (docs/plans/sdk.md section 5.1): every `[[import]]` has `since`, the runtime version that added it (a string "0.7.0"; S3 is breaking, so every import has 0.7.0).
# `patchkit pack` writes the newest `since` among the imports a module links into the `.dkm` header (word 0x30, the runtime version the module needs; bit 31 is the trace flag,
# 0 when the module links no service import). The runtime loads a module only when that version has the runtime's MAJOR and MINOR and a PATCH at most the runtime's; otherwise
# the load fails with E_CONTRACT. There is no other version number: the machine and effect contract structs of this file change only with a MINOR.

# The opaque handle types of the service imports (`dk_module_ctx *ctx`, `dk_settings **out`). `patchkit gen` writes `typedef struct <name> <name>;` for each into
# sdk/include/dk/gen/imports.h; in Rust a handle is a `u8` pointer. The runtime, or the provider module, gives one out in `init`.
[handle]
types = ["dk_module_ctx", "dk_settings", "dk_files", "dk_sample_pool", "dk_ui", "dk_ui_menu", "dk_input", "dk_usb_bulk", "dk_dsp_link", "dk_sdhc_large", "dk_machine", "dk_fx", "dk_page", "dk_param", "dk_page_frame", "dk_page_event"]
services = ["runtime", "samples", "machines", "fx", "ui", "input", "usb_bulk", "dsp_link", "sdhc_large"]
contexts = ["init", "ui", "io-step", "any", "isr"]

# The callback types of the service imports (docs/plans/sdk.md section 10, Naming). The key ends in `_fn`; the C type is `dk_<key>` (the generated
# imports header writes the typedef) and the Rust type `<Key>Fn`. A user-data pointer is `arg`; `ctx` is only the module context.
[handle.callbacks]
# A host command handler (`dk_host_register`), in the firmware's MIDI task: short, no waiting. `body` is the request body (`len` bytes, at most 160); the reply body goes to
# `out` (at most 879 bytes). Returns the number of reply bytes (0 or more: status ok), or a negative status (sent as the reply's status with no body).
host_cmd_fn = "i32 (u32 cmd, u32 seq, const void *body, u32 len, void *out)"
# The deferred notification of a listing request (`dk_files_list`), in the UI task: a coalesced readiness hint; poll `request`.
files_event_fn = "void (u32 client, u32 request, i32 state, void *arg)"
# A background job step (`dk_job_post`), in the worker task: it computes on its own memory and calls no import. Returns DK_JOB_MORE (1) to be called again, 0 when finished, or a negative error.
job_step_fn = "i32 (void *arg)"
# The end of a background job, in the UI task, once. `status` is the last step's result, or DK_JOB_E_CANCELLED.
job_done_fn = "void (void *arg, i32 status)"
# One frame of a boot animation (`dk_intro_take`), on the intro task: the 1024-byte native bitmap of `tick`, or NULL to end the animation. No import calls.
intro_frame_fn = "const u8 *(u32 tick, void *arg)"
# The end of a boot animation, in the UI task, once, at the first UI pass.
intro_done_fn = "void (void *arg)"
# A step of an I/O job (`dk_io_post`), in the runtime's I/O task: it may block and call dk_files_*. Returns DK_IO_MORE (1), DK_IO_WAIT (2), 0 or a negative error.
io_step_fn = "i32 (void *arg)"
# The end of an I/O job, in the UI task, once. `status` is the last step's result, or DK_IO_E_CANCELLED.
io_done_fn = "void (void *arg, i32 status)"
# A menu row action or change (`dk_ui_menu_add_action`, `dk_ui_menu_add_toggle`, `dk_ui_menu_add_value`), in the UI task: `arg` is the pointer the row was added with, `value` the
# value the row was added with (an action) or the new value.
ui_action_fn = "void (void *arg, i32 value)"
# The end of a YES/NO dialog (`dk_ui_confirm`), in the UI task, after the dialog closed: `yes` is 1 for YES, 0 for NO.
ui_confirm_fn = "void (void *arg, i32 yes)"
# The end of a choice dialog (`dk_ui_choice`), in the UI task, after the dialog closed: the index of the chosen item.
ui_choice_fn = "void (void *arg, i32 index)"
# A UI-task timer (`dk_ui_tick`): short, it runs between key events and must not wait.
ui_tick_fn = "void (void *arg)"
# The click of a machine parameter's knob (`dk_param_on_click`), in the UI task, when the knob is clicked on the machine's page (release without a turn): `track` is the track of the page.
# Replaces `void FN(uint32_t track)` of DK_PARAM_ACTION; `arg` is the pointer given to `dk_param_on_click`.
param_click_fn = "void (void *arg, u32 track)"
# The draw callback of a canvas page (`dk_page_canvas`), in the UI task: `frame` is a `const dk_page_frame *` (<dk/page/page.h>), valid for this call only. Replaces `void DRAW(const dk_page_frame *)`.
page_draw_fn = "void (void *arg, const dk_page_frame *frame)"
# The event callback of a canvas page (`dk_page_canvas`), in the UI task: `event` is a `const dk_page_event *` (<dk/page/page.h>), valid for this call only. Replaces `void EVENT(const dk_page_event *)`.
page_event_fn = "void (void *arg, const dk_page_event *event)"

# The machine contract's numbers (sdk/include/dk/gen/machine.h is the generated C view; it includes the generated sdk/include/dk/gen/machine_consts.h).
# `patchkit gen` writes sdk/dsp/contract/dk_machine.inc and sdk/include/dk/gen/machine_consts.h from this table: the constants, then the byte and word offsets of the fields (all 4 bytes).
[machine]
consts = [
    { name = "DK_MACHINE_V1", value = 1, doc = "Contract version." },
    { name = "DK_BLOCK", value = 32, doc = "Samples per call, 48 kHz, both devices." },
    { name = "DK_MAX_PARAMS", value = 8, doc = "Hard cap (the device profile gives the real maximum)." },
    { name = "DK_MAX_VOICES", value = 16, doc = "Voices a machine runs at once on any device." },
    { name = "DK_OK", value = 0, doc = "Returned by render: block written, voice continues." },
    { name = "DK_DONE", value = 1, doc = "Returned by render: block written (may be silence), voice has ended." },
    { name = "DK_STEREO", value = 2, doc = "Or-ed into the status of render by a stereo machine (contract 1.2): `out_r` was written this block. DK_OK | DK_STEREO and DK_DONE | DK_STEREO. Without it the adapter treats the block as mono (L copied to R)." },
    { name = "DK_MACHINE_STEREO", value = 256, doc = "Or-ed into dk_machine_desc.contract by a stereo machine (contract 1.2): the major number is the low byte (DK_MACHINE_V1)." },
    { name = "DK_MACHINE_GATE", value = 512, doc = "Or-ed into dk_machine_desc.contract by a machine that reads `gate` in dk_voice_in (contract 1.6)." },
    { name = "DK_P_PERCENT", value = 0, doc = "Word 0 .. 0x7f00, UI 0 .. 127." },
    { name = "DK_P_BIPOLAR", value = 1, doc = "0x4000 at rest, UI -64 .. +63." },
    { name = "DK_P_ENUM", value = 2, doc = "n steps, word = step * 256." },
    { name = "DK_P_PITCH", value = 3, doc = "Semitone offset, 0x4000 at rest, the adapter adds it to `pitch`." },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040, doc = "|sample| above DK_LEVEL_BOUND is a fault (+18 dB over full scale)." },  # 8.0f
    { name = "DK_MAGIC", value = 1145785665, doc = "'DKMA', the first word of dk_machine_desc." },             # 'DKMA' = 0x444b4d41
]
voice_in = ["pitch", "velocity", "block", "out", "track", "out_r", "gate"]           # struct dk_voice_in, DK_IN_*
desc = [
    "magic", "contract", "n_params", "voices", "state_bytes",
    "state_clear_bytes", "max_cycles_block", "max_cycles_note_on", "max_call_depth", "stack_bytes",
]                                                          # struct dk_machine_desc, DK_DESC_*

# The typed C view that `patchkit gen` writes sdk/include/dk/gen/machine.h from: `"<type> <name> // doc"` per field (4 bytes each; the names must equal
# `voice_in` and `desc` above, in order) and `"<ret> <name>(<args>) // doc"` per entry point. Types: u32 i32 float, pointers, `const`.
[machine.c]
intro = '''The numbers are in sdk/sdk.toml [machine], from which `patchkit gen` writes sdk/include/dk/gen/machine_consts.h (included here) and
   sdk/dsp/contract/dk_machine.inc for assembly. Each constant is documented in the consts header.'''
desc_doc = "One per module in read-only data, found by the manifest's symbol. No function pointers: the manifest names the entry symbols."
rules = '''Entry points (symbols named in the manifest). SHARC+ assembly, v1: the adapter enters with `I13 = return address;
   JUMP (M13, I12)` and the module returns with `JUMP (M13, I13)`. Arguments R4 = state, R8 = in, R12 = params; result R0.
   May clobber R0-R15, I0-I5, M1-M4, B3; must keep I6-I15, M0, M5-M15, L0-L7, MODE1.'''
voice_in = [
    "i32 pitch // semitones << 8 (MIDI note 60 = 60 << 8), the device's tune added",
    "i32 velocity // 0 .. 127 << 8",
    "u32 block // blocks since note-on, 0 on the note-on block",
    "float *out // render writes DK_BLOCK floats here",
    "u32 track // source track 0 .. 15, latched at note_on; machine contract 1.1",
    "float *out_r // machine contract 1.2: a stereo machine writes the right channel, DK_BLOCK floats, and returns DK_STEREO; a mono machine never touches it",
    "u32 gate // machine contract 1.6, read only by a machine that sets DK_MACHINE_GATE: 1 from the note-on until the note is released, then 0 (Digitakt II; Digitone II: always 1)",
]
desc = [
    "u32 magic // DK_MAGIC",
    "u32 contract // DK_MACHINE_V1 (low byte); a stereo machine (contract 1.2) or-s in DK_MACHINE_STEREO; a machine that reads `gate` (contract 1.6) or-s in DK_MACHINE_GATE",
    "u32 n_params // 0 .. DK_MAX_PARAMS, the manifest's `params` order",
    "u32 voices // 1 .. DK_MAX_VOICES the module supports",
    "u32 state_bytes // per voice, a multiple of 4; a voice's state is zeroed when its track first plays a note after the module loads (contract 1.6), then only state_clear_bytes at each note-on",
    "u32 state_clear_bytes // leading bytes zeroed at note-on, <= state_bytes",
    "u32 max_cycles_block // worst-case instructions of one render call",
    "u32 max_cycles_note_on // the same for the note-on block (note_on + render)",
    "u32 max_call_depth // nested CALLs the module uses",
    "u32 stack_bytes // data stack the module uses",
]
fns = [
    "i32 note_on(void *state, const dk_voice_in *in, const i32 *params) // At note-on, after `state_clear_bytes` are zeroed; no sound. params: DK_MAX_PARAMS words. Returns 0, or a negative number (a fault). Entered with I13 = return address (R4 state, R8 in, R12 params; result R0).",
    "i32 render(void *state, const dk_voice_in *in, const i32 *params) // Once per block while the voice runs, including the note-on block after note_on. Writes DK_BLOCK floats to in->out. params: DK_MAX_PARAMS words; DK_PARAM_LATCHED words retain the effective clamped note_on value, all other words are live. Returns dk_status.",
]

# The FX contract's numbers (sdk/include/dk/gen/fx.h is the generated C view; it includes the generated sdk/include/dk/gen/fx_consts.h).
# `patchkit gen` writes sdk/dsp/contract/dk_fx.inc and sdk/include/dk/gen/fx_consts.h from this table. Do not include it together with dk_machine.inc (DK_BLOCK and DK_LEVEL_BOUND_BITS are in both).
[fx]
consts = [
    { name = "DK_FX_V1", value = 1, doc = "Contract version." },
    { name = "DK_BLOCK", value = 32, doc = "Samples per channel and call, 48 kHz, both devices." },
    { name = "DK_FX_BLOCK", value = 64, doc = "Floats of a block, planar: 32 left, then 32 right." },                  # floats of the master block: 32 left, then 32 right
    { name = "DK_FX_MAX_PARAMS", value = 8, doc = "Hard cap on parameter words (the 7 knobs of a page are p0 to p6, v1 rows had 4; MIX is not one: the adapter owns it)." },
    { name = "DK_FX_MAX", value = 4, doc = "Effects in the chain (a device's `[limits] fx_slots` is at most this)." },                     # effects in the chain
    { name = "DK_FX_OK", value = 0, doc = "Returned by process: out written; a negative number is a fault: the block plays dry." },
    { name = "DK_LEVEL_BOUND_BITS", value = 1090519040, doc = "|sample| above DK_LEVEL_BOUND is a fault (+18 dB over full scale)." },  # 8.0f
    { name = "DK_FX_MAGIC", value = 1145783896, doc = "'DKFX', the first word of dk_fx_desc." },          # 'DKFX' = 0x444b4658
]
fx_in = ["in", "out", "block"]                             # struct dk_fx_in, DK_FX_IN_*
desc = [
    "magic", "contract", "n_params", "state_bytes", "max_cycles_block", "max_call_depth", "stack_bytes",
]                                                          # struct dk_fx_desc, DK_FX_DESC_*

# The typed C view of sdk/include/dk/gen/fx.h (as [machine.c]).
[fx.c]
intro = '''An effect processes the final stereo block of the device (the master, before the USB pack and the DAC converter).
   The numbers are in sdk/sdk.toml [fx], from which `patchkit gen` writes sdk/include/dk/gen/fx_consts.h (included here) and sdk/dsp/contract/dk_fx.inc for assembly.
   Do not include dk_fx.inc and dk_machine.inc in one assembly file (DK_BLOCK and DK_LEVEL_BOUND_BITS are in both).'''
desc_doc = '''One per module in read-only data, found by the module's registry row (patched in) or its DK_FX record (run-time, DSP section version 4
   of the .dkm). The row holds DK_FX_MAX_PARAMS parameter words, p0 to p7: word i of `params` is p_i, all 0 unless the row says otherwise (a run-time
   effect's record gives defaults). The adapter passes the words as they are; n_params says how many the effect reads. No function pointers.'''
rules = '''Entry point. SHARC+ assembly, v1: the adapter enters with `I13 = return address; JUMP (M13, I12)` and the module returns with
   `JUMP (M13, I13)`. Arguments R4 = state, R8 = in (dk_fx_in), R12 = params; result R0. Register rules as <dk/machine/machine.h>:
   may clobber R0-R15, I0-I5, M1-M4, B3; must keep I6-I15, M0, M5-M15, L0-L7, MODE1.'''
fx_in = [
    "const float *in // the block before this effect, DK_FX_BLOCK floats, read only",
    "float *out // process writes DK_FX_BLOCK floats here (adapter scratch)",
    "u32 block // blocks since the start of the DSP, wraps at 2^32",
]
desc = [
    "u32 magic // DK_FX_MAGIC",
    "u32 contract // DK_FX_V1",
    "u32 n_params // 0 .. DK_FX_MAX_PARAMS",
    "u32 state_bytes // one instance, a multiple of 4; zeroed when the effect switches on",
    "u32 max_cycles_block // worst-case instructions of one process call",
    "u32 max_call_depth // nested CALLs the module uses",
    "u32 stack_bytes // data stack the module uses",
]
fns = [
    "i32 process(void *state, const dk_fx_in *in, const i32 *params) // Block entry point. params: DK_FX_MAX_PARAMS words. Returns dk_fx_status; a negative number is a fault: the block plays dry. Entered as note_on of dk_machine.h.",
]

# Page constants. `patchkit gen` writes `consts` to the public sdk/include/dk/gen/page_consts.h: the knob glyphs, the display of an effect
# parameter and the routes of an effect, which builders pass to dk_param_glyph, dk_page_add_fx_param and dk_fx_routes. `knobs` is
# DK_PAGE_KNOBS, the encoders on a page: the array length of the register records (`patchkit::register::KNOBS`) and a runtime limit.
[page]
knobs = 8
consts = [
    { name = "DK_GLYPH_ENCODER", value = 0, doc = "Glyph (the dk_glyph values): a plain encoder knob, values 0 .. 127 (the default)." },
    { name = "DK_GLYPH_FADER", value = 1, doc = "Glyph: a fader, values 0 .. 127." },
    { name = "DK_GLYPH_PAN", value = 2, doc = "Glyph: a pan knob, values 0 .. 127 (centre 64, shows L/R)." },
    { name = "DK_GLYPH_ONOFF", value = 3, doc = "Glyph: an on/off switch, values 0 .. 1." },
    { name = "DK_GLYPH_TUNE", value = 4, doc = "Glyph: a tune knob, values 4 .. 124 (centre 64, one unit = one semitone)." },
    { name = "DK_GLYPH_PLAY", value = 5, doc = "Glyph: a play-mode knob, values 0 .. 3 (REV, REV.L, FWD.L, FWD on the Digitakt II; the Digitone II shows 0 .. 3)." },
    { name = "DK_PERCENT", value = 1, doc = "A knob shown as 0 .. 127 (the default)." },
    { name = "DK_BIPOLAR", value = 2, doc = "A knob shown as -64 .. +63." },
    { name = "DK_ROUTE_MASTER", value = 1, doc = "The effect runs on the master block." },
    { name = "DK_ROUTE_SEND", value = 2, doc = "The effect runs on a send bus (one amount per track)." },
]

# The names a module may import. The service imports (`service`, `since` and `context` set) are the SDK of the entry point `dk_module` (docs/plans/sdk.md
# section 5.1). The runtime's table (modules/core/runtime/src/rs/src/lib.rs `IMPORTS`) holds the imports without `requires`, in this order; those with `requires`
# are symbols of another module that the runtime links by name (`optional` in its module.toml). `kind` `helper`: a compiler helper that gcc calls by itself, or a
# call whose prototype is in another header (<dk/platform/ui.h>), so none in <dk/gen/imports.h>. `requires`: the module whose absence makes the address 0 (the
# import is then not found). `absent`: with `requires`, the runtime hands out a stub instead of 0 and the module loads: the stub returns this value ("0", "-1"),
# the status DK_E_MISSING ("missing") or nothing ("void"), and the signature must agree.
[[import]]
name = "memcpy"
sig = "u8 *(u8 *d, const u8 *s, u32 n)"
doc = "The runtime's memcpy."
kind = "helper"

[[import]]
name = "memset"
sig = "u8 *(u8 *d, i32 c, u32 n)"
doc = "The runtime's memset."
kind = "helper"

[[import]]
name = "memcmp"
sig = "i32 (const u8 *a, const u8 *b, u32 n)"
doc = "The runtime's memcmp."
kind = "helper"

[[import]]
name = "__muldi3"
doc = "The runtime's 64-bit multiply."
kind = "helper"

[[import]]
name = "__udivdi3"
doc = "The runtime's unsigned 64-bit divide."
kind = "helper"

[[import]]
name = "__umoddi3"
doc = "The runtime's unsigned 64-bit remainder."
kind = "helper"

[[import]]
name = "dk_ui_menu_new"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "dk_ui_menu *(dk_ui *ui, const void *desc)"
doc = "Make a menu from a `dk_ui_menu_desc` (declared in <dk/platform/ui.h>, which also has the typed prototype); NULL when out of memory. Menus are never freed."
kind = "helper"
requires = "core/ui"
absent = "0"

[[import]]
name = "dk_ui_confirm"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_ui *ui, const char *title, const char *text, ui_confirm_fn done, void *arg)"
doc = "A YES/NO dialog: `done(arg, yes)` runs after it closed. 0 when shown, a negative code when not (another dialog is open, out of memory)."
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_choice"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_ui *ui, const char *title, const void *items, i32 n, ui_choice_fn done, void *arg)"
doc = "A choice of `n` items (`items` is a `const char *const *`, declared in <dk/platform/ui.h>, which also has the typed prototype): `done(arg, index)` runs after the dialog closed; NO closes it without calling `done`. 0 when shown, a negative code when not."
kind = "helper"
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_toast"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_ui *ui, const char *text)"
doc = "A short message on the main screen that goes away by itself. 0 when shown, a negative code when not."
requires = "core/ui"
absent = "-1"

[[import]]
name = "dk_ui_tick"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_ui *ui, ui_tick_fn fn, void *arg, u32 period_ms)"
doc = "Call `fn(arg)` about every `period_ms` in the UI task (period 0 removes the timer of the pair `fn`, `arg`). 0 when set or removed, a negative code when it cannot be (table full). Rules in <dk/platform/ui.h>."
requires = "core/ui"
absent = "-1"

# ---- The service imports (docs/plans/sdk.md section 5.1) -----------------------------------------------------------------
# `service`: runtime, samples, machines, fx, ui, input, usb_bulk, dsp_link, sdhc_large. `since`: the runtime version that added the import ("0.7.0"); `patchkit pack` writes the newest `since` among the imports
# a module links as the runtime version it needs. `context`: where the call may run. `init`: only inside the
# module's `init`. `ui`: the UI task, which includes init, fini, tick, menu and the callbacks that run there. `io-step`: only inside an I/O step.
# `any`: any task, never an interrupt. `isr`: also from an interrupt handler. A handle type (`dk_module_ctx`, `dk_settings`, ...) is opaque: the runtime or
# the provider module gives it out in `init`. The prototypes of the imports that have `service` and no `kind` are written into
# sdk/include/dk/gen/imports.h. An import with `requires` binds to a stub when its provider is not in the image: `absent = "missing"` makes
# the stub return DK_E_MISSING.

[[import]]
name = "dk_alloc"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void *(u32 size)"
doc = "A 16-byte aligned block from the module arena (zero is not guaranteed); null when it is full."

[[import]]
name = "dk_free"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (void *p)"
doc = "Give back a block of dk_alloc."

[[import]]
name = "dk_log"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (u32 level, const char *msg, u32 value)"
doc = "Append `msg` (NUL-terminated, 24 bytes kept) and `value` to the runtime's log ring at `level` (0 error, 1 warn, 2 info, 3 debug, 4 trace; above 4 is 4). See <dk/core/log.h>."

[[import]]
name = "dk_log_event"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (u32 kind, u32 flags, const u32 *a)"
doc = "Log one event as the runtime's own call does (the sink and the small ring see it): `kind` and `flags` as in `dk_log_ev`, `a` five words. The source is the module that is running unless `flags` names another."

[[import]]
name = "dk_sink_set"
service = "runtime"
since = "0.7.1"
context = "any"
sig = "i32 (u32 channel, u8 *sink)"
doc = "Set (or, with 0, clear) the sink of a runtime channel for the calling module: DK_SINK_LOG (0) gets `void sink(const dk_log_ev *e)` for every event the runtime logs, DK_SINK_SPAN (1) gets `void sink(const dk_span *s)`, an (owner, cycles) record. A sink runs in the producer's task with interrupts masked: short, no waiting, no logging. A channel has one owner; the runtime clears it after the owner's fini. Returns 0, DK_E_RANGE (no such channel), DK_E_CONTEXT (no module code is running) or DK_E_BUSY (another module owns the channel). See <dk/core/sink.h>."

[[import]]
name = "dk_time_blocks"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "u32 ()"
doc = "The 1500 Hz block clock (wraps), for a module that wants to measure time; 0 when the image has no counter. See <dk/core/time.h>."

[[import]]
name = "dk_fw_alloc"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void *(u32 size)"
doc = "The firmware's operator new (the 32 MiB buddy allocator): a block of `size` bytes, or NULL. Give it back with dk_fw_free; the module arena (dk_alloc) is small."

[[import]]
name = "dk_fw_free"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (void *p)"
doc = "The firmware's free, paired with dk_fw_alloc."

[[import]]
name = "dk_fw_block_read"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "i32 (u32 sector, u32 bytes, void *buf)"
doc = "The firmware's eMMC block read: `bytes` (a multiple of 512) from `sector` into `buf`; 0 = ok. Reads the whole card, not only the store."

[[import]]
name = "dk_files_read"
service = "runtime"
since = "0.7.0"
context = "init"
sig = "i32 (dk_files *files, const char *path, void *buf, u32 cap)"
doc = "Read a store file into `buf` (at most `cap` bytes); returns the file size, or a negative code. It uses the runtime's staging buffer. `files` is the handle of `dk_files_open`."

[[import]]
name = "dk_host_register"
service = "runtime"
since = "0.7.0"
context = "init"
sig = "i32 (u32 first, u32 count, host_cmd_fn fn)"
doc = "Register the SysEx commands `first .. first + count` with `fn`. The range must lie inside one of the ranges sdk/sdk.toml [protocol.ranges] reserves and overlap no registered one; else it returns DK_E_CMD_RANGE. The range is released with the module. Returns 0. See <dk/platform/host.h>."

[[import]]
name = "dk_module_ctx_device"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "u32 (dk_module_ctx *ctx)"
doc = "The device's `[digikit] id` (DT2 or DN2); 0 for a pointer that is not a context."

[[import]]
name = "dk_module_ctx_runtime_version"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "u32 (dk_module_ctx *ctx)"
doc = "The runtime version, packed major << 16 | minor << 8 | patch; 0 for a pointer that is not a context."

[[import]]
name = "dk_settings_open"
service = "runtime"
since = "0.7.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, dk_settings **out)"
doc = "Open this module's settings: `*out` is the handle (the same one every time), the result 0. A negative result outside init (DK_E_NOT_FOUND) or for a bad context (DK_E_CONTRACT); `*out` is untouched then."

[[import]]
name = "dk_settings_get"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_settings *s, const char *key, void *out, u32 cap)"
doc = "Read the value of `key` (NUL-terminated, own key space) into `out` (`cap` bytes): returns its length (0 is valid), DK_E_SET_NOKEY when there is none, DK_E_SET_VALUE when `cap` is too small (nothing is written), DK_E_SET_KEY for a bad handle or key, DK_E_SET_OFF when the settings store is off."

[[import]]
name = "dk_settings_put"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_settings *s, const char *key, const void *value, u32 len)"
doc = "Set `key` to the `len` bytes (0 to 1024) at `value`; the card is written 2 s after the last change. Returns 0, DK_E_SET_KEY, DK_E_SET_VALUE, DK_E_SET_FULL or DK_E_SET_OFF. Not from a host command handler."

[[import]]
name = "dk_settings_remove"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_settings *s, const char *key)"
doc = "Remove `key`: returns 0 (also when it was not there), DK_E_SET_KEY or DK_E_SET_OFF. Not from a host command handler."

[[import]]
name = "dk_files_open"
service = "runtime"
since = "0.7.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, dk_files **out)"
doc = "Open this module's listing client: `*out` is the handle, the result 0. A negative result outside init or when the client table is full; `*out` is untouched then."

[[import]]
name = "dk_files_list"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_files *f, u32 root, const char *path, files_event_fn notify, void *arg)"
doc = "Copy a canonical root-relative directory request; positive ticket or negative error. Supersedes prior results. The optional deferred UI-task notify and its context stay module-owned. No I/O here."

[[import]]
name = "dk_files_poll"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_files *f, u32 ticket, void *out, u32 capacity)"
doc = "No I/O: 0 pending, 1 copied 304-byte dk_file_entry, 2 end, negative error. The output is unchanged unless 1."

[[import]]
name = "dk_files_cancel"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_files *f, u32 ticket)"
doc = "Invalidate the matching request, its results and its queued notification without waiting for active work or a callback."

[[import]]
name = "dk_files_create"
service = "runtime"
since = "0.7.0"
context = "io-step"
sig = "i32 (dk_files *f, u32 root, const char *path, u32 size, const void *hash4, u32 flags)"
doc = "Open the one write session for the file `path` of `size` bytes under `root` (DK_FILES_STORE or DK_FILES_SAMPLES). `hash4`: NULL, or the expected file hash; dk_files_close then checks it. `flags`: 0 or DK_FILE_REPLACE (1). Returns a handle > 0 owned by this module, or a negative status (DK_E_BUSY: try again; DK_E_EXISTS, DK_E_FILE_IN_USE, DK_E_PATH, DK_E_FULL, DK_E_NOSTORE, DK_E_INUSE, DK_E_WRITE; DK_E_CONTEXT outside an I/O step). See <dk/platform/files.h>."

[[import]]
name = "dk_files_write"
service = "runtime"
since = "0.7.0"
context = "io-step"
sig = "i32 (dk_files *f, i32 h, u32 offset, const void *buf, u32 len)"
doc = "Write `len` bytes at `offset`, the next byte of the file. `buf` is 16-byte aligned; `len` a multiple of 512 except for the last piece (the tail sector is padded with zeros). Returns 0 or DK_E_STATE, DK_E_OFFSET, DK_E_LENGTH, DK_E_WRITE, DK_E_CONTRACT (unaligned buf), DK_E_BUSY (nothing was written: call again)."

[[import]]
name = "dk_files_close"
service = "runtime"
since = "0.7.0"
context = "io-step"
sig = "i32 (dk_files *f, i32 h, void *hash_out)"
doc = "End the file. All `size` bytes must have been written (DK_E_LENGTH) and match `hash4` when it was given (DK_E_HASH); the table is committed (power-cut safe). `hash_out` (4 bytes, may be NULL) gets the file hash of the bytes written. The session is closed whatever the result, except for DK_E_BUSY (try again)."

[[import]]
name = "dk_files_abort"
service = "runtime"
since = "0.7.0"
context = "io-step"
sig = "i32 (dk_files *f, i32 h)"
doc = "Drop the session and the partial file. Returns 0 or DK_E_STATE."

[[import]]
name = "dk_files_delete"
service = "runtime"
since = "0.7.0"
context = "io-step"
sig = "i32 (dk_files *f, u32 root, const char *path)"
doc = "Remove a file or folder entry. Returns 0, DK_E_NOFILE, DK_E_FILE_IN_USE (a reader still reads it: try again later), DK_E_BUSY or a path or store status."

[[import]]
name = "dk_io_post"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "i32 (io_step_fn step, io_done_fn done, void *arg)"
doc = "Run `step(arg)` on the runtime's I/O task (<dk/platform/io.h>). The step may block and call dk_files_create, dk_files_write, dk_files_close, dk_files_abort and dk_files_delete. It returns DK_IO_MORE (run again), DK_IO_WAIT (sleep until dk_io_wake), 0 (done) or a negative error. `done(arg, status)` runs once in the UI task. Returns a job id > 0, DK_E_CONTRACT (no step) or DK_E_BUSY (8 jobs)."

[[import]]
name = "dk_io_cancel"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "i32 (i32 id)"
doc = "Cancel a job of this module: a queued job never runs, a running one stops after its step returns; `done` gets DK_IO_E_CANCELLED. Returns 0 or DK_E_NOT_FOUND."

[[import]]
name = "dk_io_wake"
service = "runtime"
since = "0.7.0"
context = "isr"
sig = "void (i32 id)"
doc = "Wake a job whose step returned DK_IO_WAIT. Callable from an interrupt handler, an adapter or any task. Unknown ids are ignored."

[[import]]
name = "dk_job_post"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (job_step_fn step, job_done_fn done, void *arg)"
doc = "Run `step(arg)` on the background worker until it returns 0 or a negative error (DK_JOB_MORE: call again; <dk/platform/job.h>). `done(arg, status)` is called once in the UI task. Returns a job id > 0, DK_E_BUSY (8 jobs are queued) or DK_E_CONTRACT (no step)."

[[import]]
name = "dk_job_cancel"
service = "runtime"
since = "0.7.0"
context = "ui"
sig = "i32 (u32 id)"
doc = "Cancel a job of this module: a queued job never runs and a running one stops after its current step; `done` gets DK_JOB_E_CANCELLED. Returns 0, or DK_E_NOT_FOUND for an unknown id."

[[import]]
name = "dk_hash32_init"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (void *state)"
doc = "Start the file hash (the Elektron +Drive content hash, <dk/platform/hash32.h>) in the caller's 28-byte `dk_hash32`."

[[import]]
name = "dk_hash32_update"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "void (void *state, const void *p, u32 n)"
doc = "Feed `n` bytes."

[[import]]
name = "dk_hash32_finish"
service = "runtime"
since = "0.7.0"
context = "any"
sig = "u32 (void *state)"
doc = "The file hash `hash|1`: the value the store keeps (4 bytes big-endian in a table slot). The state is spent."

[[import]]
name = "dk_intro_take"
service = "runtime"
since = "0.7.0"
context = "init"
sig = "i32 (intro_frame_fn frame, intro_done_fn done, void *arg, u32 ticks)"
doc = "Replace the stock boot animation. `frame(tick, arg)` returns the 1024-byte native bitmap of tick 0 .. ticks-1 (30 ticks a second), or NULL to end the animation; it runs on the intro task, must not block and must not call any import. `done(arg)` (may be NULL) runs once in the UI task at the first UI pass. `ticks` is 1 to 300. Returns 0, DK_E_NOT_FOUND outside init, DK_E_CONTRACT, DK_E_BUSY (taken already) or DK_E_BOOT_ONLY. See <dk/platform/intro.h>."

[[import]]
name = "dk_param_get"
service = "machines"
since = "0.7.0"
context = "ui"
sig = "i32 (u32 track, u32 word)"
doc = "Raw value (unit * 256) of parameter word `word` of the calling module on `track` (0 to 15). Only in the flow of a click (from a DK_PARAM_ACTION callback until the page gets its next key or turn), else DK_PARAM_E_STATE. See <dk/platform/param.h>."

[[import]]
name = "dk_param_set"
service = "machines"
since = "0.7.0"
context = "ui"
sig = "i32 (u32 track, u32 word, i32 raw)"
doc = "Set parameter word `word` of the calling module on `track` to `raw` (unit * 256) with the stock setter of a knob turn. Same click flow as dk_param_get. Returns 0, DK_PARAM_E_STATE, DK_PARAM_E_ARG or DK_PARAM_E_HELD."

[[import]]
name = "dk_module_ctx_add_machine"
service = "machines"
since = "0.7.0"
context = "init"
sig = "dk_machine *(dk_module_ctx *ctx, u32 index, const char *name, const char *short_name)"
doc = "Declare a machine of this module: `index` is its DK_MACHINE_ID_<ID> (build/gen/module_ids.h): the position of the id in the `[[machine]]` list of module.toml, which is the row of its key in the keys table. `name` the long name, `short_name` the short one. The DSP entry points are found by the names `_<id>_render` and `_<id>_note_on`. Returns the builder handle; on an error (full, bad index) a placeholder, and the error is reported when `init` returns."

[[import]]
name = "dk_module_ctx_add_fx"
service = "fx"
since = "0.7.0"
context = "init"
sig = "dk_fx *(dk_module_ctx *ctx, u32 index, const char *name, const char *short_name)"
doc = "Declare an effect of this module: `index` is its DK_FX_ID_<ID>: the position of the id in the `[[fx]]` list of module.toml, which is the row of its id in the keys table. `name` the long name, `short_name` the short one. The DSP entry is `_<id>_process`. Returns the builder handle (a placeholder on an error, reported at commit)."

[[import]]
name = "dk_record_add"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 kind, const void *bytes, u32 len)"
doc = "Declare one record of a generic kind (`[records.kinds]` `generic = true`; a service of the runtime owns the kind). `len` is the record's length less its 8-byte header; the bytes are copied. A kind that is unknown or not generic, or a wrong length, returns DK_E_FORMAT, a full collection DK_E_DECL_FULL; the owning service checks the record at the commit."

[[import]]
name = "dk_service_declare_kind"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 kind, u32 len, const void *handler)"
doc = "A service module declares a record kind it owns: `len` is the whole record with its 8-byte header, `handler` the function that handles the records. The runtime compares every dk_service_declare_* call of `init` with the header table (KINDS, SLOTS, HOOKS, EXPORTS, RESOURCES entries) at the commit: a difference refuses the module with DK_E_DECL_KIND. Returns 0, or DK_E_DECL_FULL."

[[import]]
name = "dk_service_declare_slot"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 slot, u32 flags)"
doc = "A service module declares a plug-in point (slot) it takes. See dk_service_declare_kind. Returns 0, or DK_E_DECL_FULL."

[[import]]
name = "dk_service_declare_hook"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 site, const void *entry)"
doc = "A service module declares a hook site it takes, with the function that runs there. See dk_service_declare_kind. Returns 0, or DK_E_DECL_FULL."

[[import]]
name = "dk_service_declare_export"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 name_hash, const void *entry)"
doc = "A service module declares a function it offers to other modules: `name_hash` is the FNV-1a 32 hash of its name. See dk_service_declare_kind. Returns 0, or DK_E_DECL_FULL."

[[import]]
name = "dk_service_declare_resource"
service = "runtime"
since = "0.8.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, u32 resource, u32 limit)"
doc = "A service module declares a resource it adds, with its limit. See dk_service_declare_kind. Returns 0, or DK_E_DECL_FULL."

[[import]]
name = "dk_machine_add_page"
service = "machines"
since = "0.7.0"
context = "init"
sig = "dk_page *(dk_machine *m, const char *name, const char *short_name)"
doc = "Add a page to the machine, after the pages already added: `name` is its title, `short_name` its tab label on a device that keeps knobs in page rows. Returns the page handle (a placeholder on an error)."

[[import]]
name = "dk_fx_add_page"
service = "fx"
since = "0.7.0"
context = "init"
sig = "dk_page *(dk_fx *fx, const char *name, const char *short_name)"
doc = "Add the effect's page: `name` is its title, `short_name` its tab label (3 characters at most). Returns the page handle (a placeholder on an error)."

[[import]]
name = "dk_page_add_param"
service = "machines"
since = "0.7.0"
context = "init"
sig = "dk_param *(dk_page *p, const char *name, const char *short_name, u32 def)"
doc = "Add a machine parameter on the next knob of the page (word = order of declaration, range 0 to 127 until `dk_param_range`), default value `def`. Returns the parameter handle (a placeholder on an error)."

[[import]]
name = "dk_page_add_fx_param"
service = "fx"
since = "0.7.0"
context = "init"
sig = "dk_param *(dk_page *p, const char *name, const char *short_name, u32 kind, float min, float max, float def)"
doc = "Add an effect parameter on the next knob of the page. `kind` is DK_PERCENT or DK_BIPOLAR (the display); `min`, `max` and `def` are in the parameter's unit. Returns the parameter handle (a placeholder on an error)."

[[import]]
name = "dk_param_range"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_param *prm, u32 min, u32 max)"
doc = "Set the range of a machine parameter (default 0 to 127)."

[[import]]
name = "dk_param_glyph"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_param *prm, u32 glyph)"
doc = "Set the glyph of a machine parameter (DK_GLYPH_*); its range must fit the glyph, or the commit refuses the module."

[[import]]
name = "dk_param_latched"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_param *prm)"
doc = "Latch the parameter at note_on (machine contract 1.3)."

[[import]]
name = "dk_param_on_click"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_param *prm, param_click_fn fn, void *arg)"
doc = "Run `fn(arg, track)` when the parameter's knob is clicked on the machine's page."

[[import]]
name = "dk_page_canvas"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_page *p, u32 flags, page_draw_fn draw, page_event_fn event, void *arg)"
doc = "Make the page a native canvas page: `flags` are DK_PAGE_STOCK_OVERLAY or DK_PAGE_WIDE_CANVAS (or 0), `draw` and `event` run in the UI task with `arg`."

[[import]]
name = "dk_page_bind"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_page *p, dk_param *prm, u32 slot)"
doc = "On a canvas page, bind a shared parameter of the machine to the encoder `slot` (0 to 7)."

[[import]]
name = "dk_page_bind_local"
service = "machines"
since = "0.7.0"
context = "init"
sig = "void (dk_page *p, u32 local, u32 slot)"
doc = "On a canvas page, bind the page's local control number `local` to the encoder `slot` (0 to 7); its turns arrive in the event callback."

[[import]]
name = "dk_fx_routes"
service = "fx"
since = "0.7.0"
context = "init"
sig = "void (dk_fx *fx, u32 allowed, u32 def)"
doc = "Set the routes the effect may run on (DK_ROUTE_MASTER, DK_ROUTE_SEND, or both) and the default one."

[[import]]
name = "dk_fx_mix"
service = "fx"
since = "0.7.0"
context = "init"
sig = "void (dk_fx *fx, u32 def)"
doc = "Set the default of the effect's MIX knob, 0 to 127 (127 when this is not called)."

[[import]]
name = "dk_sample_pool_open"
service = "samples"
since = "0.7.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, dk_sample_pool **out)"
doc = "Open the module's 16-entry sample pool table (its lowest DK_SAMPLE_TRACKS id): `*out` is the handle, the result 0. A negative DK_E_* result when the module has none or this is not init; `*out` is untouched then."

[[import]]
name = "dk_sample_pool_add"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, const char *path)"
doc = "Add a stereo-capable sample file to the pool (copies the path, no file IO here). Returns the pool index 0..15: the first free entry, or the entry that already holds this path. DK_E_POOL when all 16 are in use; DK_E_SEL_PATH for an empty or too long path. See <dk/sample/pool.h>."

[[import]]
name = "dk_sample_pool_clear"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index)"
doc = "Close the entry's generation, drop its reference and set it UNUSED, a hole in the pool. Returns 0 or a negative error."

[[import]]
name = "dk_sample_pool_status"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index)"
doc = "DK_SAMPLE_UNUSED, QUEUED, LOADING, READY, or a negative error; an error is sticky until the entry is added again or cleared."

[[import]]
name = "dk_sample_pool_info"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index, void *out)"
doc = "Copy a 16-byte dk_sample_info (frames, rate, channels, token) of a READY entry; otherwise a negative error and `out` is untouched."

[[import]]
name = "dk_sample_pool_path"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index, char *buf, u32 cap)"
doc = "Copy the root-relative path of the entry into `buf` and return its length without the NUL. `cap` too small: DK_E_SEL_PATH and `buf` is untouched."

[[import]]
name = "dk_sample_pool_set"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index, const char *path)"
doc = "Load a sample file into pool entry `index` (0..15), replacing what was there. Other indexes never move. Returns 0 or a negative error."

[[import]]
name = "dk_sample_pool_peaks"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index, u32 token, void *out, u32 capacity)"
doc = "Copy bounded PCM16 min/max overview pairs of a READY pool entry matching token. Returns the bin count (1..512), or a negative error; capacity is bytes, the output is unchanged on refusal."

[[import]]
name = "dk_sample_pool_peaks_window"
service = "samples"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_sample_pool *p, u32 index, u32 token, u32 first, u32 frames, u32 columns, void *out, u32 capacity)"
doc = "Min/max of `columns` equal parts of the frames [first, first + frames) of a READY pool entry matching token, computed in the background. Returns `columns` when ready, 0 while it is computed, or a negative error. Poll from the draw callback."

[[import]]
name = "dk_ui_open"
service = "ui"
since = "0.7.0"
context = "init"
sig = "i32 (dk_module_ctx *ctx, dk_ui **out)"
doc = "Open the UI service: `*out` is the handle, the result 0. Without core/ui the result is DK_E_MISSING and `*out` is untouched."
requires = "core/ui"
absent = "missing"

[[import]]
name = "dk_ui_menu_open"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "i32 (dk_ui_menu *m)"
doc = "Fill and show a menu on top of the current view; negative when it cannot be."
requires = "core/ui"
absent = "missing"

[[import]]
name = "dk_ui_menu_close"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "void (dk_ui_menu *m)"
doc = "Close a menu."
requires = "core/ui"
absent = "void"

[[import]]
name = "dk_ui_menu_select"
service = "ui"
since = "0.7.0"
context = "ui"
sig = "void (dk_ui_menu *m, i32 row)"
doc = "Put the cursor of a menu or list on a row (clamped); call before dk_ui_menu_open to start on the current choice."
requires = "core/ui"
