sig = "u32 (u32 clear, u32 set)"
doc = "The run-time switches of the speed levers: one RAM word, both bits set at boot, never saved. Clears the bits of `clear`, then sets the bits of `set` (other bits are ignored; both 0 only reads) and returns the new word. Bit 0: hash once (the store's received bytes are not hashed, the card read-back is the only hash); bit 2: the read-back hash overlaps the next card read. The other two switches of the usb-fast STATUS 'S' mask live in their adapters (bit 1 `dk_usb_bulk_ring`, bit 3 `dk_sdhc_large_ctl`), not in this word. See <dk/platform/debug.h>."

[log]
