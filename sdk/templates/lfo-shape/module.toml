[module]
id = "__ID__"
version = "0.1.0"
name = "__TITLE__"
category = "lfo"
type = "service"
author = "__AUTHOR__"
status = "experimental"
summary = "One short sentence for players, 120 characters at most, ending with a full stop."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# One record per shape (src/module.c, `KEYS`): its key derives from the module id and this id (`DK_KEY___UPPER__` in build/gen/module_ids.h). The packer writes the key into the
# header table, where the boot planner checks that the kind has an owner and that no other module has the key. The kind is an LFO shape: a value of the LFO WAVE parameter. A module has 1 to 8 shapes.
[[record]]
kind = "lfo_shape"
id = "__NAME__"

# The record block `init` commits: the register section header (16 bytes) and one record (80 bytes) per shape; `module:check` writes the measured size.
[uses.dt2]
record_bytes = 96

[uses.dn2]
record_bytes = 96

# C, built by `patchkit build`; the runtime loads it from the card store.
[[object]]
path = "build/__NAME__.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"
