[package]
name = "digiemu-desktop"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Run-time switchable ColdFire profile (`cf.profile {enable}`); off until asked, so every workbench build has it.
cf-profile = ["digi-control/cf-profile"]
# Local-only SHARC+ coupling: generated DSP code must never be distributed.
sharc = ["digi-coupled/sharc", "digi-control/sharc"]
# Playback through the default output device.
play = ["digi-coupled/play", "digi-control/play"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
midir = "0.11"
elektron-native-boot = { path = "../../../packages/emulator/boot" }
emmc-card = { path = "../../../packages/emulator/card" }
digi-coupled = { path = "../../../packages/emulator/coupled" }
digi-control = { path = "../../../packages/emulator/control" }
device-profile = { path = "../../../packages/emulator/device-profile" }
patchkit = { path = "../../../packages/patchkit" }
dkmidi = { path = "../../../packages/dkmidi" }
dkbulk = { path = "../../../packages/dkbulk" }

[dev-dependencies]
sha2 = "0.10"
