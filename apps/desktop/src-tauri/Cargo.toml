[package]
name = "digiemu-desktop"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Run-time switchable ColdFire profile (`cf.profile {enable}`); off until asked, so every workbench build has it.
cf-profile = ["digi-control/cf-profile"]
# Local-only SHARC+ coupling: generated DSP code must never be distributed.
sharc = ["digi-coupled/sharc", "digi-control/sharc"]
# Playback through the default output device.
play = ["digi-coupled/play", "digi-control/play"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }
toml = "0.9"

[dependencies]
tauri = { version = "2.9.1", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
midir = "0.11"
cpal = "0.18"
fixed-resample = { version = "0.13", default-features = false, features = ["channel", "resampler"] }
elektron-native-boot = { path = "../../../packages/emulator/boot" }
emmc-card = { path = "../../../packages/emulator/card" }
digi-coupled = { path = "../../../packages/emulator/coupled" }
digi-control = { path = "../../../packages/emulator/control" }
device-profile = { path = "../../../packages/emulator/device-profile" }
patchkit = { path = "../../../packages/patchkit" }
dkmidi = { path = "../../../packages/dkmidi" }
dkbulk = { path = "../../../packages/dkbulk" }
dkaddrmap = { path = "../../../packages/dkaddrmap" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
