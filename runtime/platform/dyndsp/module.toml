[module]
id = "core/dyndsp"
version = "0.1.0"
name = "Run-time DSP machines"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Reserves the DSP side of run-time machines: free voice rows and the table of DSP addresses the digikit runtime uses"
requires = ["core/runtime", "core/rows", "core/dsp-link", "core/dsp-voice", "core/fx"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Patch-time half of the DSP side of run-time machines (docs/design/digikit-dkm.md "DSP section", docs/findings/32-runtime-dsp-machines.md).
# It adds no behaviour by itself:
#
# - 8 free rows in the voices registry of core/dsp-voice. A free row holds type 0xffffffff, which no machine type equals, and pc 0:
#   the render scan skips it. The runtime claims one for a module's voice: it writes the pc, then the type (one word per transfer
#   through window 1 of core/dsp-link, so the scan never sees a half-written row), and frees it the other way round.
# - `dyndsp_info` is the table of DSP addresses the runtime reads (core/runtime, optional link): the area, the free voice rows, and
#   the exported DSP symbols a run-time DSP object may import (the helpers of core/dsp-voice).

# Device id, area size and the number of reserved types from the device files and core/rows types.toml, written by
# `patchkit gen` (docs/design/device-data.md). This module reserves DYN_TYPES rows: keep the `[[entry]]` rows below at that number
# (packages/patchkit/tests/devdata.rs checks it).
[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"
uses = ["DEVICE_ID", "DYN_TYPES", "DL_AREA_BYTES", "DL_SLOT_BYTES"]

[[object]]
path = "build/dyndsp-dt2.dko.json"
sources = ["src/cf/dyndsp-dt2.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_dd_area = "_dl_area"
_dd_vrows = "voices.rows"
_dd_vfirst = "voices.dv0.index"
_dd_vcount = "voices.count"
_dd_exp2 = "_dv_exp2"
_dd_frame_hw = "_dv_frame_hw"
_dd_frame_sw = "_dv_frame_sw"
# the table of a run-time DSP object's imports also holds the firmware addresses that core/dsp-voice's dispatch code uses (the anchors of its own object)
_dv_table = "voices.rows"
_fw_type_cache = "dsp.voice.value.type_cache"
_fw_render_next = "dsp.voice.site.render_entry.next"
_fw_frame = "dsp.voice.value.frame_base"
_fw_param_rec = "dsp.voice.value.param_record_base"
_fw_release_latch = "dsp.voice.value.release_latch"
_fw_unpack = "dsp.voice.fn.track_unpack"
# and those of the dispatch code of the fx service
_fx_table = "fx.rows"
_fx_master = "dsp.master.value.q31_converter.float_buf"
_fxs_trackbus = "dsp.fx.value.send.track_bus"
_fxs_return = "dsp.fx.value.send.return_bus"

[[object]]
path = "build/dyndsp-dn2.dko.json"
sources = ["src/cf/dyndsp-dn2.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_dd_area = "_dl_area"
_dd_vrows = "voices.rows"
_dd_vfirst = "voices.dv0.index"
_dd_vcount = "voices.count"
_dd_exp2 = "_dv_exp2"
_dd_frame_hw = "_dv_frame_hw"
_dd_frame_sw = "_dv_frame_sw"
# the table of a run-time DSP object's imports also holds the firmware addresses that the dispatch code of core/dsp-voice uses
_dv_table = "voices.rows"
_fw_frame = "dsp.voice.value.frame_base"
# and those of the dispatch code of the fx service
_fx_table = "fx.rows"
_fx_master = "dsp.master.value.q31_converter.float_buf"
_fxs_slotbus = "dsp.fx.value.send.slot_bus"
_fxs_slotmap = "dsp.fx.value.send.slot_map"
_fxs_fadetab = "dsp.fx.value.send.slot_fade_flags"
_fxs_return = "dsp.fx.value.send.return_bus"

# The DSP's machine selector (Digitakt II): the table that maps a machine type to the word that picks the sample renderer is in the DSP's memory, and no load-time path writes there, so it stays
# in the image. The copy has one word per type, the rows of core/rows appended with their clone's word; the literal that loads the table's address follows. (The Digitone II has no such table.)
[[section]]
name = "mf_selector"
region = "dsp.l2"
devices = ["dt2"]
from = { anchor = "dsp.machine.data.selector.table", len = "(image.u8(cf.machine.fn.dispatch + 1) + 1) * 4" }
append = { registry = "machines", row = ["image.u32(dsp.machine.data.selector.table + 4 * $clone_of)"] }

[[op]]
op = "write"
anchor = "dsp.machine.value.selector.table_ref"
offset = 2
value = "(mf_selector >> 16) & 0xffff"
width = 2
devices = ["dt2"]

[[op]]
op = "write"
anchor = "dsp.machine.value.selector.table_ref"
offset = 4
value = "mf_selector & 0xffff"
width = 2
devices = ["dt2"]

[[entry]]
registry = "voices"
id = "dv0"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv1"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv2"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv3"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv4"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv5"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv6"
type = 0xffffffff
pc = 0

[[entry]]
registry = "voices"
id = "dv7"
type = 0xffffffff
pc = 0

# The table of this adapter, exported to the image's info table (`dkrt_info_table`): the services find it by the hash of its name (`CoreApi::info`), the machines service for
# its voice rows and the fx service for the bounds of an effect's state. The runtime also links it directly (it owns the area).
[[info]]
name = "dyndsp_info"
devices = ["dt2", "dn2"]

# The capacity limits this adapter reserves, as `cap_<kind>` entries of the image's info table (docs/PATCHING.md): each points at the u32 word of the table that holds the limit, so the planner knows the limit before any service file is loaded.
[[info]]
name = "cap_voice_rows"
symbol = "dyndsp_info + 28"
devices = ["dt2", "dn2"]

