[module]
id = "core/usb-bulk-audio"
version = "0.1.0"
name = "USB bulk in USB AUDIO/MIDI"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "A vendor bulk OUT interface (interface 5, EP2 OUT) in the USB AUDIO/MIDI configuration, with no mode switch: host data reaches core/usb-bulk's receive ring while audio and MIDI keep working"
requires = ["core/usb-bulk"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The entry of the firmware's USB init jumps to ua_init_hook, which runs ua_prepare (it extends entry 5 of the RAM port table: a copy of the 0x148-byte configuration with
# interface 5 appended, and our connect and disconnect callbacks) and then the displaced prologue. The init runs at boot and again from the firmware tick after a controller
# reset. ua_prepare refuses and leaves USB stock if entry 5 is not the stock layout. The wrappers run the stock callbacks and call core/usb-bulk's usb_bulk_port5_connect and
# usb_bulk_port5_disconnect; usb_bulk_port5_attach marks the port bulk-capable there. Those three are symbols of core/usb-bulk, which patchkit links across the two objects; the board's DDR facts are read from
# the runtime's device object `dkrt_dev`. The engine is identical code at the same addresses on both devices.
[[object]]
path = "build/usb-bulk-audio.dko.json"
sources = ["src/cf/usb_bulk_audio.c", "src/cf/ua_tramp.s"]
place = "cf.expansion"

[object.externs]
usb_port_table = "cf.usb.data.port_table"
ua_init_next = "hook.cf.usb.site.init.tail"
setup_next = "hook.cf.usb.fn.setup_dispatch.tail"
ep0_send = "cf.usb.fn.ep0_send"
usb_setup = "cf.usb.data.setup"
usb_active_port = "cf.usb.value.active_port"

[[op]]
op = "hook"
hook = "cf.usb.hook.init"
to = "ua_init_hook"

[[claim]]
resource = "cf.usb.site.init"

# The entry of the EP0 setup dispatcher goes to ua_setup_hook (a stub): ua_setup_handle answers the Windows WinUSB requests (device descriptor with bcdUSB 2.01, BOS, MS OS 2.0
# descriptor set) in USB AUDIO/MIDI when interface 5 is attached, and the stub then returns to the USB interrupt. For everything else the stock dispatcher runs from its first
# instruction (README.md "Windows (MS OS 2.0)").
[[op]]
op = "hook"
hook = "cf.usb.hook.setup_dispatch"
to = "ua_setup_hook"

[[claim]]
resource = "cf.usb.fn.setup_dispatch"
