[module]
id = "core/input"
version = "0.1.0"
name = "Input"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Presses keys and turns encoders from software through the firmware's own panel decoders: dk_input_key(code, down) and dk_input_turn(encoder, delta) for modules"
requires = ["core/runtime"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12", "st-1.42"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"
"st-1.42" = "experimental"

# The panel MCU sends 2-byte packets on UART8 (key: 0x20 | channel and the 8-bit mask; encoder: 0x30 | (encoder - 1) and a signed delta); the firmware
# decodes them with two plain C functions. This module calls those (docs/findings/58-panel-input-path.md, docs/plans/remote-control.md). Which
# backend a device uses, and its key code layout, are the device file's ([input], [panel]), generated into `build/gen/input-<dev>.inc`.
[[gen]]
kind = "gas"
path = "build/gen/input-{dev}.inc"
uses = ["INPUT_BACKEND", "PANEL_LINEAR", "PANEL_BUTTON_CHANNELS", "PANEL_ENCODERS", "PANEL_EXC_N", "PANEL_EXC_CODE_*",
    "PANEL_EXC_CH_*", "PANEL_EXC_BIT_*"]

[[object]]
path = "build/input.dko.json"
sources = ["src/cf/input.c"]
place = "cf.expansion"

[object.externs]
input_fw_key = "cf.input.fn.key_decoder"
input_fw_turn = "cf.input.fn.enc_decoder"
input_mask_lit = "cf.input.site.key_decoder.prev_mask_lit"
input_queue_lit = "cf.view.site.ui_loop.queue_lit"

[[object]]
path = "build/device-dt2.dko.json"
sources = ["src/cf/dt2/device.s"]
place = "cf.expansion"
devices = ["dt2"]

[[object]]
path = "build/device-dn2.dko.json"
sources = ["src/cf/dn2/device.s"]
place = "cf.expansion"
devices = ["dn2"]

[[object]]
path = "build/device-st.dko.json"
sources = ["src/cf/st/device.s"]
place = "cf.expansion"
devices = ["st"]

# The key subscribers: every key event of the panel passes the firmware's key walker once, in the UI task, before any view. This module takes the entry of the walker (`cf.input.hook.key_event`,
# ports/fw/input.toml; the devices that have it) to `input_key_walk_hook` (src/cf/key-walk.s), which offers the event to the subscribers of `key_subscribers.c` in slot order: the first that
# returns nonzero consumes it, else the stock walker runs through the tail of the site. A service file subscribes its routine through `input_keys_info` (below) instead of taking the site.
[[object]]
path = "build/key-subscribers.dko.json"
sources = ["src/cf/key_subscribers.c", "src/cf/key-walk.s"]
place = "cf.expansion"
devices = ["dt2", "dn2"]

[object.externs]
input_key_tail = "hook.cf.input.site.key_event_walk.tail"

[[op]]
op = "hook"
hook = "cf.input.hook.key_event"
to = "input_key_walk_hook"
devices = ["dt2", "dn2"]

[[claim]]
resource = "cf.input.site.key_event_walk"
devices = ["dt2", "dn2"]

# The calls and the size of the table, for the services that subscribe (CoreApi::info "input_keys_info"; key_subscribers.h: 'KEYS', version 1, slots, subscribe, unsubscribe).
[[info]]
name = "input_keys_info"
symbol = "input_keys_info"
devices = ["dt2", "dn2"]
