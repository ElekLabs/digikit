default = 0
[[registry.field]]
name = "f3"
kind = "u32"
default = 0
[[registry.field]]
name = "f4"
kind = "u32"
default = 0
[[registry.field]]
name = "f5"
kind = "u32"
default = 0
[[registry.field]]
name = "f6"
kind = "u32"
default = 0
[[registry.field]]
name = "f7"
kind = "u32"
default = 0
[[registry.field]]
name = "f8"
kind = "u32"
default = 10
[[registry.field]]
name = "clone_of"
kind = "u32"
[[registry.field]]
name = "position"
kind = "u32"
default = 255
[[registry.field]]
name = "own_dsp"
