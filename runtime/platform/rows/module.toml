[module]
id = "core/rows"
version = "0.2.0"
name = "Parameter descriptors"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "The rows of the Digitakt II and Digitone II MAIN OS that run-time modules fill: the parameter table with one row appended per parameter, the machine types (rows, names, permissions, per-type bytes, the dispatch of a type) and the Digitone II page rows, reserved in the image, with one table that says where they are (rows_info)"
requires = []
conflicts = []

# Content modules list `core/rows` in `requires` and add parameters with
#
#     [[entry]]
#     registry = "params"
#     id = "pluck_decay"
#     name = "Decay"          # the page header when the knob is touched
#     short = "DECAY"         # the label under the knob
#     template = 0xd1         # stock code whose row is copied: owner, flag, kind, mask, formatter and the value-class
#                             # object the UI keeps for the code (a template of the same class)
#     slot = 1                # descriptor field (engine slot) 0..7: fixes the mirror index (25, 26, 27, 28, 31, 32, 33, 34)
#     min = 0
#     max = 0x7f00
#     default = 0x4000
#
# The code of a parameter is `params.first + k` (symbol params.<id>.index); an owner's records name it. Finding 02,
# "core.params": the table is copied at patch time from the image (nothing of the firmware is stored here), the
# references and bounds are anchors (cf.param.sites.descriptor_table.ref.N, cf.param.sites.descriptor_table.bound.N) found by tools/patchkit/port_resolve.py.
# Digitone II: the same, with the slot = the sound-array slot itself (25 .. 64; a slot the firmware's own parameter pages map), template a stock code of the 321 rows (e.g. 0xd5, A Env Decay: a plain 0 .. 127
# word), and the table is 321 rows.
# Loops that visit every code (the defaults refresh, the per-owner lookup maps, the owner enumeration of the modulation
# destination list) end on `bne`/`beq`, not on a clamp, and keep the stock count: the new rows do not enter them.

# The reservation. The image makes room: `[[entry]]` with a `count` stands for that many rows, the count an expression over the device file's
# `[limits]` and the block sizes `rows_b1`, `rows_b2`, `rows_b3` (each `[[rows.block]]` of the device file: `per` times its `limit`; one source, docs/design/device-data.md). Three blocks, in this order, so a code is `params.<id>0.index + k` (the ids
# dp, fp and fs are the symbols the users link by). The platform knows the blocks by number: each block's owner number, size (a `[limits]` key times a
# factor) and template come from the device file's `[rows]` and `[[rows.block]]` (the device file says what each block is for).
# Each owner fills its block at load and clears it at unload; the template is a stock row that is valid for the value-class lookup. No
# other module adds a row to this registry in the image (packages/patchkit/tests/rows.rs). `rows_info` (src/cf/rows-info.inc) says where
# the blocks are and how a row is made; the capacity words of the admission point at it.

[[gen]]
kind = "gas"
path = "build/gen/device-{dev}.inc"
uses = ["DEVICE_ID", "DYN_TYPES", "ROWS_*", "PROFILE_*"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

[[registry]]
name = "params"
devices = ["dt2"]
first = "image.u32(cf.param.fn.value_class + 6)"      # the immediate of `cmpi.l #count,D0` in the accessor: the stock row count
max = 64
region = "cf.expansion"

[[registry.field]]
name = "name"
kind = "cstr"
max_len = 31
[[registry.field]]
name = "short"
kind = "cstr"
max_len = 15
[[registry.field]]
name = "template"
kind = "u32"
[[registry.field]]
name = "slot"
kind = "u32"
[[registry.field]]
name = "min"
kind = "u32"
[[registry.field]]
name = "max"
kind = "u32"
[[registry.field]]
name = "default"
kind = "u32"

[[registry]]
name = "params"
devices = ["dn2"]
first = "image.u32(cf.param.fn.value_class + 6)"      # the immediate of `cmpi.l #count,D0` in the accessor: the stock row count
max = 64
region = "cf.expansion"

[[registry.field]]
name = "name"
kind = "cstr"
max_len = 31
[[registry.field]]
name = "short"
kind = "cstr"
max_len = 15
[[registry.field]]
name = "template"
kind = "u32"
[[registry.field]]
name = "slot"
kind = "u32"
[[registry.field]]
name = "min"
kind = "u32"
[[registry.field]]
name = "max"
kind = "u32"
[[registry.field]]
name = "default"
kind = "u32"

# the parameter table, 60-byte rows: owner, mirror index, min, max, default, flag, (cc << 16 | kind), 0x80 + slot,
# 2 words of the template, name, template word, short, template formatter, template word. A `param_edits` entry rewrites
# the min, max, name, short and formatter words of a stock row in the copy.
[[section]]
name = "pf_table"
region = "cf.expansion"
devices = ["dt2"]
from = { anchor = "cf.param.data.descriptor_table", len = "image.u32(cf.param.fn.value_class + 6) * 60" }
append = { registry = "params", row = [
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x00)",
  "25 + $slot + ($slot >> 2) * 2",
  "$min",
  "$max",
  "$default",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x14)",
  "(0x10 + $slot + ((($slot + 1) >> 2) & 1) * (1 - ($slot >> 2)) * 0xffec) << 16 | (image.u32(cf.param.data.descriptor_table + 60 * $template + 0x18) & 0xffff)",
  "0x80 + $slot",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x20)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x24)",
  "$name",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x2c)",
  "$short",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x34)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x38)",
] }
edit = { registry = "param_edits", at = "60 * $code", fields = [
  { offset = 0x08, value = "$min" },
  { offset = 0x0c, value = "$max" },
  { offset = 0x28, value = "$name" },
  { offset = 0x30, value = "$short" },
  { offset = 0x34, value = "$formatter" },
] }

# Edits of stock rows (Digitakt II): an adapter changes a stock parameter's range, formatter and names with
#
#     [[entry]]
#     registry = "param_edits"
#     id = "ovr_type"
#     code = 0x103            # the stock parameter code (its row in the copied table)
#     max = 0xf00
#     formatter = "my_fmt"
#     name = "OVR Type"
#     short = "OD.TY"
#     class = 0xd1            # optional: draw its knob cell as this code's (here the formatter's text); 0 = its own
#     min = 0x100             # optional, default 0
# The registry is declared on the Digitone II too (no edit there) so both devices' accessor hook links the same source.
[[registry]]
name = "param_edits"
devices = ["dt2", "dn2"]
first = "0"
max = 16
region = "cf.expansion"

[[registry.field]]
name = "code"
kind = "u32"
[[registry.field]]
name = "max"
kind = "u32"
[[registry.field]]
name = "formatter"
kind = "u32"
[[registry.field]]
name = "name"
kind = "cstr"
max_len = 31
[[registry.field]]
name = "short"
kind = "cstr"
max_len = 15
[[registry.field]]
name = "class"              # a code whose value-class object the UI uses for this one (its knob cell); 0 = its own
kind = "u32"
default = 0
[[registry.field]]
name = "min"
kind = "u32"
default = 0

# Digitone II: the same 60-byte rows; the slot is the sound-array slot itself (25 .. 64) and the template supplies the
# MIDI CC word and the key (the lookup maps are built from the stock rows only)
[[section]]
name = "pf_table"
region = "cf.expansion"
devices = ["dn2"]
from = { anchor = "cf.param.data.descriptor_table", len = "image.u32(cf.param.fn.value_class + 6) * 60" }
append = { registry = "params", row = [
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x00)",
  "$slot",
  "$min",
  "$max",
  "$default",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x14)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x18)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x1c)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x20)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x24)",
  "$name",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x2c)",
  "$short",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x34)",
  "image.u32(cf.param.data.descriptor_table + 60 * $template + 0x38)",
] }

[[object]]
path = "build/params-dt2.dko.json"
sources = ["src/cf/dt2/params.s"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
_pf_first = "params.first"
_pf_count = "params.count"
_pf_rows = "params.rows"
_pf_rowsize = "params.row_size"
_pe_count = "param_edits.count"
_pe_rows = "param_edits.rows"
_pe_rowsize = "param_edits.row_size"
_pf_t_t2 = "hook.cf.param.fn.value_class.4.tail"

[[object]]
path = "build/params-dn2.dko.json"
sources = ["src/cf/dt2/params.s"]
place = "cf.expansion"
devices = ["dn2"]

[object.externs]
_pf_first = "params.first"
_pf_count = "params.count"
_pf_rows = "params.rows"
_pf_rowsize = "params.row_size"
_pe_count = "param_edits.count"
_pe_rows = "param_edits.rows"
_pe_rowsize = "param_edits.row_size"
_pf_t_t2 = "hook.cf.param.fn.value_class.4.tail"

# the second per-code table's accessor: `move.l 4(sp),D0; cmpi.l #count,D0`; hook the compare
[[op]]
op = "hook"
hook = "cf.param.hook.value_class"
to = "pf_t2"
devices = ["dt2"]

# every absolute reference into the stock table now points into the copy (same offset)
[[op]]
op = "write"
anchors = "cf.param.sites.descriptor_table.ref.*"
offset = 0
value = "pf_table + (image.u32(this) - cf.param.data.descriptor_table)"
width = 4
devices = ["dt2"]

# every clamp bound `cmpi.l #N,Dn` (N = the stock count or one less) grows by the number of added rows
[[op]]
op = "write"
anchors = "cf.param.sites.descriptor_table.bound.*"
offset = 2
value = "image.u32(this + 2) + params.count"
width = 4
devices = ["dt2"]

# (Digitone II) the second per-code table's accessor: `move.l 4(sp),D0; cmpi.l #count,D0`; hook the compare
[[op]]
op = "hook"
hook = "cf.param.hook.value_class"
to = "pf_t2"
devices = ["dn2"]

# every absolute reference into the stock table now points into the copy (same offset)
[[op]]
op = "write"
anchors = "cf.param.sites.descriptor_table.ref.*"
offset = 0
value = "pf_table + (image.u32(this) - cf.param.data.descriptor_table)"
width = 4
devices = ["dn2"]

# every clamp bound `cmpi.l #N,Dn` (N = the stock count or one less) grows by the number of added rows
[[op]]
op = "write"
anchors = "cf.param.sites.descriptor_table.bound.*"
offset = 2
value = "image.u32(this + 2) + params.count"
width = 4
devices = ["dn2"]

[[claim]]
resource = "cf.params.sites"

