# ---- patches: hooks (code in the objects above), bound writes and repointed table references ------------------------

# dispatch: the descriptor of an added type is its registry row

[[op]]
op = "hook"
hook = "cf.machine.hook.dispatch"
to = "mf_dispatch"
devices = ["dt2"]

[[op]]
op = "hook"
hook = "cf.machine.hook.dispatch"
to = "mf_dispatch"
devices = ["dn2"]

# The machine list builder's buffer and its sizes (4 patches), and the rank pairs of the sort comparator, are the machines service's (services/machines): it builds them in `start` and patches the
# list builder at load.

# group (Digitakt II): SLICE and its clones; (Digitone II: a hook, below). Bound = the last type, branch `bne` -> `bcs`

[[op]]
op = "write"
anchor = "cf.machine.site.group"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.machine.site.group"
offset = 0x4
value = "0x65"
width = 1
devices = ["dt2"]

# names: three accessors (long, short, header hint), each bounded by `moveq #last,D1`, each reading a column of the table
[[op]]
op = "write"
anchor = "cf.machine.fn.name.long"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.fn.name.long"
offset = 0x12
value = "mf_names + 0"
width = 4
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.short"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.short"
offset = 0x14
value = "mf_names + 4"
width = 4
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.hint"
offset = 0x1
value = "machines.first + machines.count - 1"
width = 1
devices = ["dt2", "dn2"]

[[op]]
op = "write"
anchor = "cf.machine.site.name.hint"
offset = 0x14
value = "mf_names + 8"
width = 4
devices = ["dt2", "dn2"]

# permission mask table (bound `moveq #last,D2`)

[[op]]
