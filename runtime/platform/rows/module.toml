# The table of this module, in the image's info table (`dkrt_info_table`), and the capacity limits it reserves, as `cap_<kind>` entries: the admission
# requires these exact names (the kinds of `[capacity.kinds]` in sdk/sdk.toml) and finds the limit of a kind there; each
# points at the u32 word that holds the limit, so the planner knows the limit before any owner's file is loaded (docs/PATCHING.md).
[[info]]
name = "rows_info"
devices = ["dt2", "dn2"]

[[info]]
name = "cap_machine_rows"
symbol = "rows_info + 424"
devices = ["dt2", "dn2"]

[[info]]
name = "cap_param_rows"
symbol = "rows_info + 428"
devices = ["dt2", "dn2"]

[[info]]
name = "cap_page_rows"
symbol = "rows_info + 432"
devices = ["dt2", "dn2"]

[[info]]
name = "cap_send_slots"
symbol = "rows_info + 436"
devices = ["dt2", "dn2"]

