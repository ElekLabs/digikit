[package]
name = "dkrt-lifecycle"
version = "0.1.0"
edition = "2021"
publish = false
description = "The package graph of the digikit runtime: which services a package needs, in which order packages come up and go down. Pure, no allocation; the runtime implements its seams and does not drive it yet"

[lib]
path = "src/lib.rs"

[features]
# `fake`: the recording seams and the fake manifest (`fake`) for the host tests of other crates. It builds with std: only dev-dependencies enable it.
fake = []

[dependencies]
dkrt-abi = { path = "../abi" }
dkrt-fit = { path = "../fit" }
dkrt-sdk = { path = "../sdk" }
dkneeds = { path = "../../../packages/dkneeds" }
