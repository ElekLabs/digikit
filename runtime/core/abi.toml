[[fn]]
name = "dkrt_record_name"
sig = "i32 dkrt_record_name(u32 owner, u8 *out)"
doc = "Called by core/ui: the name of the loaded record `owner` (the number `dkrt_ctx_owner` gave: a content module or a service file) into `out`, 32 bytes, NUL padded, as the file's header has it. core/ui keys the SETTINGS rows of an owner by it. OK, or E_NOT_FOUND for a record that is not loaded, with no package, or with a package built before the entry."
at = "menu_exports"
