[[host_dir]]
name = "MENU_POPUP_TEXT"
owner = "package"
doc = "DK_POPUP_TEXT of the DIGIKIT menu: the text of the last dialog the menu opened."

[[host_dir]]
name = "MENU_POPUPS"
owner = "package"
doc = "DK_POPUPS of the DIGIKIT menu: how many dialogs the menu opened."

[[host_dir]]
name = "MENU_ABOUT"
owner = "package"
doc = "DK_ABOUT of the DIGIKIT menu: the ABOUT page's rows as text (24 rows of 24 bytes)."

[[host_dir]]
name = "MENU_ABOUT_N"
owner = "package"
doc = "DK_ABOUT_N of the DIGIKIT menu: the number of rows in MENU_ABOUT."

[[host_dir]]
name = "MENU_PANEL"
owner = "package"
doc = "DK_PANEL of the DIGIKIT menu: the rows of the last side panel as text (4 rows of 24 bytes)."

[[host_dir]]
name = "MENU_PANEL_N"
owner = "package"
doc = "DK_PANEL_N of the DIGIKIT menu: the number of rows in MENU_PANEL."

[[host_dir]]
name = "MENU_MEM"
owner = "package"
doc = "DK_MEM of the DIGIKIT menu: the MEMORY page's rows as text (8 rows of 24 bytes)."

[[host_dir]]
name = "MENU_MEM_N"
owner = "package"
doc = "DK_MEM_N of the DIGIKIT menu: the number of rows in MENU_MEM."

[[host_dir]]
