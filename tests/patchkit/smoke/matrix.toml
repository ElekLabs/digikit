# The patchkit test matrix: device x firmware x module set (tools/patchkit/pk_harness.py). An empty set is the stock firmware.
# Ready inputs for each firmware must be fresh (tools/emulator/ready.py, SOURCE.json intc_force false): see the harness doc.

[[cell]]
device = "dt2"
firmware = "1.17"
modules = []

[[cell]]
device = "dn2"
firmware = "1.12"
modules = []

[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/machines", "test/machine-clone"]

[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/dsp-voice", "core/machines", "core/params", "test/patched-pluck"]

# Rust on the ColdFire (finding 26)
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["test/rust-demo"]

# The ColdFire C demo: its functions are called in place (tests/fixtures/modules/cf-demo/tests/smoke.toml).
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["test/cf-demo"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["test/cf-demo"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/machines", "test/dn2-clone"]

# Digitone II PLUCK (its own SYN page, the DN2 voice hook) and the own-pages test machine.
[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/machines", "core/params", "core/dsp-voice", "test/patched-pluck"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/machines", "core/params", "test/dn2-pages"]

# SETTINGS > DIGIKIT (finding 28)
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/digikit-menu"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/digikit-menu"]

# The DSP code channel (finding 31): hooks the frame sender and the DSP's block handler; idle it must change nothing visible.
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/dsp-link"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/dsp-link"]

# The effects adapter (finding 53, H1): an empty chain must change nothing visible; test/fx-gain (0.5) is in the chain of the second cell.
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/fx"]

[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/fx", "test/fx-gain"]
