# The patchkit test matrix: device x firmware x module set (tools/patchkit/pk_harness.py). An empty set is the stock firmware.
# Ready inputs for each firmware must be fresh (tools/emulator/ready.py, SOURCE.json intc_force false): see the harness doc.

[[cell]]
device = "dt2"
firmware = "1.17"
modules = []

[[cell]]
device = "dn2"
firmware = "1.12"
modules = []

# Rust on the ColdFire (finding 26)
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["test/rust-demo"]

# The ColdFire C demo: its functions are called in place (tests/fixtures/modules/cf-demo/tests/smoke.toml).
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["test/cf-demo"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["test/cf-demo"]

# The DSP code channel (finding 31): hooks the frame sender and the DSP's block handler; idle it must change nothing visible.
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/dsp-link"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/dsp-link"]

# The effects adapter (finding 53, H1): an empty chain must change nothing visible.
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/fx"]

# SETTINGS > DIGIKIT in the system package's menu (finding 28; the cards carry digikit/system.dksp): the tour of
# runtime/apps/digikit-menu/tests/menu.toml walks ABOUT, MEMORY and MODULES on the real firmware.
# The MEMORY page's CPU row is the module arena (CAPACITY kind ARENA), not processor load. The system package has its own block (PACKAGE_BYTES, CAPACITY kind PACKAGE),
# so with no module loaded the row reads 0% and MODS 0/8 on both devices. Not load-dependent; it changes only when the arena's use changes.
[[cell]]
device = "dt2"
firmware = "1.17"
modules = ["core/digikit-menu"]

[[cell]]
device = "dn2"
firmware = "1.12"
modules = ["core/digikit-menu"]
