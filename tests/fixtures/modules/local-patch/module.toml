[module]
id = "test/local-patch"
version = "1.0.0"
name = "Local patch service"
category = "test"
role = "service"
service = "local-patch"
callback_order = 460
type = "raw"
author = "digikit"
status = "experimental"
summary = "Fixture for a service that takes a patch of the firmware: two bytes, written at load with a value its start computed, and the stock bytes back before stop"
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

# The patch it takes (ports/fw/filter.toml, listed by the port file of the test image): the low word of the dead size bound of `cmpi.l #0x3fffffff,D1` in the order vector copy. `init` repeats it
# with dk_service_declare_patch (`patches` of `service!`).
[[patch]]
name = "cf.filter.hook.test_bound_patch"

[[export]]
name = "local_patch_value"

[[object]]
path = "build/local-patch.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"
