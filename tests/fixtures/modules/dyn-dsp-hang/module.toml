[module]
id = "test/dyn-dsp-hang"
version = "0.1.0"
name = "HANG-D"
category = "test"
type = "machine"
author = "digikit"
status = "experimental"
summary = "Test fixture: a run-time machine whose DSP routine never returns after a few blocks, to see what the debug log shows when the SHARC stops."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# Like test/dyn-guard-nan, a machine of the SDK contract whose render hangs on the third block of a note (src/dsp/hang.s). `patchkit pack test/dyn-dsp-hang --device dt2` makes the .dkm.
# Never select this module on a device you care about: the DSP stops until the next restart. It is the negative fixture of the machine conformance suite (tools/patchkit/pk_conform.py).
[[machine]]
id = "hang"
dsp = "hg"

[[object]]
path = "build/dyn-dsp-hang-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/dyn-dsp-hang-dsp.dko.json"
sources = ["src/dsp/hang.s"]
place = "dsp.l2"
devices = ["dt2"]

[uses.dt2]
machine_rows = 1
param_rows = 0
page_rows = 0
record_bytes = 124

[uses.dn2]
machine_rows = 8
param_rows = 16
page_rows = 8
record_bytes = 0
