[module]
id = "test/local-ping"
version = "1.2.0"
name = "Local ping service"
category = "test"
role = "service"
service = "local-ping"
callback_order = 450
type = "raw"
author = "digikit"
status = "experimental"
summary = "Fixture for a service with an API declared outside the SDK"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# One patch of the port file of the test image (ports/fw/filter.toml): two bytes of the chooser's order vector allocation, written at load with the value `init` declares.
[[patch]]
name = "cf.filter.hook.test_list_size_patch"

[[export]]
name = "local_ping_value"

[[export]]
name = "dk_service_query_v1"

[[object]]
path = "build/local-ping.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"
