syntax = "proto3";

package project_user;

import "dk/options.proto";

// What the project service's exports return (dk_project_list, dk_project_get, dk_project_settings, dk_project_read), as a module sees them. The device holds at most 128 projects (slots 0 to 127).
service ProjectUser {
  // The projects from first_slot upward, 16 at most; next is the slot to ask for the next page, 0 when there are no more.
  rpc List(ListRequest) returns (ListReply);
  // The summary of one project. loading is true while the device reads the project's file: ask again.
  rpc Get(GetRequest) returns (GetReply);
  // The settings a project saved for one module, 4 at most. version is the counter of Get's reply: changed is true when the project has changed since. loading is true while
  // the device reads the project's file: ask again. next is the cursor for the next page, 0 for none.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsReply);
  // The raw bytes of the project's .dkp file from offset, 768 at most; total is the length of the whole file. version, loading and changed are as in GetSettings.
  rpc ReadFile(ReadFileRequest) returns (ReadFileReply);
}

message ListRequest {
  uint32 first_slot = 1;
}

message Project {
  uint32 slot = 1;
  string name = 2 [(dk.max_len) = 16];
  bool current = 3;
  bool has_data = 4;
  // has_data is not known yet (the device has not finished listing its store).
  bool data_unknown = 5;
}

message ListReply {
  repeated Project items = 1 [(dk.max_count) = 16];
  uint32 next = 2;
}

message GetRequest {
  uint32 slot = 1;
}

message Module {
  string id = 1 [(dk.max_len) = 31];
  uint32 hash = 2;
  // The number of settings entries the project holds for the module.
  uint32 settings = 3;
  bool loaded = 4;
}

message GetReply {
  bool loading = 1;
  bool found = 2;
  uint32 slot = 3;
  string name = 4 [(dk.max_len) = 16];
  uint32 stamp = 5;
  uint32 counter = 6;
  repeated Module modules = 7 [(dk.max_count) = 8];
}

message GetSettingsRequest {
  uint32 slot = 1;
  string module = 2 [(dk.max_len) = 31];
  uint32 version = 3;
  uint32 cursor = 4;
}

message Setting {
  string key = 1 [(dk.max_len) = 47];
  // The first 64 bytes of the value; value_length is its full length.
  bytes value = 2 [(dk.max_len) = 64];
  uint32 value_length = 3;
}

message GetSettingsReply {
  bool loading = 1;
  bool changed = 2;
  bool found = 3;
  repeated Setting entries = 4 [(dk.max_count) = 4];
  uint32 next = 5;
}

message ReadFileRequest {
  uint32 slot = 1;
  uint32 version = 2;
  uint32 offset = 3;
}

message ReadFileReply {
  bool loading = 1;
  bool changed = 2;
  bool found = 3;
  bytes data = 4 [(dk.max_len) = 768];
  uint32 total = 5;
}
