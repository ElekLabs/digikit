[module]
id = "test/dyn-fault"
version = "0.1.0"
name = "Faulting module"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a module whose init resets the machine, to take a boot into safe mode (finding 37)"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# C, packed like test/c-demo. `init` writes SOFTRST, as the firmware's exception path does when a module faults: the boot
# counter of the digikit runtime rises with every such boot and the third one starts in safe mode.
[[object]]
path = "build/dyn-fault.dko.json"
sources = ["src/c/dyn_fault.c"]
place = "cf.expansion"
