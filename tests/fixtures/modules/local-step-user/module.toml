[module]
id = "test/local-step-user"
version = "0.1.0"
name = "Local step client"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Fixture: the client that imports the local-step service, so that the provider loads (a provider loads only when a selected client imports it)"
