[module]
id = "test/dyn-crash"
version = "0.1.0"
name = "Crashing module"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a module that raises a CPU exception (illegal instruction or division by zero) a configured number of DSP blocks into the UI loop (crash capture, finding 46)"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# C, packed like test/dyn-fault-late. `init` reads the store file `cfg/crash-after.bin` (4 bytes big endian: blocks after the first tick;
# 1 byte: 0 = execute an illegal instruction, 1 = divide by zero) and `tick` raises the exception once that many
# blocks (the runtime's `dkrt_blocks` import, 1500 per second) have passed. Before it does it logs `crash-pc` with the address of the illegal
# instruction, so the log of the crashed boot (the tail of the crash record) names the program counter the record must show.
[[object]]
path = "build/dyn-crash.dko.json"
sources = ["src/c/dyn_crash.c"]
place = "cf.expansion"
