[module]
id = "test/trace-demo"
version = "0.1.0"
name = "Trace demo (test)"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Test effect with trace marks: DK_TRACE in the ColdFire part and DK_STEP in the DSP part, which exist only in a build made with --trace."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# `patchkit pack test/trace-demo --device dt2 -o trace-demo.dkm` makes the .dkm; add `--trace` for the traced one. The test
# packages/patchkit/tests/trace.rs proves that the file without --trace equals the file of the sources without the trace lines.
[[object]]
path = "build/trace-demo-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/trace-demo-dsp.dko.json"
sources = ["src/dsp/trace_demo.s"]
place = "dsp.l2"
devices = ["dt2", "dn2"]
