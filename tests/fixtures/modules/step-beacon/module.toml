[module]
id = "test/step-beacon"
version = "0.1.0"
name = "Step beacon"
category = "test"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Diagnostic effect that stores 0xBE000000 plus a call counter in the module step word on every call; the audio passes unchanged."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The effect is declared by a builder call in init (src/module.c). The id `beacon` is what the keys hash; the DSP symbols start with `sb`.
[[fx]]
id = "beacon"
dsp = "sb"

[[object]]
path = "build/step-beacon-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/step-beacon-dsp.dko.json"
sources = ["src/dsp/step_beacon.s"]
place = "dsp.l2"
devices = ["dt2", "dn2"]

[uses.dt2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 16

[uses.dn2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 16
