[module]
id = "test/lfo-shape-b"
version = "0.1.0"
name = "LFO shape B"
category = "test"
type = "service"
author = "digikit"
status = "experimental"
summary = "Test fixture: a second lfo_shape record (name STEP, two levels) under another module id, so another shape key: two shapes in one boot, a gap below the highest number; no firmware effect."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The record the module emits: its key derives from the module id and this id (`DK_KEY_SHAPE` in build/gen/module_ids.h). The packer writes the key into the header
# table, where the boot planner checks that the kind has an owner and that no other module has the key.
[[record]]
kind = "lfo_shape"
id = "shape"

# The record block `init` commits: the register section header (16 bytes) and one record (80 bytes).
[uses.dt2]
record_bytes = 96

[uses.dn2]
record_bytes = 96

# C, built by `patchkit build`; the runtime loads it from the card store.
[[object]]
path = "build/lfo-shape-b.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"
