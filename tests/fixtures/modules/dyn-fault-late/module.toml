[module]
id = "test/dyn-fault-late"
version = "0.1.0"
name = "Late faulting module"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a module that stops the machine a configured number of DSP blocks into the UI loop (safe mode after the first UI pass, finding 37)"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# C, packed like test/dyn-fault. `init` reads the store file `cfg/fault-after.bin` (4 bytes big endian: blocks after the first UI-loop
# pass; 1 byte: 0 = write SOFTRST, as the firmware's exception path does, 1 = hang in the UI task) and `tick` stops the machine once
# that many blocks (the runtime's `dkrt_blocks` import, 1500 per second) have passed.
[[object]]
path = "build/dyn-fault-late.dko.json"
sources = ["src/c/dyn_fault_late.c"]
place = "cf.expansion"
