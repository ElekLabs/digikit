[module]
id = "test/ui-demo"
version = "0.1.0"
name = "UI demo"
category = "test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: a content module that adds the SETTINGS row UI DEMO (dk_ui_settings_row); it opens a menu with one row of each kind, a text page, a list with check marks and a side panel, an empty list, and rows that open a confirm, a choice and a toast, all through core/ui"
requires = ["core/ui"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# C, built by `patchkit build`. Loaded by the digikit runtime from the card store (`patchkit pack test/ui-demo`). The row opens the demo menu.
[[object]]
path = "build/ui-demo.dko.json"
sources = ["src/ui_demo.c"]
place = "cf.expansion"
