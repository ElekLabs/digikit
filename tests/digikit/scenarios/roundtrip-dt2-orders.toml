# The same project through four boots: set A, set A again (control for the header stamp), set B (the track-1 machine is absent) and set A in
# the other load order. Every later save equals the second save byte for byte; all equal the first but for the header stamp.
[scenario]
name = "roundtrip-dt2-orders"
kind = "roundtrip"
devices = ["dt2"]
tier = "full"

[roundtrip]
order = ["A", "A", "B", "A2"]
types = ["test/dyn-params:dynp", "test/sine:sine"]   # read from the boot's assignment (D7)
lock_turn = 11
sound_lock_turn = 2   # sine has one parameter (level)

[roundtrip.sets]
A = ["test/dyn-params", "test/sine"]
B = ["test/sine"]
A2 = ["test/sine", "test/dyn-params"]

[[roundtrip.machines]]
track = 1
machine = "test/dyn-params:dynp"
hint = 7

[[roundtrip.machines]]
track = 2
machine = "test/sine:sine"
hint = 8
