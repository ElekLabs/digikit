# The card states a power cut can leave between the two copies of the selection record.
[scenario]
name = "cut-selection"
kind = "cut"
devices = ["dt2", "dn2"]
tier = "full"

[cut]
quick_cases = 2   # the quick tier runs the first two cases and the runtime cut
dt2 = { modules = ["test/sine"] }
dn2 = { modules = ["test/dyn-dn2", "test/sine"] }

[[cut.case]]
a = "new"
b = "old"
want = { loaded = "all", seq = 2, copy = 0 }

[[cut.case]]
a = "torn"
b = "old"
want = { loaded = 0, seq = 1, copy = 1 }

[[cut.case]]
a = "old"
b = "new"
want = { loaded = "all", seq = 2, copy = 1 }

[[cut.case]]
a = "torn"
b = "torn"
want = { loaded = 0, seq = 0, copy = 0 }
