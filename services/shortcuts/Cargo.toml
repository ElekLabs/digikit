[package]
name = "dkrt-svc-shortcuts"
version = "0.1.0"
edition = "2021"
publish = false
description = "The shortcuts service of the digikit runtime: a neutral crate (interface B handlers over CoreApi), host-tested over FakeCore, loaded as a service file (dks/)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/abi" }
dkrt-sdk = { path = "../../runtime/sdk" }
dkrt-svc-params = { path = "../params" }
dkneeds = { path = "../../../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/test-support" }
