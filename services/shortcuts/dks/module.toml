[module]
id = "core/services/shortcuts"
version = "0.10.5"
name = "shortcuts service"
category = "core"
role = "service"
service = "shortcuts"
type = "raw"
author = "digikit"
status = "experimental"
summary = "The shortcuts service of the runtime as a service file"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The functions the file exports to other modules are not listed here: they are the `provided = true` imports of the service in sdk/sdk.toml (`patchkit gen` writes
# `dks/src/gen_exports.rs`, and `service!` takes `exports = gen_exports::exports()`).
#
# A hook (ports/fw/*.toml) for each device that has it: `entry` is the routine of `dks/src/hooks.rs`; without `devices` the hook is for every device. Each [[hook]]
# is also an entry of the `hooks = [...]` list of `service!`, with the same device filter (`patchkit service-check` compares both per device).
#
# [[hook]]
# name = "cf.x.hook.y"
# entry = "x_hook_y"
# devices = ["dt2"]
#
# A fill: the pointer slot of a fixed firmware site (an adapter's `[[slot]]`); a loaded file fills it with the address of its routine. `devices` limits it to one
# device. Each [[fill]] is an entry of the `fills = [...]` list of `service!`.
#
# [[fill]]
# slot = "x_slot"
# entry = "x_fill"
# devices = ["dn2"]

# The hook it takes (ports/fw/input.toml): the entry of the firmware's key walker, a routine of this file (`src/hooks.s`) that runs in place of the first 8 bytes of the walker and leaves
# into the stock code through the tail of its site. `init` repeats it with dk_service_declare_hook (`service!`).
[[hook]]
name = "cf.input.hook.key_event"
entry = "shortcuts_key_hook"

# Rust, built with rustc_codegen_gcc for -mcpu=54418 (`patchkit build`). Packed as a .dks (`patchkit pack core/services/shortcuts`): the file is `shortcuts.dks`.
[[object]]
path = "build/shortcuts.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"

# The tail of the hook of ports/fw/input.toml (`hook.<hook>.tail`: the displaced instructions, then the end of the site), as an alias `patchkit pack` makes into an import.
[object.externs]
shortcuts_t_key = "hook.cf.input.hook.key_event.tail"
