[package]
name = "dkrt-svc-shortcuts-dks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The shortcuts service as a service file (.dks): the crate dkrt-svc-shortcuts behind the glue of dkrt-svc-rt"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
dkrt-sdk = { path = "../../../runtime/core/sdk" }
dkrt-svc-rt = { path = "../../../runtime/core/svc-rt" }
dkrt-svc-shortcuts = { path = ".." }

# This crate sits inside the repository's cargo workspace tree but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
