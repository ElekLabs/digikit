[package]
name = "dkrt-svc-lfo"
version = "0.1.0"
edition = "2021"
publish = false
description = "The lfo service of the digikit runtime: the lfo_shape record kind and its owner-tracked table, linked into the runtime object (interface B handlers over CoreApi)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/core/abi" }
dkrt-sdk = { path = "../../runtime/core/sdk" }
dkrt-svc-params = { path = "../rows" }
dkrt-svc-bitmap = { path = "../bitmap" }
dkneeds = { path = "../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/core/test-support" }
# the service file's own source is compiled into a test by path (tests/contract.rs): it has its own cargo workspace, so it cannot be a dependency
dkrt-svc-rt = { path = "../../runtime/core/svc-rt" }
