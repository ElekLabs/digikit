[module]
id = "core/services/lfo"
version = "0.9.0"
name = "lfo service"
category = "core"
role = "service"
service = "lfo"
callback_order = 400
type = "raw"
author = "digikit"
status = "experimental"
summary = "The lfo service of the runtime as a service file: it owns the lfo_shape record kind, numbers the shapes as values of the LFO wave parameter, gives their samples to the image's table of added waves (core/lfo-table), writes their maximum into the parameter table and names them on the MOD page"
requires = ["core/rows", "core/lfo-table"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The UI hooks it takes (ports/fw/lfo.toml): UI-task sites of the MOD page, listed in the port file. They have no `handler`: each is a routine of this file (`src/hooks-ui.s`) that runs in
# place of the first six bytes of a stock function and leaves into the stock code through the end of its site. DT2 binds two sites, DN2 three. `init` repeats them with dk_service_declare_hook (`service!`).
[[hook]]
name = "cf.lfo.hook.wave_name"
entry = "lfo_ui_name4"

[[hook]]
name = "cf.lfo.hook.wave_name3"
entry = "lfo_ui_name3"
devices = ["dn2"]

[[hook]]
name = "cf.lfo.hook.graph_vec"
entry = "lfo_ui_graph"

# Rust and assembler (`src/hooks-ui.s`), built with rustc_codegen_gcc for -mcpu=54418 (`patchkit build`). Packed as a .dks (`patchkit pack core/services/lfo`): the file is `lfo.dks`.
[[object]]
path = "build/lfo.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"

# The exits of the UI hooks of ports/fw/lfo.toml (`hook.<hook>.exit` is the end of the site), as aliases `patchkit pack` makes into imports.
[object.externs]
lfo_x_name4 = "hook.cf.lfo.hook.wave_name.exit"
lfo_x_name3 = "hook.cf.lfo.hook.wave_name3.exit"
lfo_wave_table = "cf.param.data.descriptor_table"
lfo_wave_row1 = "cf.lfo.data.wave_row.1"
lfo_wave_row2 = "cf.lfo.data.wave_row.2"
lfo_wave_row3 = "cf.lfo.data.wave_row.3"
lfo_x_graph = "hook.cf.lfo.hook.graph_vec.exit"
lfo_t_graph = "hook.cf.lfo.hook.graph_vec.tail"
