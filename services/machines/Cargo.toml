[package]
name = "dkrt-svc-machines"
version = "0.1.0"
edition = "2021"
publish = false
description = "The machines service of the digikit runtime: machine types, parameters, pages, page clicks and native pages, linked into the runtime object (interface B handlers over CoreApi)"

[lib]
path = "src/lib.rs"

[features]
# the methods the service file's host tests use to set up state a loaded module would (`own_row_for_test`, `open_flow_for_test`)
test-support = []

[dependencies]
dkrt-abi = { path = "../../runtime/core/abi" }
dkrt-sdk = { path = "../../runtime/core/sdk" }
dkrt-svc-rows = { path = "../rows" }
dkneeds = { path = "../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/core/test-support" }
# the service file's own source is compiled into two tests by path (tests/file.rs, tests/contract.rs): it has its own cargo workspace, so it cannot be a dependency
dkrt-svc-rt = { path = "../../runtime/core/svc-rt" }
dkrt-svc-machines = { path = ".", features = ["test-support"] }
