[package]
name = "dkrt-svc-project"
version = "0.1.0"
edition = "2021"
publish = false
description = "The project service of the digikit runtime: the .dkp project files, the table of the runtime's settings overlay and the work after the four stock project hooks, over an Env of the store (linked into the service file)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/core/abi" }
dkrt-sdk = { path = "../../runtime/core/sdk" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/core/test-support" }
# the service file's own source is compiled into a test by path (tests/file.rs): it has its own cargo workspace, so it cannot be a dependency
dkrt-svc-rt = { path = "../../runtime/core/svc-rt" }
