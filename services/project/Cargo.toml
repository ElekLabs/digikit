[package]
name = "dkrt-svc-project"
version = "0.1.0"
edition = "2021"
publish = false
description = "The project service of the digikit runtime: the .dkp project files, the table of the runtime's settings overlay and the work after the four stock project hooks, over an Env of the store (linked into the service file)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/abi" }
dkrt-sdk = { path = "../../runtime/sdk" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/test-support" }
