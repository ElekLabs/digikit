[package]
name = "dkrt-svc-fx"
version = "0.1.0"
edition = "2021"
publish = false
description = "The fx service of the digikit runtime: effect pages, FX parameters, routes and send amounts, linked into the runtime object (interface B handlers over CoreApi)"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/core/abi" }
dkrt-sdk = { path = "../../runtime/core/sdk" }
dkrt-svc-params = { path = "../rows" }
dkneeds = { path = "../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/core/test-support" }
