[package]
name = "dkrt-svc-rows"
version = "0.1.0"
edition = "2021"
publish = false
description = "What machines.dks and fx.dks share: the parameter row writers (each writes only the rows its adapter reserves), the dynreg_info words and the plumbing of the builder calls"

[package.metadata.patchkit]
# Preserve ColdFire object bytes after moving the crate from services/params.
staged-dir = "params"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/core/abi" }
dkrt-sdk = { path = "../../runtime/core/sdk" }
dkneeds = { path = "../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/core/test-support" }
