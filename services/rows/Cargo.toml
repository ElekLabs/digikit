[package]
name = "dkrt-svc-params"
version = "0.1.0"
edition = "2021"
publish = false
description = "What machines.dks and fx.dks share: the parameter row writers (each writes only the rows its adapter reserves), the dynreg_info words and the plumbing of the builder calls"

[lib]
path = "src/lib.rs"

[dependencies]
dkrt-abi = { path = "../../runtime/abi" }
dkrt-sdk = { path = "../../runtime/sdk" }
dkneeds = { path = "../../../../packages/dkneeds" }

[dev-dependencies]
dkrt-test-support = { path = "../../runtime/test-support" }
