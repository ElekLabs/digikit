# voice: voice rendering
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

# ---- Digitone II (FUN_b8251b: the helper the engine calls once per voice buffer after the FM synthesis, first
# instruction `I7 = MODIFY(I7, -18)`, 48 bits, displaced; the DSP's frame copy is the literal `I4 = 0x25c48c` of the
# per-block copy in FUN_1c2712).
[[fn]]
name = "dsp.voice.fn.overdrive"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "95283a0fec918601cc2c72b2351184f0e5eb7d2f881873273c6a41404d8ec2ea", offset = 0x0, len = 6 }
mark = "D"
users = ["core/overdrive"]
doc = "The overdrive stage (FUN_1cb3d8), called for each track and for the master: y = clamp(drive x, -1, 1), then y (2 - |y|) three times, out = x + mix (y - x), drive and mix ramped across the block from its record; C convention (R4 record, R8 in, R12 out, the sample count at DM(1, I6))."

[[fn]]
name = "dsp.voice.fn.render_entry"
was = ["dsp.voice.render_entry"]
cpu = "sharc"
rule.dt2 = { kind = "sharc_func", reloc_hash = "830c02524f18d34629acb569a92d052d66f23c9ab260ac27ef8e4a9869c22fd2", offset = 0x0, len = 6 }
rule.dn2 = { kind = "sharc_func", reloc_hash = "7cb2e56b587600a04d8d3876f254fa6fc326af68e6d6e8c7741517e316640dec", offset = 0x0, len = 6 }
mark = "D"
users = ["core/dsp-voice"]
doc = "The per-voice DSP render function, called once per voice buffer (on DN2 after the FM synthesis); its first instruction `I7 = MODIFY(I7, imm)` (48 bits) is the hook point of core/dsp-voice."

[[site]]
name = "dsp.voice.site.chain.overdrive_call"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "47f65f5034040ec69829448cd833243cef4ad84cecabddae61f8849d3f70f7be", offset = 0x82f, len = 6 }
mark = "D"
users = ["core/overdrive"]
doc = "A CALL of the overdrive stage in the per-voice chain driver (FUN_1c642a), one of the two per-track overdrive calls; the voice is 32 - R14 (the driver counts the 32 voices down)."

[[site]]
name = "dsp.voice.site.chain_ool.overdrive_call"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "22b13d0e50f46e4ff422032cd7be2d34b0b9cc01f657c69d0dfb86867ba785fa", offset = 0x19b, len = 6 }
mark = "D"
users = ["core/overdrive"]
doc = "The other per-track CALL of the overdrive stage, in the chain driver's out-of-line code (FUN_1c71ec, finding 06); R14 as at dsp.voice.site.chain.overdrive_call."

[[site]]
name = "dsp.voice.site.render_entry.next"
was = ["dsp.voice.render_next", "dsp.voice.site.render_next"]
cpu = "sharc"
rule.dt2 = { kind = "sharc_func", reloc_hash = "830c02524f18d34629acb569a92d052d66f23c9ab260ac27ef8e4a9869c22fd2", offset = 0x3, len = 6 }
rule.dn2 = { kind = "sharc_func", reloc_hash = "7cb2e56b587600a04d8d3876f254fa6fc326af68e6d6e8c7741517e316640dec", offset = 0x3, len = 6 }
mark = "D"
users = ["core/dsp-voice"]
doc = "The instruction after the first 48-bit instruction of the per-voice render function (+3 parcels); the hook wrapper runs the displaced `MODIFY(I7, imm)` and then jumps here."

