[[hook]]
name = "dsp.voice.hook.chain.overdrive_call"
site = "dsp.voice.site.chain.overdrive_call"
cpu = "sharc"
mode = "retarget"
regs = { in = ["r4", "r8", "r12", "r14", "i6", "i7"], clobbers = ["r0-r2", "r4", "r8", "r12", "i4", "astat"], modes = { m6 = 1, m14 = 1, l3 = 0, l4 = 0, l5 = 0, simd = false } }   # the C convention of the stage it replaces
devices = ["dt2"]
mark = "D"
users = ["core/overdrive"]
doc = "The chain driver's CALL of the overdrive stage for a track; the hook point for another per-track overdrive (the master's calls stay)."

[[hook]]
name = "dsp.voice.hook.chain_ool.overdrive_call"
site = "dsp.voice.site.chain_ool.overdrive_call"
cpu = "sharc"
mode = "retarget"
regs = { in = ["r4", "r8", "r12", "r14", "i6", "i7"], clobbers = ["r0-r2", "r4", "r8", "r12", "i4", "astat"], modes = { m6 = 1, m14 = 1, l3 = 0, l4 = 0, l5 = 0, simd = false } }
devices = ["dt2"]
mark = "D"
users = ["core/overdrive"]
doc = "The other per-track CALL of the overdrive stage (out-of-line code of the chain driver); hooked together with dsp.voice.hook.chain.overdrive_call."

[[hook]]
name = "dsp.voice.hook.render_entry"
site = "dsp.voice.fn.render_entry"
cpu = "sharc"
mode = "replace"
regs = { in = ["r4", "r8", "r12", "r14", "r15", "i4", "i6", "l4"], clobbers = ["r0-r2", "i4", "astat"] }   # union of the DT2 and DN2 stubs; DN2 restores all
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/dsp-voice"]
doc = "First instruction (I7 = MODIFY) of the per-voice render function; the hook point for rendering registered machine types with their own DSP routine (it runs the dropped MODIFY itself)."
