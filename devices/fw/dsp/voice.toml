was = ["dsp.voice.render_entry"]
cpu = "sharc"
rule.dt2 = { kind = "sharc_func", reloc_hash = "830c02524f18d34629acb569a92d052d66f23c9ab260ac27ef8e4a9869c22fd2", offset = 0x0, len = 6 }
