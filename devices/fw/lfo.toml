[[hook]]
name = "cf.lfo.hook.tick_call"
site = "cf.lfo.site.tick_call"
cpu = "cf"
mode = "replace"
exits = ["cf.lfo.site.tick_rand", "cf.lfo.site.tick_done"]
regs = { in = ["d1", "d2", "d3", "a3"], clobbers = ["d0", "d2", "ccr"] }   # scratch of the stub: d0
devices = ["dt2"]
mark = "D"
users = ["core/lfo", "core/services/lfo"]
doc = "The LFO tick, the compare of the clamped wave D3 with 6 before the call of the wave function table (interrupt context). exit.1 is the RAND code, exit.2 the code after the call (the result in d0); the end of the site is the table call of the stock waves. DT2 0x40139804: `moveq 6,D7; cmp.l D3,D7; beq 0x40139832`. Dead at the RAND code (0x40139832): D0 and the flags (strict); at the code after the call (0x4013989e): D2, D3, D5, D7 and the flags, D1 is live (the stock call path keeps it in its frame, the routine saves it); A0 and A1 are not proven dead there (strict), so the routine saves them too. The block is A3 (wave byte at 2(a3))."

