# The LFO tick and its second reader (docs/findings/143-lfo-waveforms.md): the sites that make a wave value above RAND a table shape, DT2 1.17 and DN2 1.12.
# Each site is the six bytes `moveq 6,Dn; cmp.l D3,Dn; beq|bne` that compare the clamped wave with 6. An image stub (core/lfo, `op = "stub"`) runs them while the slot is
# empty, so the image is stock without the lfo service; the lfo service fills the slots and its routine tests the unclamped wave byte for a value above 6.

[[site]]
name = "cf.lfo.site.tick_call"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "b121ea94a360f3ab5670cbda5f32a501", offset = 0x1e6, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "de34999302c8ac3ccee8402fc8c461a3", offset = 0x2c0, len = 6 }
mark = "D"
users = ["core/lfo", "core/services/lfo"]
doc = "DT2 0x40139804, DN2 0x40137cc6: the LFO tick: `moveq 6,Dn; cmp.l D3,Dn; beq` before the wave function table call (D3 is the wave clamped to 0..6; the beq goes to the RAND code)."

[[site]]
name = "cf.lfo.site.tick_slew"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "b121ea94a360f3ab5670cbda5f32a501", offset = 0x24e, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "de34999302c8ac3ccee8402fc8c461a3", offset = 0x318, len = 6 }
mark = "D"
users = ["core/lfo", "core/services/lfo"]
doc = "DT2 0x4013986c, DN2 0x40137d1e: the LFO tick: `moveq 6,Dn; cmp.l D3,Dn; bne` before the slew code of RAND (the bne skips it)."

