# ---- The MOD page: the sites of the UI task hooks of the lfo service (docs/findings/143-lfo-waveforms.md, "The panel hooks"). They are `.dks` hooks (bound by `patchkit bind`), not interrupt stubs.
# The three functions are outside the functions that the Ghidra database of the image keeps (`catalog declare` finds no containing function), so each site is a `cf_words` signature of the stock
# words from the function entry. The word that holds the low half of the name table's address is a wildcard (DN2 1.11 has other table addresses), the high half of it stays: it tells the
# four-character formatter (0x401f....) from the three-character one (0x401d....). The other name formatters differ in the size of the frame and the length of their tables.

[[site]]
name = "cf.lfo.site.wave_name"
cpu = "cf"
rule.dt2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x48794021, 0x3ffc486e, 0xffe44eb9], offset = 0, len = 6 }
rule.dn2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x4879401f, "*", 0xffe44eb9], offset = 0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DT2 0x400e1b68, DN2 0x400e3610: the entry of the wave name formatter `fmt(int value, char *buf)` (the four-character names of the seven stock waves; DN2 also has `wave_name3`): `link.w A6,-0x1c; moveq 6,D0` (6 bytes), then `value >> 8` against 6 (unsigned) and the sprintf of the name table, or of \"ERR\"."

[[site]]
name = "cf.lfo.site.wave_name3"
cpu = "cf"
rule.dn2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x4879401d, "*", 0xffe44eb9], offset = 0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DN2 0x4000766c: the entry of the second wave name formatter of the Digitone II, the three-character names (TRI SIN SQR SAW EXP RMP RND): `link.w A6,-0x1c; moveq 6,D0` (6 bytes)."

[[site]]
name = "cf.lfo.site.t1_range"
cpu = "cf"
rule.dt2 = { kind = "cf_words", as = "code", words = [0x2f02222f, 0x00080c81, 0x00000113, 0x55c04878, 0x000c2408, 0x7100c280, 0x2001e588, 0xed899280], offset = 0, len = 6 }
rule.dn2 = { kind = "cf_words", as = "code", words = [0x2f02222f, 0x00080c81, 0x00000141, 0x55c04878, 0x000c2408, 0x7100c280, 0x2001e588, 0xed899280], offset = 0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DT2 0x400da368, DN2 0x400dc154: the entry of the T1 range accessor (A0 = a 12-byte buffer, 4(SP) = the parameter code): it copies {min, max, default} of the code's T1 row (row + 8) to the buffer and returns it in d0. `move.l D2,-(SP); move.l 8(SP),D1` (6 bytes). 171 callers on DT2 (the live-set clamp FUN_4003b570 among them)."

[[hook]]
name = "cf.lfo.hook.wave_name"
site = "cf.lfo.site.wave_name"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["d0", "ccr"] }   # d1, a0 and a1 are saved around the call
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/services/lfo"]
doc = "The wave name formatter of the MOD page (UI task): `fmt(int value, char *buf)`, 4(SP) = value (wave << 8), 8(SP) = buf. For a value of 7 to 14 with a loaded shape the hook writes the shape's name and returns its length; otherwise it runs the displaced `link.w A6,-0x1c; moveq 6,D0` and continues at the end of the site. At the entry the flags are dead (strict liveness) and D0 is written by the displaced moveq."

[[hook]]
name = "cf.lfo.hook.wave_name3"
site = "cf.lfo.site.wave_name3"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["d0", "ccr"] }   # d1, a0 and a1 are saved around the call
devices = ["dn2"]
mark = "D"
users = ["core/services/lfo"]
doc = "The three-character wave name formatter of the Digitone II (UI task): as `wave_name`, with the first three characters of the shape's name."

[[hook]]
name = "cf.lfo.hook.t1_range"
site = "cf.lfo.site.t1_range"
cpu = "cf"
mode = "replace"
regs = { in = ["a0"], clobbers = ["d0", "d1", "ccr"] }   # a0 is the buffer the stock code returns; the hook saves d1, a0 and a1 around its Rust call
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/services/lfo"]
doc = "The T1 range accessor (UI task and others; the stock code has 171 callers on DT2): for the codes 79, 89 and 99 with a loaded shape the hook calls the stock accessor (`dk_stock_`), then raises the maximum in the buffer to the highest loaded wave number << 8. Any other code runs the displaced `move.l D2,-(SP); move.l 8(SP),D1` and the stock code. Dead after the site (strict): D2 (written), D0 and D1 (written before use: only D0b is read before `mvs.b`), and the flags."
