[[hook]]
name = "cf.lfo.hook.tick_call"
site = "cf.lfo.site.tick_call"
cpu = "cf"
mode = "replace"
exits = ["cf.lfo.site.tick_rand", "cf.lfo.site.tick_done"]
regs = { in = ["d1", "d2", "d3"], clobbers = ["d0", "a1", "ccr"] }   # continues at site+6
mark = "D"
users = ["core/lfo", "core/services/lfo"]
doc = "The LFO tick, DT2 and DN2: the compare of the clamped wave D3 with 6 before the call of the wave function table. d2 is the phase accumulator, d3 the wave clamped to 0..6; DT2 has the block in a3 (wave byte at 2(a3)), DN2 in a4 (wave byte at 0x4c(a4)). Interrupt context. exit.1 is the RAND code, exit.2 the code after the call (the result in d0)."

[[hook]]
name = "cf.lfo.hook.tick_slew"
site = "cf.lfo.site.tick_slew"
cpu = "cf"
mode = "replace"
exits = ["cf.lfo.site.tick_done"]
regs = { in = ["d1", "d2", "d3"], clobbers = ["d1", "d2", "a1", "ccr"] }   # continues at site+6
mark = "D"
users = ["core/lfo", "core/services/lfo"]
doc = "The LFO tick: the compare of D3 with 6 before the slew code of RAND. Interrupt context. exit.1 skips the slew code. d0 and d1 (DT2) are live: the routine uses d2 (DT2) or d1 (DN2) as the stock code does."

