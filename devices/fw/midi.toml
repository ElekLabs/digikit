# midi: MIDI send and receive
# Names follow <cpu>.<subsystem>.<kind>.<name>; was = former names, for reading older docs, never resolved (docs/design/firmware-decls.md).

[[fn]]
name = "cf.midi.fn.send"
was = ["dkrt.fw.midi_send"]
cpu = "cf"
sig = "void (u32 len, const u8 *msg, u32 port)"
rule = { kind = "cf_func", hash = "2a29225a7abd75aa3be8d59d049af587", offset = 0x0, len = 2 }
mark = "D"
users = ["core/runtime"]
doc = "The firmware's MIDI send `void f(u32 len, const u8 *msg, u32 port)` (DT2 1.16 FUN_401217fc): port 2 sends to USB through the TX function with the TX mutex taken. Same hash on all four images."

[[site]]
name = "cf.midi.site.rx"
was = ["dkrt.hook.midi_rx"]
cpu = "cf"
rule = { kind = "cf_words", as = "code", words = ["*", 0x1c004e90, 0x4fef000c, 0x2f052044, 0x4e90588f], offset = 0x2, len = 6 }
mark = "D"
users = ["core/runtime"]
doc = "The 6-byte router call `jsr (A0)` in the MIDI task for a gathered USB SysEx message (arguments on the stack); core/runtime hooks it to take the message or continue after the call."

# The USB MIDI transmit function (DT2 1.16 FUN_40004734, `void f(u32 len, const u8 *msg)`, hash identical on the four images): the 4-byte address
# literal of its `movea.l (<in flight>).l,a0`, the bytes handed to the USB stack and not yet sent (added by the submit function, taken off by
# the completion). The function spins while this plus the bytes it queued exceed 0xffb; the upload checks it before it sends a reply.
[[site]]
name = "cf.midi.site.tx_inflight_lit"
was = ["dkrt.fw.tx_inflight_lit"]
bind = "static"
cpu = "cf"
rule = { kind = "cf_func", hash = "0d9c170d6f10a6083e1c92f69af07116", offset = 0x42, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The USB MIDI transmit function (DT2 1.16 FUN_40004734, `void f(u32 len, const u8 *msg)`, hash identical on the four images): the 4-byte address literal of its `movea.l (<in flight>).l,a0`, the bytes handed to the USB stack and not yet sent (added by the submit function, taken off by the completion)."

[[site]]
name = "cf.midi.site.os_upgrade_state_lit"
bind = "static"
cpu = "cf"
rule = { kind = "cf_words", as = "code", words = ["*", "*", 0x4fefffe8, 0x48d71c1c, 0x266f0020, 0x246f001c, 0x71930c80, 0x000000f0], offset = 0x2, len = 4 }
mark = "D"
users = ["core/runtime"]
doc = "The 4-byte address literal of the stub `move.l #<state>,d0; rts` (DT2 1.17 FUN_40120bcc) that returns the OS upgrade receive state object, found by the first words of the stream parser behind it. The byte at +0 of the object is 0 when idle, 1 to 3 while a stream is taken (finding 75). core/runtime does not reset on a DSP stop while it is not 0."

[[hook]]
name = "cf.midi.hook.rx"
site = "cf.midi.site.rx"
cpu = "cf"
mode = "before"
regs = { in = [], clobbers = ["ccr"] }   # the stub continues at the tail or at hook.cf.midi.site.rx.return (after the call)
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/runtime"]
doc = "The MIDI task's router call for a gathered USB SysEx message (`jsr (A0)`, arguments on the stack); the hook can consume the message and continue after the call."
