schema = "dk.steps/1"
name = "reset-machine"
description = "Put the machine type the track had before the case back on it (the teardown of a module case: a module that unloads must leave no type of its own in the kit). The runner remembers the type the firmware reports as the old type of its first SETUP on that track (`original`); `track` is the case's own track."

[args]
track = 1

[[step]]
action = "setup"
track = "{track}"
machine = "original"
