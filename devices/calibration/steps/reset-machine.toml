schema = "dk.steps/1"
name = "reset-machine"
description = "Put a stock machine back on the track (the teardown of a module case: the next case starts from a track that plays a stock machine, and a module that unloads leaves no type of its own in the kit). Type 0 is a stock machine on every device."

[args]
track = 1

[[step]]
action = "setup"
track = "{track}"
machine = 0
