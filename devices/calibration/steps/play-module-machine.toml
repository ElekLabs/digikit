schema = "dk.steps/1"
name = "play-module-machine"
description = "Set a track to a run-time machine of a loaded module and hold a note. `machine` is the module id: the runner puts the machine type the runtime reports for that module on the track (the SETUP command of the debug module). A runner without SETUP skips the case."

[args]
track = 1
key = 60
velocity = 100

[[step]]
action = "setup"
track = "{track}"
machine = "{machine}"

[[step]]
action = "midi.note"
track = "{track}"
key = "{key}"
velocity = "{velocity}"
