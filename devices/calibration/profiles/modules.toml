schema = "dk.calprofile/1"
name = "modules"
description = "The stock case with no module loaded, then one case per module that ships a calibration.toml in its own directory (the calibration modules: machines tb303, pluck, analog, shot, bd and the freqshift effect), each with only that module loaded. The module cases need the SETUP command of the debug module (not built yet); until then the runner captures the stock case and skips the others."
warmup_s = 2
capture_s = 5
repeats = 3
discover = "modules"
teardown = { steps = "release-notes", args = { tracks = "1" } }

[[case]]
id = "stock"
steps = "hold-note"
args = { tracks = "1" }
