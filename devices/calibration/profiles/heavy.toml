schema = "dk.calprofile/1"
name = "heavy"
description = "Every audio track (DT2 8, DN2 16) holds a note with the longest amp release and the delay, reverb and chorus sends open, no modules: the stock engine at its heaviest. RECEIVE NOTES and RECEIVE CC/NRPN on."
warmup_s = 2
capture_s = 5
repeats = 3
teardown = { steps = "release-notes" }

[[case]]
id = "stock"
steps = "heavy-hold"
args = { retrigger_ms = 1000 }
