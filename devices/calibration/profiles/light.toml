schema = "dk.calprofile/1"
name = "light"
description = "One track holds a note through the default Multi-Mode filter, no modules: the smallest stock load. The track must be an audio track whose factory MIDI channel is set, with RECEIVE NOTES on."
warmup_s = 2
capture_s = 5
repeats = 3
teardown = { steps = "release-notes", args = { tracks = "1" } }

[[case]]
id = "stock"
steps = "hold-note"
args = { tracks = "1", retrigger_ms = 1000 }
