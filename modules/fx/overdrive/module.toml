[module]
id = "tom/overdrive"
version = "0.1.0"
name = "Overdrive flavours"
category = "fx"
type = "fx"
author = "tom"
status = "experimental"
summary = "Seven more curves for the tracks' overdrive (TNH4, HARD, SOFT, TUBE, FOLD, FUZZ, SQR), chosen with the FX page's OVR TYPE knob together with pre / post filter."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/params"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/split.inc and consts.inc (included by overdrive.s) are generated by src/dsp/gen_split.py.
[[object]]
path = "build/overdrive-dsp.dko.json"
sources = ["src/dsp/overdrive.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fw_frame = "dsp.voice.frame_base"
_fw_sat = "od.saturator"
_od_tail = "hook.od.split.tail"
_od_tail2 = "hook.od.split2.tail"

[[object]]
path = "build/overdrive-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

# OVR Routing (code 0x103, 0 / 0x100) becomes OVR TYPE: flavour << 9 | post << 8, 0 .. 0xf00
[[entry]]
registry = "param_edits"
id = "ovr_type"
code = 0x103
max = 0xf00
formatter = "od_type_fmt"
name = "OVR Type"
short = "OD.TY"
class = 0xd1                # its knob cell shows the type, as the machines' added parameters do
devices = ["dt2"]

# just after the DSP's two copies of the frame (FUN_1c2b24): the conditional one (`I4 = 0x2567dc` at +0x164) and the one
# each block makes near the end (`R12 = 0x252d3c` at +0x556); both 48-bit literal loads
[[op]]
op = "hook"
cpu = "sharc"
anchor = "od.split"
offset = 0
to = "_od_split"
displaced = "run"
devices = ["dt2"]

[[op]]
op = "hook"
cpu = "sharc"
anchor = "od.split2"
offset = 0
to = "_od_split2"
displaced = "run"
devices = ["dt2"]

# the two per-track calls of the overdrive (the chain drivers' passes over the 32 voices); the master's two stay stock
[[op]]
op = "retarget"
anchor = "od.call.a"
to = "_od_sat"
devices = ["dt2"]

[[op]]
op = "retarget"
anchor = "od.call.b"
to = "_od_sat"
devices = ["dt2"]

[[anchor_rule]]
name = "od.split"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x164
len = 6
mark = "D"

[[anchor_rule]]
name = "od.split2"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x556
len = 6
mark = "D"

[[anchor_rule]]
name = "od.call.a"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "47f65f5034040ec69829448cd833243cef4ad84cecabddae61f8849d3f70f7be"
offset = 0x82f
len = 6
mark = "D"

[[anchor_rule]]
