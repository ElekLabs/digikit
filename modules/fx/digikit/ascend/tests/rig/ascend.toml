[[case]]
name = "the return balances the chosen sideband with half the direct tone"

[case.input]
kind = "sine"
freq = 1500
amp = 0.5

[[case.step]]
params_f32 = [0.25, 63, 0.5, 1]
blocks = 12300

[[case.step]]
params_f32 = [0.25, -64, 0.5, 1]
blocks = 12300

# Two turns per window separate the original tone from both possible sidebands.
