# The frequency shifter digikit/freqshift (DN2): its page and knobs, and the sound: the effect's manifest default is a send, the image has no send cells yet and the effect runs on the master (route word 0, SEND_SLOTS limit 0); the sine moves by the shift of the routine's mapping, up and down, with the image 40 dB down; MIX 0 is the dry PCM; the values are saved with the kit.
[scenario]
name = "fx-freqshift-dn2"
kind = "fxshift"
devices = ["dn2"]
tier = "quick"

[fxshift]
module = "digikit/freqshift"
hint = 5            # the sine's position in the machine list on the Digitone II
trig_frame = 7000
