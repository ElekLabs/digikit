# The frequency shifter digikit/freqshift (DT2): its page and knobs, and the sound on the master route (stored `master`; the manifest says send): the sine moves by the shift of the routine's mapping, up and down, with the image 40 dB down; MIX 0 is the dry PCM; the values are saved with the kit. And the send route (the manifest's default, docs/findings/66-freqshift-send.md): a send amount on track 1 gives a return of amount^2 x MIX x the shifted track, equal to the float model; an amount on another track adds nothing.
[scenario]
name = "fx-freqshift-dt2"
kind = "fxshift"
devices = ["dt2"]
tier = "quick"

[fxshift]
module = "digikit/freqshift"
hint = 7            # the sine's position in the machine list (the same as fx-pages-dt2)
trig_frame = 7500
