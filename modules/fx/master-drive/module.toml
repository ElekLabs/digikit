[module]
id = "fx/master-drive"
version = "0.1.0"
name = "Master drive"
category = "fx"
status = "experimental"
summary = "Soft-clip saturation on the master output, on one knob."
requires = []
conflicts = ["fx/master-gain"]

# Test status per firmware; patchkit does not read it.
[targets]
# refused-by-encoding-gate: patchkit refuses the image (docs/findings/20-patch-toolchains.md, "Modules the
# encoding gate refuses"); build it only with --no-encoding-gate, as a diagnostic.
"dt2-1.16" = "untested"
"dt2-1.17" = "refused-by-encoding-gate"
"dn2-1.11" = "untested"
"dn2-1.12" = "refused-by-encoding-gate"

# DSP: the master hook (the Q31 converter's one call) and the routine.
[[object]]
path = "build/master-drive.dko.json"
sources = ["src/dsp/master_drive.s"]
place = "dsp.l2"

[object.externs]
_fw_q31_convert = "dsp.master.q31_converter"
_fw_master_buf = "dsp.master.float_buf"
_fw_drive_word = "dsp.fx.sidechain_filter_word"

# ColdFire: the new knob label.
[[object]]
path = "build/strings.dko.json"
sources = ["src/cf/strings.c"]
place = "cf.expansion"

[[op]]
op = "retarget"
anchor = "dsp.master.q31_call"
to = "_md_hook"

# Descriptor row of the master compressor's Sidechain Filter: long and short names. The default stays 0x5000: the
# factory kits hold it, so it is the neutral value of the drive (finding 22).
[[op]]
op = "write"
anchor = "cf.param.master_sidechain_filter"
offset = 0x28
hex = "00000000"
reloc = [{ offset = 0, type = "cf.32", symbol = "md_name_long" }]

[[op]]
op = "write"
anchor = "cf.param.master_sidechain_filter"
offset = 0x30
hex = "00000000"
reloc = [{ offset = 0, type = "cf.32", symbol = "md_name_short" }]

# Resources: the master hook (also claimed by fx/master-gain), the Sidechain Filter frame word, and its descriptor row.
[[claim]]
resource = "dsp.master.hook"

[[claim]]
resource = "frame.fx66"

[[claim]]
resource = "cf.param.master_sidechain_filter"

# Anchors. The hook anchors are the ones of fx/master-gain (same rules, same device-independent hashes).
[[anchor_rule]]
name = "dsp.master.q31_call"
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "65c7ebdfe23c9a760bc6077a912e16c0474c182ee9849925cb0c10af0689f984"
offset = 0x15c
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.master.q31_converter"
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "83fba5710c2b395cbd54e3cd583b1e205915fa6d1905d7285c3535203e52d05b"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.master.float_buf"
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "83fba5710c2b395cbd54e3cd583b1e205915fa6d1905d7285c3535203e52d05b"
offset = 0xf
mark = "D"

# The Sidechain Filter word (fx[66]) in the DSP's copy of the frame: the address in the stock reader's short-word load
# (DT2 0x256008, DN2 0x25ced8; finding 04). The reading function differs per device.
[[anchor_rule]]
name = "dsp.fx.sidechain_filter_word"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_mem_addr"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x459
mark = "D"

[[anchor_rule]]
name = "dsp.fx.sidechain_filter_word"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_mem_addr"
reloc_hash = "4cc8a46bca990a7bd883d1784307a9cd72aa828a1ae846977e337fbc5c54c010"
offset = 0x87d
mark = "D"

# The descriptor row (60 bytes) of that parameter: mirror index 66, range 0..0x7f00, default 0x5000.
[[anchor_rule]]
name = "cf.param.master_sidechain_filter"
cpu = "cf"
kind = "cf_words"
words = ["*", 66, 0, 0x7f00, 0x5000, 0, 0x75ffff, 0x116, "*", 0, "*", "*", "*", "*", "*"]
mark = "D"
