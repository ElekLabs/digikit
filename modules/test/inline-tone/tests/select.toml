# ITONE is the 8th entry of the machine list; YES commits type 10 (the track object, byte 0x4265338e), a trig on
# track 1 brings the type to the DSP (its type cache, DM 0x255970, holds 10) and nothing faults.
# The sine needs one of the routine modules (test/inline-tone-48k or -96k); their tests check that it sounds.

[test]
name = "select_itone"
devices = ["dt2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 200
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "YES"
[[step]]
wait_ms = 0x12c
[[step]]
expect_mem = { addr = 0x4265338c, mask = 0xff00, eq = 0xa00 }
[[step]]
tap = "YES"
[[step]]
wait_ms = 0x12c
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 0x1f4
[[step]]
expect_dsp = { addr = 0x255970, hex = "0a" }
[[step]]
expect_no_fault = true
