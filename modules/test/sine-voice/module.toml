[module]
id = "test/sine-voice"
version = "0.1.0"
name = "Sine voice"
category = "test"
status = "experimental"
summary = "Test machine type: a pitched sine rendered by the per-voice hook, to prove that a new type runs through the engine's amp envelope, filter and FX"
ports = ["dt2-1.16", "dt2-1.17"]
requires = ["core/dsp-voice"]
conflicts = []

[targets]
# refused-by-encoding-gate: patchkit refuses the image (docs/findings/20-patch-toolchains.md, "Modules the
# encoding gate refuses"); build it only with --no-encoding-gate, as a diagnostic.
"dt2-1.16" = "untested"
"dt2-1.17" = "refused-by-encoding-gate"
"dn2-1.11" = "untested"
"dn2-1.12" = "untested"

[[object]]
path = "build/sine-voice-dsp.dko.json"
sources = ["src/dsp/sine_voice.s"]
place = "dsp.l2"
devices = ["dt2"]

# The machine type this routine renders: a literal (8, a type whose stock selector entry is not a sample selector,
# findings 06) because this module adds no machine.
[[entry]]
registry = "voices"
id = "sine"
type = "8"
pc = "_sv_render"
devices = ["dt2"]

[[claim]]
resource = "machine.type.8"
