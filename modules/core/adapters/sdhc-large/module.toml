[module]
id = "core/sdhc-large"
version = "0.1.0"
name = "Large card commands"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Lets the firmware's eMMC block write and read run one card command of up to 511 KiB instead of 64 KiB pieces, for buffers that a caller registers: sdhc_large_range, sdhc_large_ctl"
requires = ["core/runtime"]
conflicts = []
ports = ["dt2-1.17", "dn2-1.12"]

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The firmware's eSDHC block write and read (the same code on both devices) cut every transfer into 64 KiB commands: `cmpi.l #0x10000,D2` at the entry test and
# in the chunk loop of each. The four hooks replace those compares with a limit of 1022 blocks for a transfer that lies inside the range a caller registered
# (sdhc_large_range) and is 16-byte aligned with a length that is a multiple of 512, while the switch (sdhc_large_ctl key 0, on at every boot, never persisted)
# is on. Every other transfer keeps the 64 KiB limit: the code path is the stock one. The runtime's store writer and core/plusdrive-write register their data
# and readback buffers around their card transfers (optional symbols: 0 without this module). Details: sdhc.s.
[[object]]
path = "build/sdhc-large.dko.json"
sources = ["src/cf/sdhc.s", "src/cf/sdhc.c"]
place = "cf.expansion"

[object.externs]
sl_wr_entry = "cf.storage.site.block_write.clamp_entry"
sl_wr_chunk = "cf.storage.site.block_write.clamp_chunk"
sl_rd_entry = "cf.storage.site.block_read.clamp_entry"
sl_rd_chunk = "cf.storage.site.block_read.clamp_chunk"

[[op]]
op = "hook"
hook = "cf.storage.hook.block_write.clamp_entry"
to = "sdhc_large_entry_w"

[[op]]
op = "hook"
hook = "cf.storage.hook.block_write.clamp_chunk"
to = "sdhc_large_chunk_w"

[[op]]
op = "hook"
hook = "cf.storage.hook.block_read.clamp_entry"
to = "sdhc_large_entry_r"

[[op]]
op = "hook"
hook = "cf.storage.hook.block_read.clamp_chunk"
to = "sdhc_large_chunk_r"

[[claim]]
resource = "cf.storage.site.block_write.clamp_entry"

[[claim]]
resource = "cf.storage.site.block_write.clamp_chunk"

[[claim]]
resource = "cf.storage.site.block_read.clamp_entry"

[[claim]]
resource = "cf.storage.site.block_read.clamp_chunk"
