[module]
id = "core/lfo"
version = "0.1.0"
name = "LFO shapes"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "The image half of the lfo service: twelve pointer-slot stubs (six for each device) at the sites where the LFO tick and its second reader treat a wave value above RAND; stock behaviour and stock cost for waves 0 to 5 while no slot is filled"
ports = ["dt2-1.17", "dn2-1.12"]
requires = ["core/runtime"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The LFO tick (vector 191, 1,500 Hz, 48 LFOs per call) clamps the wave byte to 0..6 and calls a function table for 0..5; 6 is RAND (finding 149). Each site below is the
# six-byte `moveq 6,Dn; cmp.l D3,Dn; beq|bne` that compares the clamped wave with 6. An `op = "stub"` with `when` puts a jump there to a generated stub that runs the moveq, the compare
# and the stock branch as stock, and looks at its pointer slot only on the outcome "clamped wave is 6" (`when = "taken"` for a beq, `"fallthrough"` for a bne). A zero slot continues the stock
# path of that outcome, so without the lfo service (or in safe mode) the image behaves as stock, and a wave of 0 to 5 costs the stock instructions and two `jmp`s (the site jump and the jump back). The lfo service fills the
# slots with routines (modules/core/services/lfo/dks) that read the raw wave byte again and call the shape table for a value of 7 to 14; any other value takes the stock RAND path. The routines
# run in the interrupt: they wait for nothing and call only the table lookup.
# `scratch` is the register the slot test overwrites: dead where the "clamped wave is 6" outcome continues, found from the stock bytes (devices/fw/lfo.toml, tools/coldfire/liveness.py).
# The same six sites exist on both devices (the rules are in devices/fw/lfo.toml); each device has its own six slots, because a service file may fill a slot name once. The image stub of the slot comes with the module `core/lfo`, E8 of
# docs/plans/extension-model.md moves it into services/lfo/image/.
[[slot]]
name = "lfo_dt2_tick_call"
devices = ["dt2"]

[[slot]]
name = "lfo_dt2_tick_slew"
devices = ["dt2"]

[[slot]]
name = "lfo_dt2_tick_start"
devices = ["dt2"]

[[slot]]
name = "lfo_dt2_read_call"
devices = ["dt2"]

[[slot]]
name = "lfo_dt2_read_slew"
devices = ["dt2"]

[[slot]]
name = "lfo_dt2_read_start"
devices = ["dt2"]

[[slot]]
name = "lfo_dn2_tick_call"
devices = ["dn2"]

[[slot]]
name = "lfo_dn2_tick_slew"
devices = ["dn2"]

[[slot]]
name = "lfo_dn2_tick_start"
devices = ["dn2"]

[[slot]]
name = "lfo_dn2_read_call"
devices = ["dn2"]

[[slot]]
name = "lfo_dn2_read_slew"
devices = ["dn2"]

[[slot]]
name = "lfo_dn2_read_start"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_call"
slot = "lfo_dt2_tick_call"
scratch = "d0"
when = "taken"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_slew"
slot = "lfo_dt2_tick_slew"
scratch = "d2"
when = "fallthrough"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_start"
slot = "lfo_dt2_tick_start"
scratch = "d2"
when = "taken"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_call"
slot = "lfo_dt2_read_call"
scratch = "d0"
when = "taken"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_slew"
slot = "lfo_dt2_read_slew"
scratch = "d2"
when = "fallthrough"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_start"
slot = "lfo_dt2_read_start"
scratch = "d2"
when = "taken"
devices = ["dt2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_call"
slot = "lfo_dn2_tick_call"
scratch = "d0"
when = "taken"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_slew"
slot = "lfo_dn2_tick_slew"
scratch = "d1"
when = "fallthrough"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.tick_start"
slot = "lfo_dn2_tick_start"
scratch = "d2"
when = "taken"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_call"
slot = "lfo_dn2_read_call"
scratch = "d0"
when = "taken"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_slew"
slot = "lfo_dn2_read_slew"
scratch = "d2"
when = "fallthrough"
devices = ["dn2"]

[[op]]
op = "stub"
hook = "cf.lfo.hook.read_start"
slot = "lfo_dn2_read_start"
scratch = "d2"
when = "taken"
devices = ["dn2"]

[[claim]]
resource = "cf.lfo.site.tick_call"

[[claim]]
resource = "cf.lfo.site.tick_slew"

[[claim]]
resource = "cf.lfo.site.tick_start"

[[claim]]
resource = "cf.lfo.site.read_call"

[[claim]]
resource = "cf.lfo.site.read_slew"

[[claim]]
resource = "cf.lfo.site.read_start"
