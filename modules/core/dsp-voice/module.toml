[module]
id = "core/dsp-voice"
version = "0.1.0"
name = "DSP voice hook"
category = "core"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Per-voice render hook of the SHARC engine: machine types registered by other modules render with their own DSP routine, every other type renders as stock"
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.11", "dn2-1.12"]
requires = []
conflicts = []

# Test status per firmware; patchkit does not read it.
[targets]
"dt2-1.16" = "untested"
"dt2-1.17" = "experimental"
"dn2-1.11" = "untested"
"dn2-1.12" = "experimental"

[[object]]
path = "build/dsp-voice-dsp.dko.json"
sources = ["src/dsp/dsp-voice.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_dv_table = "voices.rows"
_fw_type_cache = "dsp.voice.type_cache"
_fw_render_next = "dsp.voice.render_next"
_fw_frame = "dsp.voice.frame_base"
_fw_vparams = "dsp.voice.params"
_fw_unpack = "dsp.voice.unpack"

# Digitone II: the render hook of the FM engine's host (docs/findings/06, "Per-voice hook on DN2"); another object, the
# same registration table and claim.
[[object]]
path = "build/dsp-voice-dn2-dsp.dko.json"
sources = ["src/dsp/dsp-voice-dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[object.externs]
_dv_table = "voices.rows"
_fw_frame = "dsp.voice.frame_base"
_fw_render_next = "dsp.voice.render_next"

# The machine adapter's device facts (`[adapter.machine]` of the device files; docs/design/module-sdk.md 5.2) as ADM_* defines, written by `patchkit gen`.
[[gen]]
kind = "sharc-adapter"
path = "build/gen/adapter-{dev}.inc"

# The first instruction of the render entry becomes `JUMP _dv_entry`; the wrapper executes the displaced instruction.
[[op]]
op = "hook"
cpu = "sharc"
anchor = "dsp.voice.render_entry"
offset = 0
to = "_dv_entry"
displaced = "drop"
devices = ["dt2", "dn2"]

# The block driver FUN_1c2b24's two calls of the per-voice frame unpack FUN_1c24e9 (voices 2t and 2t + 1) go to _dv_unpack,
# which gives the tracks of a row with `lev` a fixed level before the stock unpack.
[[op]]
op = "retarget"
anchor = "dsp.voice.unpack.a"
to = "_dv_unpack"
devices = ["dt2"]

[[op]]
op = "retarget"
anchor = "dsp.voice.unpack.b"
to = "_dv_unpack"
devices = ["dt2"]

# Machine modules add rows {type, routine pc} with `[[entry]] registry = "voices"`:
#
#     [[entry]]
#     registry = "voices"
#     id = "pluck"
#     type = "machines.pluck.index"    # the machine type (a number, or the index of a machines entry)
#     pc = "_pk_render"                # the routine's symbol in the module's DSP object
#
# The scan ends at the zero row patchkit appends (terminator); at most 16 types.
[[registry]]
name = "voices"
first = "0"
max = 16
region = "dsp.l2"
terminator = true

# A row is 24 words (core/dsp-link's window 1 and the DSP scan count in rows of this size):
#   0 type, 1 pc, 2 to 9 the declared range of machine knob 0 to 7 (min | max << 16, from the machine's [[param]]; 0: undeclared, the
#   guard clamps to 0 .. 0x7f00), 10 the type this row's faults disabled, 11 the block of the fault window's start, 12 faults in the
#   window, 13 faults since the start, 14 and 15 spare, 16 to 23 the contract words (note_on, state_base, stride, clear, gen, level,
#   stereo, lev; below). The ranges come from the typed `[[voice]]` of the machine module (patchkit
#   fills them), or from the voice record of a `.dkm`'s DSP section; the guard words are the DSP's.
[[registry.field]]
name = "type"
kind = "u32"
[[registry.field]]
name = "pc"
kind = "u32"
[[registry.field]]
name = "rng0"
kind = "u32"
default = 0
[[registry.field]]
name = "rng1"
kind = "u32"
default = 0
[[registry.field]]
name = "rng2"
kind = "u32"
default = 0
[[registry.field]]
name = "rng3"
kind = "u32"
default = 0
[[registry.field]]
name = "rng4"
kind = "u32"
default = 0
[[registry.field]]
name = "rng5"
kind = "u32"
default = 0
[[registry.field]]
name = "rng6"
kind = "u32"
default = 0
[[registry.field]]
name = "rng7"
kind = "u32"
default = 0
[[registry.field]]
name = "dis"
kind = "u32"
default = 0
[[registry.field]]
name = "wstart"
kind = "u32"
default = 0
[[registry.field]]
name = "wcount"
kind = "u32"
default = 0
[[registry.field]]
name = "nfault"
kind = "u32"
default = 0
[[registry.field]]
name = "spare0"
kind = "u32"
default = 0
[[registry.field]]
name = "spare1"
kind = "u32"
default = 0
# 16 note_on: the pc of the note_on routine, same form as pc (0: none)
[[registry.field]]
name = "note_on"
kind = "u32"
default = 0
# 17 state_base: the byte address of voice 0's state (what `R1 = _sym;` loads for a data symbol placed there)
[[registry.field]]
name = "state_base"
kind = "u32"
default = 0
# 18 stride: bytes between the states of two voices
[[registry.field]]
name = "stride"
kind = "u32"
default = 0
# 19 clear: bytes the adapter zeroes at note-on
[[registry.field]]
name = "clear"
kind = "u32"
default = 0
# 20 gen: generation counter (0 for now)
[[registry.field]]
name = "gen"
kind = "u32"
default = 0
# 21 level: log level (0 for now)
[[registry.field]]
name = "level"
kind = "u32"
default = 0
# 22 stereo: the render wrote the odd voice's block too (DT2: the even voice is the left channel, the odd the right); no copy
[[registry.field]]
name = "stereo"
kind = "u32"
default = 0
# 23 lev: the level word the voice chain reads in place of knob H on this type's tracks (_dv_unpack; DT2: 0x6400 is 100), so knob H
# carries a machine parameter; 0: knob H is the stock LEV
[[registry.field]]
name = "lev"
kind = "u32"
default = 0

[[claim]]
resource = "dsp.voice.hook"

[[anchor_rule]]
name = "dsp.voice.render_entry"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "830c02524f18d34629acb569a92d052d66f23c9ab260ac27ef8e4a9869c22fd2"
offset = 0x0
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.voice.render_next"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "830c02524f18d34629acb569a92d052d66f23c9ab260ac27ef8e4a9869c22fd2"
offset = 0x3
len = 6
mark = "D"

# The DSP's per-track machine type cache: the literal `I4 = 0x255970` in the per-track unpack.
[[anchor_rule]]
name = "dsp.voice.type_cache"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "d2c02a587786f9ee328897985095c271ff1c5b65f289224e435968ea4b5d3f00"
offset = 0x1e5
mark = "D"

[[anchor_rule]]
name = "dsp.voice.unpack.a"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x176
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.voice.unpack.b"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x185
len = 6
mark = "D"

[[anchor_rule]]
name = "dsp.voice.unpack"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "d2c02a587786f9ee328897985095c271ff1c5b65f289224e435968ea4b5d3f00"
offset = 0
len = 6
mark = "D"

# The per-voice parameter records the unpack writes (0xdc bytes per voice): the literal of `I5 = MODIFY(I4, 0x2506ec)`. Word 52 is
# the voice's pan (0 .. 1) that the mix stage reads; a stereo row's two voices are moved apart there (_dv_spread).
[[anchor_rule]]
name = "dsp.voice.params"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "d2c02a587786f9ee328897985095c271ff1c5b65f289224e435968ea4b5d3f00"
offset = 0xe1
mark = "D"

# The stock release latch: byte v is 1 from voice v's note-off to its next note-on (the release path stores 1, the trigger path 0;
# digikit-spacejam core/dsp-inline). Read by machines that follow the gate (tom/tb303 slide).
[[anchor_rule]]
name = "dsp.voice.release_latch"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "75588fd22204b80ad6a84264f64407bf3d19d78c73b0595d832a2b3d34f74b68"
offset = 0x140
add = 0x40
mark = "D"

# The DSP's copy of the ColdFire frame: the literal `I5 = 0x2558dc` of the per-block copy.
[[anchor_rule]]
name = "dsp.voice.frame_base"
devices = ["dt2"]
cpu = "sharc"
kind = "sharc_literal"
reloc_hash = "55a5d8458350a1b67249f5aca8d49a4692d9ab5886fd12d95c259479f83ce780"
offset = 0x14d
mark = "D"

# ---- Digitone II (FUN_b8251b: the helper the engine calls once per voice buffer after the FM synthesis, first
# instruction `I7 = MODIFY(I7, -18)`, 48 bits, displaced; the DSP's frame copy is the literal `I4 = 0x25c48c` of the
# per-block copy in FUN_1c2712).
[[anchor_rule]]
name = "dsp.voice.render_entry"
devices = ["dn2"]
cpu = "sharc"
kind = "sharc_func"
reloc_hash = "7cb2e56b587600a04d8d3876f254fa6fc326af68e6d6e8c7741517e316640dec"
