[package]
name = "dkrt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
dkrt-sdk = { path = "../../sdk" }
dkrt-abi = { path = "../../abi" }
dkrt-fit = { path = "../../fit" }
dkneeds = { path = "../../../../../packages/dkneeds" }
dkfw = { path = "../../../fw/rs" }

# This crate sits inside the repository's cargo workspace but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
