# The platform contract: what the core expects of the platform under it (docs/plans/runtime-and-services.md, "Platform adapter"). One table,
# two checkers:
#   host    the `FakePlatform` host test of the runtime crate (`src/rs/src/fake_platform.rs`) that checks the rule on the model
#   device  the check of `platform-contract.device.test.ts` that runs the rule against the real platform on each device
# A row that has no checker on one side says why (`host_pending`, `device_pending`). The numbers here are the contract's own; every number
# that a device file owns (id, name, where the samples live, the sample path limit) is read from the device file, not written here.

[[check]]
id = "identity"
what = "the device id and name that the platform reports equal the device file's, and so do its capabilities (where the samples live, the sample path limit)"
host = "every_profile_is_complete_and_distinct"
device = "identity"

[[check]]
id = "blocks"
what = "the block counter advances at about 1500 per emulated second and wraps cleanly"
blocks_per_second = 1500
tolerance_percent = 10
host = "the_block_clock_wraps_and_reports_none_without_a_counter"
device = "blocks"

[[check]]
id = "sector_read"
what = "a known sector reads back (store header A of a card that has a store)"
host_pending = "the fake's card holds what the test puts there; there is nothing platform-specific to model"
device = "sector_read"

[[check]]
id = "card_write_gate"
what = "writes outside the store and on a foreign card are refused, and never reach the card"
host = "a_foreign_card_is_read_only_for_every_write"
device = "card_write_gate"

[[check]]
id = "midi_out"
what = "MIDI output appears on the USB port and the TX backlog drains"
port = 2
host = "a_reply_goes_to_the_usb_port_as_one_sysex_message_and_is_dropped_without_room"
device = "midi_out"

[[check]]
id = "irq_roundtrip"
what = "masking interrupts returns the old state, and restoring it brings the old state back, nested"
host = "interrupt_masks_nest_and_restore_the_caller_state"
device = "irq_roundtrip"

[[check]]
id = "flush_exec"
what = "after a flush, fresh code at the flushed range executes"
host_pending = "the fake has no caches: it can only record the call"
device_pending = "needs a code word written to RAM and run: the runtime has no entry for it; the soft-reset and module-load tests cover the flush in use"

[[check]]
id = "anchors"
what = "every anchor the runtime links resolves, or its adapter is deliberately absent (an optional provider reports present() false)"
host = "the_optional_providers_are_absent_until_the_image_has_them"
device = "anchors"

[[check]]
id = "info_tables"
what = "every *_info table that is present has its magic and the version the runtime reads"
host = "the_info_tables_are_bytes_the_fake_hands_out"
device = "info_tables"
