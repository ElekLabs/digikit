[module]
id = "core/services/machines"
version = "0.8.2"
name = "machines service"
category = "core"
role = "service"
service = "machines"
type = "raw"
author = "digikit"
status = "experimental"
summary = "The machines service of the runtime as a service file: machine types, parameters, pages, page clicks and native pages; it owns their record kinds, exports dk_param_get, dk_param_set and the builder calls of the machines and takes the hooks of the machine framework"
requires = ["core/machines"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The functions the file exports: each is an [[import]] of its service in sdk/sdk.toml.
[[export]]
name = "dk_param_get"

[[export]]
name = "dk_param_set"

[[export]]
name = "dk_module_ctx_add_machine"

[[export]]
name = "dk_machine_add_page"

[[export]]
name = "dk_page_add_param"

[[export]]
name = "dk_param_range"

[[export]]
name = "dk_param_glyph"

[[export]]
name = "dk_param_latched"

[[export]]
name = "dk_param_on_click"

[[export]]
name = "dk_page_canvas"

[[export]]
name = "dk_page_bind"

[[export]]
name = "dk_page_bind_local"

# The hooks it takes (devices/fw/machine.toml and page.toml), for each device that has them. They have no `handler`: each is a routine of this file that runs in place of the
# stock instructions at the site and continues in the stock code through the table `machines_info` of core/machines (`patchkit bind` makes the site jump straight to the entry).
# `init` declares the hooks of its device again with dk_service_declare_hook.

[[hook]]
name = "cf.machine.hook.clone.5"
entry = "mf_clone5"
devices = ["dt2"]

[[hook]]
name = "cf.machine.hook.param_code.args"
entry = "mf_typearg"
devices = ["dt2"]

[[hook]]
name = "cf.machine.hook.srcpage"
entry = "mf_srcpage"
devices = ["dt2"]

[[hook]]
name = "cf.page.hook.source_draw"
entry = "mf_draw_hook"

[[hook]]
name = "cf.page.hook.source_code"
entry = "mf_code_hook"

[[hook]]
name = "cf.page.hook.source_key"
entry = "mf_key_hook"

[[hook]]
name = "cf.page.hook.source_turn"
entry = "mf_turn_hook"

[[hook]]
name = "cf.machine.hook.group"
entry = "mf_group"
devices = ["dn2"]

[[hook]]
name = "cf.machine.hook.type_page.count"
entry = "mf_typemap0"
devices = ["dn2"]

[[hook]]
name = "cf.machine.hook.type_page.desc"
entry = "mf_typemap1"
devices = ["dn2"]

[[hook]]
name = "cf.machine.hook.param_code.map"
entry = "mf_typemap2"
devices = ["dn2"]

[[hook]]
name = "cf.machine.hook.type_reader.load"
entry = "mf_reader"
devices = ["dn2"]

[[hook]]
name = "cf.machine.hook.owner_type_load"
entry = "mf_owner"
devices = ["dn2"]

# The pointer slot of the interrupt site of the Digitone II (the frame builder's machine type): the image stub loads it, and a loaded file fills it with the address of its routine.
[[fill]]
slot = "frametype"
entry = "mf_frametype"
devices = ["dn2"]

# Rust and assembler (the assembler is in `src/hooks.rs`), built with rustc_codegen_gcc for -mcpu=54418 (`patchkit build`). Packed as a .dks (`patchkit pack core/services/machines`): the file is `machines.dks`.
[[object]]
path = "build/machines.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"

# The firmware names of the assembler files, as aliases (`patchkit pack` makes the imports `patchkit bind` resolves: docs/PATCHING.md "Firmware references"). The hooks leave
# only by `jmp` to these: `exit.<n>` is the exit n of the hook in `devices/fw` (`exit` alone: the end of the site), `ret` is an `rts`, `stock` the stock path called from the hook.
[object.externs]
mf_stock_draw = "hook.cf.page.hook.source_draw.stock"
mf_ret_draw = "hook.cf.page.hook.source_draw.ret"
mf_ret_code = "hook.cf.page.hook.source_code.ret"
mf_ret_turn = "hook.cf.page.hook.source_turn.ret"
mf_x_c5_ne = "hook.cf.machine.hook.clone.5.exit.1"
mf_x_c5_eq = "hook.cf.machine.hook.clone.5.exit.2"
mf_x_typearg = "hook.cf.machine.hook.param_code.args.exit.1"
mf_x_sp_stock = "hook.cf.machine.hook.srcpage.exit.1"
mf_x_sp_alt = "hook.cf.machine.hook.srcpage.exit.2"
mf_spt = "cf.machine.fn.current_track_type"
mf_x_g_next = "hook.cf.machine.hook.group.exit"
mf_x_g_taken = "hook.cf.machine.hook.group.exit.1"
mf_ret_tm0 = "hook.cf.machine.hook.type_page.count.ret"
mf_ret_tm1 = "hook.cf.machine.hook.type_page.desc.ret"
mf_ret_tm2 = "hook.cf.machine.hook.param_code.map.ret"
mf_x_ft = "hook.cf.machine.hook.frametype.exit"
mf_x_rd = "hook.cf.machine.hook.type_reader.load.exit.1"
mf_x_ow = "hook.cf.machine.hook.owner_type_load.exit"
mf_rc0 = "cf.machine.site.type_reader.call.0"
mf_rc1 = "cf.machine.site.type_reader.call.1"
mf_rc2 = "cf.machine.site.type_reader.call.2"
mf_rc3 = "cf.machine.site.type_reader.call.3"
mf_rc4 = "cf.machine.site.type_reader.call.4"
mf_rc5 = "cf.machine.site.type_reader.call.5"
mf_rc6 = "cf.machine.site.type_reader.call.6"
mf_rc7 = "cf.machine.site.type_reader.call.7"
mf_rc8 = "cf.machine.site.type_reader.call.8"
