[module]
id = "core/services/lfo"
version = "0.8.2"
name = "lfo service"
category = "core"
role = "service"
service = "lfo"
type = "raw"
author = "digikit"
status = "experimental"
summary = "The lfo service of the runtime as a service file: it owns the lfo_shape record kind, numbers the shapes as values of the LFO wave parameter and fills the interrupt slots of core/lfo"
requires = ["core/lfo"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The pointer slots of core/lfo (`[[slot]]` of its module.toml): each interrupt site calls its slot only when it is set; the file writes the address of its routine.
[[fill]]
slot = "lfo_dt2_tick_call"
entry = "lfo_dt2_tick_call"
devices = ["dt2"]

[[fill]]
slot = "lfo_dt2_tick_slew"
entry = "lfo_dt2_tick_slew"
devices = ["dt2"]

[[fill]]
slot = "lfo_dt2_tick_start"
entry = "lfo_dt2_tick_start"
devices = ["dt2"]

[[fill]]
slot = "lfo_dt2_read_call"
entry = "lfo_dt2_read_call"
devices = ["dt2"]

[[fill]]
slot = "lfo_dt2_read_slew"
entry = "lfo_dt2_read_slew"
devices = ["dt2"]

[[fill]]
slot = "lfo_dt2_read_start"
entry = "lfo_dt2_read_start"
devices = ["dt2"]

[[fill]]
slot = "lfo_dn2_tick_call"
entry = "lfo_dn2_tick_call"
devices = ["dn2"]

[[fill]]
slot = "lfo_dn2_tick_slew"
entry = "lfo_dn2_tick_slew"
devices = ["dn2"]

[[fill]]
slot = "lfo_dn2_tick_start"
entry = "lfo_dn2_tick_start"
devices = ["dn2"]

[[fill]]
slot = "lfo_dn2_read_call"
entry = "lfo_dn2_read_call"
devices = ["dn2"]

[[fill]]
slot = "lfo_dn2_read_slew"
entry = "lfo_dn2_read_slew"
devices = ["dn2"]

[[fill]]
slot = "lfo_dn2_read_start"
entry = "lfo_dn2_read_start"
devices = ["dn2"]

# Rust and assembler (`src/hooks-*.s`), built with rustc_codegen_gcc for -mcpu=54418 (`patchkit build`). Packed as a .dks (`patchkit pack core/services/lfo`): the file is `lfo.dks`.
[[object]]
path = "build/lfo.dko.json"
sources = ["Cargo.toml"]
place = "cf.expansion"

# The exits of the hooks of devices/fw/lfo.toml (`hook.<hook>.exit` is the end of the site, `.exit.N` the Nth entry of its `exits`), as aliases `patchkit pack` makes into imports.
[object.externs]
lfo_x_tick_rand = "hook.cf.lfo.hook.tick_call.exit.1"
lfo_x_tick_done = "hook.cf.lfo.hook.tick_call.exit.2"
lfo_x_tick_slew = "hook.cf.lfo.hook.tick_slew.exit"
lfo_x_tick_start = "hook.cf.lfo.hook.tick_start.exit"
lfo_x_tick_start_rand = "hook.cf.lfo.hook.tick_start.exit.1"
lfo_x_read_rand = "hook.cf.lfo.hook.read_call.exit.1"
lfo_x_read_done = "hook.cf.lfo.hook.read_call.exit.2"
lfo_x_read_slew = "hook.cf.lfo.hook.read_slew.exit"
lfo_x_read_start = "hook.cf.lfo.hook.read_start.exit"
lfo_x_read_start_rand = "hook.cf.lfo.hook.read_start.exit.1"
