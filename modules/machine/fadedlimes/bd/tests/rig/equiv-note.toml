# bd (fadedlimes/bd): the note pin on the SHARC-only rig. It replaces the PCM pin of tests/equiv.device.test.ts (that file's note, retired after the R12-6 gate and review).
# Each case plays note 60, velocity 100, every parameter at its manifest default, for 375 blocks (0.25 s, as long as the device pin) in a friendly context,
# and runs twice with all module state filled differently (NaN words, then a seeded integer pattern) and fails when the outputs differ (the output does not depend on the initial state), and pins the numeric fingerprint of the machine's float32 output words (tests/rig/fingerprint, with tolerances: docs/TESTING.md "PCM pins"; the sha256 line stays as the record of the last pin and gates only a case with `exact = true`) (375 blocks of 32 samples). The device pin hashed the same note through the whole firmware
# path (track filter, mixer, output); this pin sees only the machine's own DSP. One case per device: the sha256 differs per device.
# The pins are written by the rig, never by hand: DIGI_RIG_PIN=1 pnpm exec vitest run --config vitest.host.config.ts --project module-rig modules/machine/fadedlimes/bd/tests/
# PENDING (bd DT2): build/gen/gallery.json lacks dt2, so the DT2 case below fails loudly (the rig refuses to run it with no parameters) and its sha256 is not a pin.
# Re-pin after `mise run module:check fadedlimes/bd` regenerates the gallery (DIGI_RIG_PIN=1 as above). The DN2 pin is valid.
# A changed pin is a re-pin and needs Em's review (docs/plans/ledgers/t2-machine-rig-refs.md).

[[case]]
name = "note 60 at the default parameters is pinned: dt2"
device = ["dt2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
blocks = 375

[[case.check]]
kind = "same-as"
sha256 = "33b995d8bb64e05ba0f014ae969a4b959c1c101712ca25bf3b006f8c256632fb"

[[case.check]]
kind = "peak"
min = 0.01

[[case.check]]
kind = "no-clip"

[[case]]
name = "note 60 at the default parameters is pinned: dn2"
device = ["dn2"]
context = "friendly"

[[case.step]]
note = 60
vel = 100
blocks = 375

[[case.check]]
kind = "same-as"
sha256 = "53b22b3a46fc2cef2588813985d6f69dff64410dc60f9141f019b3d104f79e39"

[[case.check]]
kind = "peak"
min = 0.01

[[case.check]]
kind = "no-clip"
