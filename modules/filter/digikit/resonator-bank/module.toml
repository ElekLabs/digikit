[module]
id = "digikit/resonator-bank"
version = "0.1.0"
name = "Resonator Bank"
category = "filters"
type = "service"
author = "digikit"
status = "experimental"
summary = "Eight resonant bandpass filters with adjustable spacing and resonance."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

[[filter]]
id = "rbnk"

# One FILTER_V2 record with the graph callback (196 bytes) plus the 16-byte header.
[uses.dt2]
param_rows = 2
record_bytes = 212
machine_rows = 0
page_rows = 0

[uses.dn2]
param_rows = 2
record_bytes = 212
machine_rows = 0
page_rows = 0

[[object]]
path = "build/resonator-bank-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/resonator-bank-dsp.dko.json"
sources = ["src/dsp/resonator_bank.s"]
place = "dsp.l2"
devices = ["dt2", "dn2"]
