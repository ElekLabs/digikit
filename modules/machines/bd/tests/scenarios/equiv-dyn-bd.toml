# fadedlimes/bd loaded at boot as a run-time machine: voice row claimed, the note plays. The module has no patched-in twin any more, so the PCM
# of a note (from its onset, DT2 1.17 and DN2 1.12) is pinned by SHA-256. "record" fails and prints the hash.
# Before the twin was removed, the DT2 note equalled the patched-in machine's (finding 76).
[scenario]
name = "equiv-dyn-bd"
kind = "equiv"
devices = ["dt2", "dn2"]
tier = "quick"

[equiv]
modules = ["fadedlimes/bd"]
play = "bd"
play_module = "fadedlimes/bd"
play_machine = "bd"
hint = 7
voices = 1
ignore_run_machines = ["Bass Drum"]
pcm_sha256 = "2cb0259aeb2626862b0b5fdbc4e3073ea5c3a33698dfaf20afcf730d027ebb0d"   # onset 258, 24000 samples (DT2 1.17, note 60); approved by Em 2026-10-29


[equiv.dn2]
pcm_sha256 = "3da404b56faf9b7a38b4fc50470de7496ef8e32ce0b6832dd84a31562b2725f7"   # onset 206, 24000 samples (DN2 1.12, note 60)
hint = 4
hint_run = 5    # the run-time machine follows MIDI
trig_frame = 7000
