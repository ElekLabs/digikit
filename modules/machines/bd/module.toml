[module]
id = "fadedlimes/bd"
version = "0.1.0"
name = "Bass Drum"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "An FM bass drum: a decaying modulator index turns a clang into a sine, over a carrier that punches down."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The machine declaration (DK_MACHINE and DK_PARAM in src/module.c). It holds only .dk.desc records.
[[object]]
path = "build/bd-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/bd-dsp.dko.json"
sources = ["src/dsp/bd.s"]
place = "dsp.l2"
