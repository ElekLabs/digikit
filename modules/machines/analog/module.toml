[module]
id = "fadedlimes/analog"
version = "0.1.0"
name = "Analog"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "A subtractive voice: two detuned saws, a wave morph, a sub and a wave folder, shaped by the track filter."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The machine declaration (DK_MACHINE and DK_PARAM in src/module.c). It holds only .dk.desc records.
[[object]]
path = "build/analog-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/analog-dsp.dko.json"
sources = ["src/dsp/analog.s"]
place = "dsp.l2"
