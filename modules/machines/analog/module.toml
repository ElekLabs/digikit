[module]
id = "fadedlimes/analog"
version = "0.1.0"
name = "Analog"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "A subtractive voice: two detuned saws, a wave morph, a sub and a wave folder, shaped by the track filter."
dynamic = false
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "unsupported"
"dn2-1.12" = "unsupported"

[[object]]
path = "build/analog-dsp.dko.json"
sources = ["src/dsp/analog.s"]
place = "dsp.l2"

[[voice]]
machine = "analog"
render = "_va_render"
note_on = "_va_note_on"
desc = "_va_desc"

# TUNE (0xca) and LEV (0xd1) rows; the machine's four knobs take the device list's first four positions: 1, 2, 4, 5.
[[machine]]
id = "analog"
name = "Analog"
short = "ANA"
clone_of = 0
knobs = [0xca, "analog_detune", "analog_wave", 0, "analog_sub", "analog_fold", 0, 0xd1]

[[param]]
id = "analog_detune"
name = "Detune"
short = "DET"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2800

[[param]]
id = "analog_wave"
name = "Wave"
short = "WAVE"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "analog_sub"
name = "Sub / Fold"
short = "SUB"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "analog_fold"
name = "Fold"
short = "FOLD"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000
