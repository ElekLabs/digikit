[module]
id = "fadedlimes/analog"
version = "0.1.0"
name = "Analog"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "A subtractive voice: two detuned saws, a wave morph, a sub and a wave folder, shaped by the track filter."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The machine is declared by builder calls in init (src/module.c). The id `analog` is what the keys hash; the DSP symbols start with `va`.
# `[uses.<device>]` is written by `mise run module:check`.
[[machine]]
id = "analog"
dsp = "va"

[uses.dt2]
machine_rows = 1
param_rows = 4
page_rows = 0
record_bytes = 444

[uses.dn2]
machine_rows = 1
param_rows = 4
page_rows = 1
record_bytes = 540

[[object]]
path = "build/analog-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/analog-dsp.dko.json"
sources = ["src/dsp/analog.s"]
place = "dsp.l2"
