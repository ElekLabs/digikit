[module]
id = "tom/wtstack"
version = "0.1.0"
name = "WTStack"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "The track's sample as a Serum wavetable (2048-sample frames), played by up to four voices at set intervals, with detune and stereo spread."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-voice"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/tables.inc (included by wtstack.s) is generated by src/dsp/gen_tables.py: the constants and the pan table.
[[object]]
path = "build/wtstack-dsp.dko.json"
sources = ["src/dsp/wtstack.s"]
place = "dsp.l2"
devices = ["dt2"]

# the value texts of DTUN and the intervals
[[object]]
path = "build/wtstack-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[voice]]
machine = "wtstack"
render = "_ws_render"
note_on = "_ws_note_on"
desc = "_ws_desc"
stereo = true
lev = 0x6400

# SAMPLE's TUNE (0xca) first; knob D is SAMPLE's SAMP (0xcd): the slot (the wavetable). Knob H is the slot the stock level reads (LEV): SPRD takes
# it, and `lev` gives the track a fixed level of 100.
[[machine]]
id = "wtstack"
name = "ChordWT"
short = "WTS"
clone_of = 0
knobs = [0xca, "ws_wave", "ws_dtun", 0xcd, "ws_int2", "ws_int3", "ws_int4", "ws_sprd"]

[[param]]
id = "ws_wave"
name = "Wavetable Position"
short = "WAVE"
template = 0xd1
min = 0
max = 0x7f00
default = 0

# bipolar: 0x4000 is 0
[[param]]
id = "ws_dtun"
name = "Detune"
short = "DTUN"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "wtstack_bip_fmt"

# steps: 40 .. 63 are -24 .. -1 semitones, 64 (0x4000) OFF, 65 UNI (the note), 66 .. 89 +1 .. +24
[[param]]
id = "ws_int2"
name = "Voice 2 Interval"
short = "INT2"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "wtstack_int_fmt"

[[param]]
id = "ws_int3"
name = "Voice 3 Interval"
short = "INT3"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "wtstack_int_fmt"

[[param]]
id = "ws_int4"
name = "Voice 4 Interval"
short = "INT4"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "wtstack_int_fmt"

[[param]]
id = "ws_sprd"
name = "Stereo Spread"
short = "SPRD"
template = 0xd1
min = 0
max = 0x7f00
default = 0
