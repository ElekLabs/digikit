# WTStack's INT2 value texts: OFF at rest, +24 at the right end, -24 at the left end.

[test]
name = "int_text_wtstack"
devices = ["dt2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 200
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
expect_frame = "list"
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
expect_mem = { addr = 0x4265338c, mask = 0xff00, eq = 0x1700 }
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "SRC"
[[step]]
wait_ms = 300
[[step]]
expect_frame = "src_page"
[[step]]
turn = "ENC E"
by = 1
events = 120
[[step]]
wait_ms = 300
[[step]]
expect_frame = "int_max"
[[step]]
turn = "ENC E"
by = -1
events = 240
[[step]]
wait_ms = 300
[[step]]
expect_frame = "int_min"
[[step]]
expect_no_fault = true
