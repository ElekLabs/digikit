[module]
id = "machines/plaits"
version = "0.1.0"
name = "Plaits"
category = "machines"
status = "experimental"
summary = "Mutable Instruments Plaits as a Digitakt machine; this version has models 0 to 7 (VA to SPEECH)."
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The machine's type number is permanent: modules/core/machines/types.toml, key "machines/plaits:plaits"; it is
# exported as `machines.plaits.index`. A clone of MANUAL SLICE (as XSLICE and ITONE, the configuration that works on
# the owner's unit). The SRC page (docs/design/2026-10-17-plaits-machine-design.md, "Parameters and pages"):
#   A TUNE (MANUAL SLICE's row 0xf8)   B MODEL       C HARMONICS   D -- (MANUAL SLICE's sample slot, unused)
#   E TIMBRE                           F MORPH       G MIX         H LEV (MANUAL SLICE's row 0xfe)
# MODEL, HARMONICS, TIMBRE, MORPH and MIX are rows of this module (core/params), formatted as LEV (template 0xfe, an
# MSlice row: the owner the UI compares with the track's type mapped to its clone). Values are 0 .. 0x7f00 (UI
# 0 .. 127); MODEL is 0 .. 0x1700 (UI 0 .. 23, the permanent model numbers in Plaits' own order: 0 VA, 1 ASYM-TRI,
# 2 2FM, ...; docs/design/2026-10-17-plaits-machine-design.md and src/dsp/plaits.h).
#
# This module adds the machine and its rows only. The DSP routine (src/dsp/plaits_entry.s and the C sources) is built
# twice, by two modules that each register it with core/dsp-inline for this type and conflict with each other:
#   machines/plaits-48k   PLAITS_MODE 1: 32 samples at 48 kHz written to the voice's output (the default)
#   machines/plaits-96k   PLAITS_MODE 0: 64 samples at 96 kHz (half-band interpolated) into the work buffer
# Selected alone, the track plays as MANUAL SLICE.
#
# MODEL's value text is the model's name (`Model=ASYM-TRI` in the header): plaits_model_fmt (src/cf/model_fmt.s, in
# cf.expansion, no firmware calls) is MODEL's formatter through core/params' `formatter` field. The template stays
# 0xfe, so the knob slot draws LEV's fader (research-model-names.md).
[[object]]
path = "build/plaits-model-fmt.dko.json"
sources = ["src/cf/model_fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[entry]]
registry = "machines"
id = "plaits"
name = "Plaits"
short = "PLT"
clone_of = 6
f0 = 0xf8
f1 = "params.plaits_model.index"
f2 = "params.plaits_harm.index"
f3 = 0
f4 = "params.plaits_timbre.index"
f5 = "params.plaits_morph.index"
f6 = "params.plaits_mix.index"
f7 = 0xfe
f8 = 0x0a
devices = ["dt2"]

[[entry]]
registry = "params"
id = "plaits_model"
name = "Model"
short = "MODEL"
template = 0xfe
slot = 1
min = 0
max = 0x1700
default = 0
formatter = "plaits_model_fmt"
devices = ["dt2"]

[[entry]]
registry = "params"
id = "plaits_harm"
name = "Harmonics"
short = "HARM"
template = 0xfe
slot = 2
min = 0
max = 0x7f00
default = 0x4000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "plaits_timbre"
name = "Timbre"
short = "TIMB"
template = 0xfe
slot = 4
min = 0
max = 0x7f00
default = 0x4000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "plaits_morph"
name = "Morph"
short = "MORPH"
template = 0xfe
slot = 5
min = 0
max = 0x7f00
default = 0x4000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "plaits_mix"
name = "Mix"
short = "MIX"
template = 0xfe
slot = 6
min = 0
max = 0x7f00
default = 0
devices = ["dt2"]
