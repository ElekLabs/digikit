[module]
id = "tom/para"
version = "0.1.0"
name = "ParaWT"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "The track's sample as a Serum wavetable played paraphonically: each trig takes the next of four voices, with its own note, amp envelope (attack, held for the trig, decay), detune, stereo position and table offset."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-voice"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/tables.inc (included by para.s) is generated by src/dsp/gen_tables.py: the constants, the pan table and the envelope's
# attack steps and decay factors.
[[object]]
path = "build/para-dsp.dko.json"
sources = ["src/dsp/para.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fw_release_latch = "dsp.voice.release_latch"

# the value text of DTUN and JUMP
[[object]]
path = "build/para-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[voice]]
machine = "para"
render = "_pa_render"
note_on = "_pa_note_on"
desc = "_pa_desc"
state_zero = true
stereo = true
lev = 0x6400

# SAMPLE's TUNE (0xca) first; knob D is SAMPLE's SAMP (0xcd): the slot (the wavetable). Knob H is the slot the stock level reads (LEV): SPRD takes
# it, and `lev` gives the track a fixed level of 100.
[[machine]]
id = "para"
name = "ParaWT"
short = "PARA"
clone_of = 0
knobs = [0xca, "pa_wave", "pa_dtun", 0xcd, "pa_atk", "pa_dec", "pa_jump", "pa_sprd"]

[[param]]
id = "pa_wave"
name = "Wavetable Position"
short = "WAVE"
template = 0xd1
min = 0
max = 0x7f00
default = 0

# bipolar: 0x4000 is 0
[[param]]
id = "pa_dtun"
name = "Detune"
short = "DTUN"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "para_bip_fmt"

[[param]]
id = "pa_atk"
name = "Attack"
short = "ATK"
template = 0xd1
min = 0
max = 0x7f00
default = 0

[[param]]
id = "pa_dec"
name = "Decay"
short = "DEC"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

# bipolar: 0x4000 is 0 frames
[[param]]
id = "pa_jump"
name = "Wavetable Jump"
short = "JUMP"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "para_bip_fmt"

[[param]]
id = "pa_sprd"
name = "Stereo Spread"
short = "SPRD"
template = 0xd1
min = 0
max = 0x7f00
default = 0
