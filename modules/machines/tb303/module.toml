[module]
id = "tom/tb303"
version = "0.1.0"
name = "TB303"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "Open303: the 303 saw or square through its TB-303 filter, filter envelope, accent (velocity above 100, amount on knob H) and amp envelope; overlapping notes slide."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-voice"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/tables.inc (included by tb303.s) is generated by src/dsp/gen_tables.py: Open303's SAW303 and SQUARE303 levels (83 KB) and
# the routine's constants.
[[object]]
path = "build/tb303-dsp.dko.json"
sources = ["src/dsp/tb303.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fw_release_latch = "dsp.voice.release_latch"

# WAVE's value text: SAW or SQR
[[object]]
path = "build/tb303-wave-fmt.dko.json"
sources = ["src/cf/wave_fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[voice]]
machine = "tb303"
render = "_tb_render"
note_on = "_tb_note_on"
desc = "_tb_desc"
state_zero = true
lev = 0x6400

# SAMPLE's TUNE (0xca) first; parameters take the device's param_slots in order. Knob H is the slot the stock level reads
# (LEV): ACC takes it, and `lev` gives TB303 tracks a fixed level of 100 (core/dsp-voice _dv_unpack).
[[machine]]
id = "tb303"
name = "TB303"
short = "303"
clone_of = 0
knobs = [0xca, "tb303_wave", "tb303_cut", 0, "tb303_res", "tb303_env", "tb303_dec", "tb303_acc"]

[[param]]
id = "tb303_wave"
name = "Wave"
short = "WAVE"
template = 0xd1
min = 0
max = 0x100
default = 0
formatter = "tb303_wave_fmt"

[[param]]
id = "tb303_cut"
name = "Cutoff"
short = "CUT"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[[param]]
id = "tb303_res"
name = "Resonance"
short = "RES"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[[param]]
id = "tb303_env"
name = "Env Mod"
short = "ENV"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[[param]]
id = "tb303_dec"
name = "Decay"
short = "DEC"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[[param]]
id = "tb303_acc"
name = "Accent"
short = "ACC"
template = 0xd1
min = 0
max = 0x7f00
default = 0x7f00
