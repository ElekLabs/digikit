[module]
id = "tom/tb303"
version = "0.1.0"
name = "TB303"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "Open303: the 303 saw or square through its TB-303 filter, with accent and slide."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The machine is declared by builder calls in init (src/module.c). The DSP symbols start with `_tb_`.
[[machine]]
id = "tb303"
dsp = "tb"

[[object]]
path = "build/tb303-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

# src/dsp/tables.inc (included by tb303.s) is generated by src/dsp/gen_tables.py: Open303's SAW303 and SQUARE303 levels (83 KB) and
# the routine's constants.
[[object]]
path = "build/tb303-dsp.dko.json"
sources = ["src/dsp/tb303.s"]
place = "dsp.l2"

[uses.dt2]
machine_rows = 1
param_rows = 6
page_rows = 0
record_bytes = 604

[uses.dn2]
machine_rows = 8
param_rows = 16
page_rows = 8
record_bytes = 0
