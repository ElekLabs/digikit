# TB303 is the 8th entry of the machine list; YES commits type 12 (the track object, byte 0x4265338e), the SRC page opens, a trig
# sounds, the DSP's type cache (DM 0x255970) holds 12, encoder B (WAVE, saw to square) changes the page, and with knob H (ACC)
# at 0 a trig still sounds.

[test]
name = "select_tb303"
devices = ["dt2"]
quick = true

[[step]]
wait_ms = 1500
[[step]]
tap = ["FUNC", "SRC"]
[[step]]
wait_ms = 200
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
tap = "DOWN"
[[step]]
wait_ms = 80
[[step]]
expect_frame = "list"
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
expect_mem = { addr = 0x4265338c, mask = 0xff00, eq = 0xc00 }
[[step]]
tap = "YES"
[[step]]
wait_ms = 300
[[step]]
tap = "SRC"
[[step]]
wait_ms = 300
[[step]]
expect_frame = "src_page"
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 500
[[step]]
expect_pcm_db = { min = -60, max = -3 }
[[step]]
expect_dsp = { addr = 0x255970, hex = "0c" }
[[step]]
expect_no_fault = true
[[step]]
turn = "ENC B"
by = 4
events = 30
[[step]]
wait_ms = 100
[[step]]
expect_frame = "wave_moved"
differs_from = "src_page"
[[step]]
expect_no_fault = true
# Knob H is ACC: turned to 0 the track still sounds, at the fixed level of 100 the unpack hook gives TB303 tracks.
[[step]]
turn = "ENC H"
by = -16
events = 120
[[step]]
wait_ms = 100
# knob H's word of track 0 in the ColdFire -> DSP frame (0x80005348 + 0xec, the high half): 0
[[step]]
expect_mem = { addr = 0x80005434, mask = 0xffff0000, eq = 0 }
[[step]]
tap = "TRIG 1"
[[step]]
wait_ms = 500
[[step]]
expect_pcm_db = { min = -60, max = -3 }
[[step]]
expect_no_fault = true
