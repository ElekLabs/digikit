[module]
id = "tom/chord"
version = "0.1.0"
name = "Chord"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "The track's sample as a one-shot played by up to four voices at set intervals, with detune, stereo spread and a forward or ping-pong loop."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-voice"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/tables.inc (included by chord.s) is generated by src/dsp/gen_tables.py: the constants and the pan table.
[[object]]
path = "build/chord-dsp.dko.json"
sources = ["src/dsp/chord.s"]
place = "dsp.l2"
devices = ["dt2"]

# the value texts of LOOP, DTUN and the intervals
[[object]]
path = "build/chord-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[voice]]
machine = "chord"
render = "_ch_render"
note_on = "_ch_note_on"
desc = "_ch_desc"
state_zero = true
stereo = true
lev = 0x6400

# SAMPLE's TUNE (0xca) first; knob D is SAMPLE's SAMP (0xcd): the slot. Knob H is the slot the stock level reads (LEV): SPRD takes
# it, and `lev` gives the track a fixed level of 100.
[[machine]]
id = "chord"
name = "Chord"
short = "CHRD"
clone_of = 0
knobs = [0xca, "ch_loop", "ch_dtun", 0xcd, "ch_int2", "ch_int3", "ch_int4", "ch_sprd"]

# bipolar: 0x4000 OFF, above a forward loop, below ping-pong; the distance sets the loop start
[[param]]
id = "ch_loop"
name = "Loop"
short = "LOOP"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "chord_loop_fmt"

# bipolar: 0x4000 is 0
[[param]]
id = "ch_dtun"
name = "Detune"
short = "DTUN"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "chord_bip_fmt"

# steps: 40 .. 63 are -24 .. -1 semitones, 64 (0x4000) OFF, 65 UNI (the note), 66 .. 89 +1 .. +24
[[param]]
id = "ch_int2"
name = "Voice 2 Interval"
short = "INT2"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "chord_int_fmt"

[[param]]
id = "ch_int3"
name = "Voice 3 Interval"
short = "INT3"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "chord_int_fmt"

[[param]]
id = "ch_int4"
name = "Voice 4 Interval"
short = "INT4"
template = 0xd1
min = 0x2800
max = 0x5900
default = 0x4000
formatter = "chord_int_fmt"

[[param]]
id = "ch_sprd"
name = "Stereo Spread"
short = "SPRD"
template = 0xd1
min = 0
max = 0x7f00
default = 0
