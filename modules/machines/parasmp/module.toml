[module]
id = "tom/parasmp"
version = "0.1.0"
name = "Para"
category = "machines"
type = "machine"
author = "tom"
status = "experimental"
summary = "The track's sample as a one-shot played paraphonically: each trig takes the next of four voices, with its own note, amp envelope (attack, held for the trig, decay), detune and stereo position; a forward or ping-pong loop and a start point."
dynamic = false
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-voice"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# src/dsp/tables.inc (included by parasmp.s) is generated by src/dsp/gen_tables.py: the constants, the pan table and the envelope's
# attack steps and decay factors.
[[object]]
path = "build/parasmp-dsp.dko.json"
sources = ["src/dsp/parasmp.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fw_release_latch = "dsp.voice.release_latch"

# the value texts of LOOP and DTUN
[[object]]
path = "build/parasmp-fmt.dko.json"
sources = ["src/cf/fmt.s"]
place = "cf.expansion"
devices = ["dt2"]

[[voice]]
machine = "parasmp"
render = "_ps_render"
note_on = "_ps_note_on"
desc = "_ps_desc"
state_zero = true
stereo = true
lev = 0x6400

# SAMPLE's TUNE (0xca) first; knob D is SAMPLE's SAMP (0xcd): the slot. Knob H is the slot the stock level reads (LEV): SPRD takes
# it, and `lev` gives the track a fixed level of 100.
[[machine]]
id = "parasmp"
name = "Para"
short = "PARA"
clone_of = 0
knobs = [0xca, "ps_loop", "ps_dtun", 0xcd, "ps_atk", "ps_dec", "ps_strt", "ps_sprd"]

# bipolar: 0x4000 OFF, above a forward loop, below ping-pong; the distance sets the loop start
[[param]]
id = "ps_loop"
name = "Loop"
short = "LOOP"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "parasmp_loop_fmt"

# bipolar: 0x4000 is 0
[[param]]
id = "ps_dtun"
name = "Detune"
short = "DTUN"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000
formatter = "parasmp_bip_fmt"

[[param]]
id = "ps_atk"
name = "Attack"
short = "ATK"
template = 0xd1
min = 0
max = 0x7f00
default = 0

[[param]]
id = "ps_dec"
name = "Decay"
short = "DEC"
template = 0xd1
min = 0
max = 0x7f00
default = 0x4000

[[param]]
id = "ps_strt"
name = "Start"
short = "STRT"
template = 0xd1
min = 0
max = 0x7f00
default = 0

[[param]]
id = "ps_sprd"
name = "Stereo Spread"
short = "SPRD"
template = 0xd1
min = 0
max = 0x7f00
default = 0
