[module]
id = "digikit/shot"
version = "0.1.0"
name = "SHOT"
category = "machines"
type = "machine"
author = "digikit"
status = "experimental"
summary = "Plays the stereo sample bound to the track once per note, with start, end, reverse and pitch."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# A stereo sample-playback machine (machine contract 1.2, per-module sample pool). `patchkit pack digikit/shot --device dt2|dn2 -o shot.dkm` makes
# the .dkm. The machine, its parameters and pages are declared by builder calls in init (src/module.c); the DSP in src/dsp/shot.s.
[[machine]]
id = "shot"

[[object]]
path = "build/shot-cf.dko.json"
sources = ["src/module.c", "src/pages.c", "src/sample_view.c"]
place = "cf.expansion"

[[object]]
path = "build/shot-dsp.dko.json"
sources = ["src/dsp/shot.s"]
place = "dsp.l2"

[uses.dt2]
machine_rows = 1
param_rows = 5
page_rows = 0
record_bytes = 844

[uses.dn2]
machine_rows = 1
param_rows = 5
page_rows = 1
record_bytes = 940
