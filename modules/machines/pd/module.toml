[module]
id = "fadedlimes/pd"
version = "0.1.0"
name = "Phase Dist"
category = "machines"
type = "machine"
author = "fadedlimes"
status = "experimental"
summary = "One continuous slider warps the phase a sine is read through: saw, pulse, or a resonant formant."
dynamic = false
ports = ["dt2-1.16", "dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "unsupported"
"dn2-1.12" = "unsupported"

[[object]]
path = "build/pd-dsp.dko.json"
sources = ["src/dsp/pd.s"]
place = "dsp.l2"

[[voice]]
machine = "pd"
render = "_pd_render"
note_on = "_pd_note_on"
desc = "_pd_desc"

# SAMPLE's TUNE (0xca) and LEV (0xd1) at the ends. Parameters take the first positions of the device's
# param_slots list -- 1, 2 and 4 on the Digitakt II -- whatever positions are written here.
[[machine]]
id = "pd"
name = "Phase Dist"
short = "PD"
clone_of = 0
knobs = [0xca, "pd_amount", "pd_curve", 0, "pd_detune", "pd_fold", 0, 0xd1]

[[param]]
id = "pd_amount"
name = "Distortion"
short = "PD"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "pd_curve"
name = "Curve"
short = "CURVE"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000

[[param]]
id = "pd_detune"
name = "Detune"
short = "DET"
template = 0xd1
min = 0
max = 0x7f00
default = 0x2800

[[param]]
id = "pd_fold"
name = "Fold"
short = "FOLD"
template = 0xd1
min = 0
max = 0x7f00
default = 0x0000
