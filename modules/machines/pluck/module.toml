[module]
id = "machines/pluck"
version = "0.1.0"
name = "Pluck"
category = "machines"
status = "experimental"
summary = "A plucked-string synth machine with decay, pick position, brightness and colour."
ports = ["dt2-1.16", "dt2-1.17", "dn2-1.12"]
requires = ["core/dsp-voice", "core/machines", "core/params"]
conflicts = []

[targets]
# refused-by-encoding-gate: patchkit refuses the image (docs/findings/20-patch-toolchains.md, "Modules the
# encoding gate refuses"); build it only with --no-encoding-gate, as a diagnostic.
"dt2-1.16" = "untested"
"dt2-1.17" = "refused-by-encoding-gate"
"dn2-1.11" = "untested"
"dn2-1.12" = "refused-by-encoding-gate"

[[object]]
path = "build/pluck-dsp.dko.json"
sources = ["src/dsp/pluck.s"]
place = "dsp.l2"
devices = ["dt2"]

# The DSP routine renders the permanent type number of this machine (core/machines types.toml) (`machines.pluck.index`).
[[entry]]
registry = "voices"
id = "pluck"
type = "machines.pluck.index"
pc = "_pk_render"
devices = ["dt2"]

# The machine clones SAMPLE (type 0: its permission, per-type byte and DSP selector, so the track plays through the
# sample renderer where the voice hook takes over). The SRC page: engine slots 0 TUNE and 7 LEV are SAMPLE's own
# rows, 1 DECAY, 2 PICK, 4 BRIGHT, 5 COLOR are rows this module adds (core/params); slots 3 and 6 stay empty.
# Values are 0 .. 0x7f00 (UI 0 .. 127); the defaults give a medium-length, slightly damped, lightly combed pluck.
[[entry]]
registry = "machines"
id = "pluck"
name = "Pluck"
short = "PLK"
clone_of = 0
f0 = 0xca
f1 = "params.pluck_decay.index"
f2 = "params.pluck_pick.index"
f3 = 0
f4 = "params.pluck_bright.index"
f5 = "params.pluck_color.index"
f6 = 0
f7 = 0xd1
f8 = 0x0a
devices = ["dt2"]

[[entry]]
registry = "params"
id = "pluck_decay"
name = "Decay"
short = "DECAY"
template = 0xd1
slot = 1
min = 0
max = 0x7f00
default = 0x4000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "pluck_pick"
name = "Pick position"
short = "PICK"
template = 0xd1
slot = 2
min = 0
max = 0x7f00
default = 0x2000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "pluck_bright"
name = "Brightness"
short = "BRIGHT"
template = 0xd1
slot = 4
min = 0
max = 0x7f00
default = 0x5000
devices = ["dt2"]

[[entry]]
registry = "params"
id = "pluck_color"
name = "Excitation colour"
short = "COLOR"
template = 0xd1
slot = 5
min = 0
max = 0x7f00
default = 0x2800
devices = ["dt2"]

# ---- Digitone II ------------------------------------------------------------------------------------------------

# The DN2 routine on the voice hook's ABI (one buffer per voice slot, the note-on from the frame's trig mask); a machine
# of its own type (the FM engine renders nothing for it: `own_dsp`) with its own SYN page: DECAY, PICK, BRIGHT, COLOR on
# knobs A .. D (sound-array slots 25 .. 28), the engine's level on the last knob.
[[object]]
path = "build/pluck-dn2-dsp.dko.json"
sources = ["src/dsp/pluck_dn2.s"]
place = "dsp.l2"
devices = ["dn2"]

[[entry]]
registry = "voices"
id = "pluck"
type = "machines.pluck.index"
pc = "_pk_render"
devices = ["dn2"]

[[entry]]
registry = "machines"
id = "pluck"
name = "Pluck"
short = "PLK"
clone_of = 0
position = 4
own_dsp = 1
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pluck_decay"
name = "Decay"
short = "DECAY"
template = 0xd5
slot = 25
min = 0
max = 0x7f00
default = 0x4000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pluck_pick"
name = "Pick position"
short = "PICK"
template = 0xd5
slot = 26
min = 0
max = 0x7f00
default = 0x2000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pluck_bright"
name = "Brightness"
short = "BRIGHT"
template = 0xd5
slot = 27
min = 0
max = 0x7f00
default = 0x5000
devices = ["dn2"]

[[entry]]
registry = "params"
id = "pluck_color"
name = "Excitation colour"
short = "COLOR"
template = 0xd5
slot = 28
min = 0
max = 0x7f00
default = 0x2800
devices = ["dn2"]

[[entry]]
registry = "pages"
id = "pluck_syn"
machine = "machines.pluck.index"
name = "PLUCK"
title = "Pluck"
c0 = "params.pluck_decay.index"
c1 = "params.pluck_pick.index"
c2 = "params.pluck_bright.index"
c3 = "params.pluck_color.index"
s0 = 25
s1 = 26
s2 = 27
s3 = 28
devices = ["dn2"]
