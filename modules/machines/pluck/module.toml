[module]
id = "digikit/pluck"
version = "0.1.0"
name = "PLUCK"
category = "machines"
type = "machine"
author = "digikit"
status = "experimental"
summary = "A plucked-string synth machine with decay, pick position, brightness and colour, loaded at run time."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# A machine loaded at run time (docs/findings/32-runtime-dsp-machines.md). `patchkit pack digikit/pluck --device dt2 -o ...dkm` reads the
# declaration in src/module.c (DK_MACHINE, DK_PARAM, DK_PAGE) into the `register` records and links the DSP object into the `.dkm` DSP
# section; the digikit runtime sends the code to the DSP and publishes the voice row (type 18 on the Digitakt II, 17 on the Digitone II)
# and the machine row.
# The patched-in twin test/patched-pluck (tests/fixtures/modules) has its own copy of this DSP source. The equiv-dyn-pluck scenario
# compares the two, so a change of the sound here needs the same change in the copy.
[[object]]
path = "build/pluck-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/pluck-dsp.dko.json"
sources = ["src/dsp/pluck.s"]
place = "dsp.l2"
