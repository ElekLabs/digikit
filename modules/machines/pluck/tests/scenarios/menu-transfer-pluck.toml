# `dktransfer install` (tools/device/dktransfer.py): on a boot with no module it builds what changed (nothing), packs, uploads digikit/pluck, SELECTs it,
# RESTARTs and waits until MODULES lists it; the machine then plays like the patched-in test/patched-pluck. `dktransfer list` shows it before
# (not on the card) and after (on the card, loaded); a second install plan builds and uploads nothing; READ returns the packed header.
[scenario]
name = "menu-transfer-pluck"
kind = "menu"
devices = ["dt2", "dn2"]
tier = "quick"

[menu]
modules = ["digikit/pluck"]
twin = "test/patched-pluck"
static_type = 9
play_module = "digikit/pluck"
play_machine = "pluck"
hint = 7
voices = 1
transfer = true

[menu.dn2]
hint = 4
hint_run = 5
trig_frame = 7000
ref_plain = true
