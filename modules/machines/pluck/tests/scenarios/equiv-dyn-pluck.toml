# Not a test: the input of tools/devtools/sharc_matrix.py PLUCK proof. The acceptance test is tests/equiv.device.test.ts.
# A selection loaded at boot leaves the rows of a boot with no module (apart from its own machine), claims its voice row and plays an audible note;
# the note's PCM is pinned by the TypeScript cell.
[scenario]
name = "equiv-dyn-pluck"
kind = "equiv"
devices = ["dt2", "dn2"]
tier = "quick"

[equiv]
modules = ["digikit/pluck"]
play = "pluck"
play_module = "digikit/pluck"
play_machine = "pluck"
hint = 7
trig_frame = 3500   # the note starts shortly after the panel setup ends (frame 3330 in both rigs); the capture is as long as ever
voices = 1
ignore_run_machines = ["Pluck"]

# Digitone II: the same module (own_dsp machine, SYN page, DSP routine)
[equiv.dn2]
hint = 5    # the run-time machine follows MIDI
trig_frame = 7000
