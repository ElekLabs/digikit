[module]
id = "digikit/spark"
version = "0.1.0"
name = "SPARK"
category = "machines"
type = "machine"
author = "digikit"
status = "experimental"
summary = "Plays the stereo sample bound to the track once per note, with start, end, reverse and pitch."
dynamic = true
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# A stereo sample-playback machine (machine contract 1.2, track samples API 1.5). `patchkit pack digikit/spark --device dt2|dn2 -o spark.dkm` makes
# the .dkm. The machine declaration, the parameters and the track table are in src/module.c; the DSP in src/dsp/spark.s.
[[object]]
path = "build/spark-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/spark-dsp.dko.json"
sources = ["src/dsp/spark.s"]
place = "dsp.l2"
