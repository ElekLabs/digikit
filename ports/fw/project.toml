doc = "At the exit of the multi-slot clear callback: re-reads the vector from the job and records each slot as cleared, always (at most 129 entries are read). The routine saves D0, D1, D2, A0, A1 and the flags."

[[site]]
name = "cf.project.site.paste_exit"
cpu = "cf"
rule.dt2 = { kind = "cf_call", hash = "74201c46da5dc856daae9e5957420079", call = 0x16, offset = 0x11c, len = 8 }
rule.dn2 = { kind = "cf_call", hash = "74201c46da5dc856daae9e5957420079", call = 0x16, offset = 0x11c, len = 8 }
rule.st = { kind = "cf_call", hash = "74201c46da5dc856daae9e5957420079", call = 0x16, offset = 0x11c, len = 8, mark = "O" }
mark = "V"
users = ["core/services/project"]
doc = "DT2 0x400f55aa, DN2 1.12 0x400f6f86, DN2 1.11 0x400f6dba (function DT2 0x400f548e, DN2 0x400f6e6a, DN2 1.11 0x400f6c9e, + 0x11c): the one exit of the stock project paste `bool paste(ProjectCache *, int slot, bool)` (it runs on the BgWorker thread: it copies the clipboard's project over the slot record, stamp and name included, writes the card and refreshes the listing, all inside the job): `movem.l -0x38(A6),D2-D6/A2; unlk A6` (8 bytes, a plain copy; the rts follows). D0.b is nonzero when the copy reached the card write (the write's own result, `FUN_400f5150`, is discarded and not returned), D6 and 12(A6) the destination slot, A6 the frame. The function is found as the target of the `jsr` at +0x16 of the paste job callback (DT2 0x400a12f8, DN2 0x4009b46e, one strict hash on both), because the function's own strict hash differs between the devices (the project size is an immediate); `offset` is added to that target. Checked against image bytes [V]; bytes equal on all three images."

[[hook]]
name = "cf.project.hook.paste_exit"
site = "cf.project.site.paste_exit"
cpu = "cf"
mode = "replace"
tail = true
regs = { in = ["d0", "d6"], clobbers = [] }
devices = ["dt2", "dn2"]
mark = "V"
context = "task"
users = ["core/services/project"]
doc = "Before the rts of the paste: when D0.b is nonzero it records the destination slot D6 as pasted over (a paste that did not reach the card write records nothing). The routine saves D1, A0, A1 and the flags and keeps D0 and D6."
