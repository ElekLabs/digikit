# ---- The project service (docs/design/digikit-project.md section 3, docs/findings/110-project-identity.md sections 4 and 5): five hooks on the stock project paths, each only records what
# happened (`core/services/project`, `hooks.s`); the service acts in its tick. The setter, the save, the clear callbacks and the paste are the same functions on both devices by strict hash.

[[fn]]
name = "cf.project.fn.mmcfs"
cpu = "cf"
sig = "u32 ()"
rule.dt2 = { kind = "cf_func", hash = "9075f0f4f2508449aee9897308864051", offset = 0x0, len = 4 }
rule.dn2 = { kind = "cf_func", hash = "05c29994601b095f387f9406eb748abb", offset = 0x0, len = 4 }
mark = "D"
users = ["core/services/project"]
doc = "`MmcFs *f(void)`: the card file system singleton (the getter of `std::_Sp_counted_ptr<MmcFs*>`; DT2 1.17 0x4019dbda, DN2 1.12 0x4018e0a8, DN2 1.11 0x4018ddc8; the code differs per image, the hash is unique on each). The firmware's listing of the 129 slots is in it [V]: the record of slot s is at +0x10 + s * 0x1c (slot 0x80 is the live mirror): byte 0 is nonzero when the slot exists (the name, header byte 8, is not empty; the firmware's own accessors test only this byte), byte 1 is 1 for a `DT1P` or `DN1P` header and 0 for the in-memory format magic 0xBEEFBACE, the u32 at +4 is a record format word [D] (5 on a cleared project), the 16 name bytes at +8 (no terminator is written), the u32 at +0x18 is the save stamp (header +0x18). The listing refresh `(MmcFs *, slot)` (DT2 0x4012f2fa, DN2 0x4012dbce) fills it and takes a mutex at +0x1e030 (DN2) or +0x1e034 (DT2) at entry. A header that cannot be read leaves the name \"ERROR\" with bytes 0 and 1 zero [D], unless the static header buffer still holds a valid magic. The project service reads name and stamp there. Not found on Syntakt."

[[site]]
name = "cf.project.site.slot_set"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "d9416ff018bbb9f13907fd7e9487f36e", offset = 0x0, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "d9416ff018bbb9f13907fd7e9487f36e", offset = 0x0, len = 6 }
rule.st = { kind = "cf_func", hash = "d9416ff018bbb9f13907fd7e9487f36e", offset = 0x0, len = 6, mark = "O" }
mark = "V"
users = ["core/services/project"]
doc = "DT2 0x400c11ca, DN2 0x400bb7fa: the entry of the project slot setter `void set(int slot)` (slot at 4(SP); -1 is no project; writes the slot byte only on a change): `mvs.b (slot byte).l,D1` (6 bytes, a plain copy)."

[[value]]
name = "cf.project.value.slot_byte"
cpu = "cf"
codegen = false
rule = { kind = "cf_literal", hash = "d9416ff018bbb9f13907fd7e9487f36e", offset = 0x2, len = 4 }
mark = "D"
users = ["core/services/project"]
doc = "The slot byte of the stock project (one byte, sign-extended by the stock reads; -1 is no project): the absolute operand of the setter's first instruction `mvs.b (slot byte).l,D1` (the literal at the setter's entry + 2). The address is checked against image bytes [V] on DT2 1.17 (0x4099d5c5), DN2 1.12 (0x405ce899) and DN2 1.11 (0x405cd899), Syntakt [O]. The setter writes it with a 1-byte copy only on a change. It lies at +0x3d of a 0x100-byte record (DT2 0x4099d588) that is persisted to flash and read back whole at boot, so it holds the last persisted slot, read before the stock project load [D]; init writes 0, and the project-container decode calls the setter with -1 when no project data exists. The project service reads it once at its start (`firmware_slot` in `dks/src/glue.rs`, named in `[object.externs]` of its `module.toml`; `codegen = false` keeps the shared dkfw crate, and so the runtime object, unchanged)."

[[hook]]
name = "cf.project.hook.slot_set"
site = "cf.project.site.slot_set"
cpu = "cf"
mode = "replace"
tail = true
regs = { in = [], clobbers = ["d1", "ccr"] }
devices = ["dt2", "dn2"]
mark = "D"
context = "task"
users = ["core/services/project"]
doc = "Records the slot the setter was called with (also a call with the current slot: the setter ignores it, so the service does) and runs the displaced `mvs.b` in the tail. D1 and the flags are written by that instruction first."

[[site]]
name = "cf.project.site.save_exit"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "cdc5ea1e1c6063ed56a6dcf32a4e67a4", offset = 0xee, len = 8 }
rule.dn2 = { kind = "cf_func", hash = "cdc5ea1e1c6063ed56a6dcf32a4e67a4", offset = 0xee, len = 8 }
rule.st = { kind = "cf_func", hash = "cdc5ea1e1c6063ed56a6dcf32a4e67a4", offset = 0xee, len = 8, mark = "O" }
mark = "V"
users = ["core/services/project"]
doc = "DT2 0x40043b1e, DN2 0x4004027e: the one exit of the stock project save `int save(Project *, int slot, progress)` (the only rts is the next instruction): `movem.l (SP),D2-D4/A2-A6; lea 0x34(SP),SP` (8 bytes, a plain copy). D0.b is nonzero when the card write succeeded and D3 is the slot (0x80 on the mirror save)."

[[hook]]
name = "cf.project.hook.save_exit"
site = "cf.project.site.save_exit"
cpu = "cf"
mode = "replace"
tail = true
regs = { in = ["d0", "d3"], clobbers = [] }
devices = ["dt2", "dn2"]
mark = "D"
context = "task"
users = ["core/services/project"]
doc = "Before the rts of the save: when D0.b is nonzero and D3 is not 0x80 it records the slot D3. Strict liveness leaves every register and the flags live at the return, so the routine saves D1 and the flags and keeps D0 and D3."

[[site]]
name = "cf.project.site.clear_one_exit"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "98f2a56b7e645a2636ddcefb2ebf0b73", offset = 0x4a, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "98f2a56b7e645a2636ddcefb2ebf0b73", offset = 0x4a, len = 6 }
rule.st = { kind = "cf_func", hash = "98f2a56b7e645a2636ddcefb2ebf0b73", offset = 0x4a, len = 6, mark = "O" }
mark = "V"
users = ["core/services/project"]
doc = "DT2 0x400a1368, DN2 1.12 0x4009b4de (function DT2 0x400a131e, DN2 0x4009b494, + 0x4a): the exit of the job callback of the stock clear of one project (`bool f(Job **)`, run on the BgWorker thread: slot = **arg, then the slot record is reset, written to the card and the listing refreshed, all inside the job): `movem.l 0x1c(SP),D2/A2/A3` (6 bytes, a plain copy); `lea 0x38(SP),SP; moveq 1,D0; rts` follow. SP is the entry SP - 0x38, so the job is at 0x3c(SP); D2 still holds the slot. The function always returns 1. Checked against image bytes [V]."

[[hook]]
name = "cf.project.hook.clear_one_exit"
site = "cf.project.site.clear_one_exit"
cpu = "cf"
mode = "replace"
tail = true
regs = { in = [], clobbers = [] }
devices = ["dt2", "dn2"]
mark = "V"
context = "task"
users = ["core/services/project"]
doc = "At the exit of the clear callback, after the card write and the listing refresh: records the slot **(0x3c(SP)) as cleared, always (a failed clear then archives a `.dkp` that is still needed, which is recoverable). The routine saves D0, D1, D2, A0, A1 and the flags (strict liveness proves only A0 dead)."

