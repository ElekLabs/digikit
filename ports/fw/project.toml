rule.dt2 = { kind = "cf_func", hash = "eda04f2e77064222a73b84f4a05aa1ca", offset = 0x70, len = 8 }
rule.dn2 = { kind = "cf_func", hash = "eda04f2e77064222a73b84f4a05aa1ca", offset = 0x70, len = 8 }
