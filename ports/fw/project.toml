doc = "DT2 0x400a13e6, DN2 1.12 0x4009b55c (function DT2 0x400a1376, DN2 0x4009b4ec, + 0x70): the exit of the job callback of the stock clear of several projects (`bool f(Job **)`, run on the BgWorker thread, finishes its writes and refresh inside the job: **arg is a vector of 32-bit slots, begin at +0 and end at +4): `movem.l (SP),D2-D5/A2-A6; lea 0x34(SP),SP` (8 bytes, a plain copy); the rts follows. The job is at 0x38(SP); D0.b is the AND of the per-slot results. Checked against image bytes [V]."

[[hook]]
