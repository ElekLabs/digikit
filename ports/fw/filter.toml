doc = "The chooser's order vector (called from the filter list builder, DT2 FUN_400610e8 and DN2 FUN_4005b458): the first call allocates 0x18 bytes and copies the six static longs {0,1,4,3,5,2}; later calls hand out the same vector. DT2 FUN_40052c98, DN2 FUN_4004dae2."

