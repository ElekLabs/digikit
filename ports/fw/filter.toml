sig = "i32 (u32 track_object)"
rule.dt2 = { kind = "cf_func", hash = "16f610949af3b60dff8fde5f2351de96", offset = 0x0, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "c43705027173a44cb8708e4f1be3e534", offset = 0x0, len = 6 }
mark = "D"
users = ["core/services/machines", "core/runtime"]
doc = "Filter type getter (a signed byte of the sound, -1 for no sound): DT2 FUN_400506ac (reads sound+0xa3), DN2 FUN_4004b860 (sound+0xdf). The service calls it to read the stock type of a track for its session store."

[[fn]]
name = "cf.filter.fn.set"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "43bf975fd863bc739240cb1c2fd045f0", offset = 0x0, len = 6 }
