[[site]]
name = "cf.view.site.view_vptr_lit"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "25fcb970d10a1353214d124c7922d34c", offset = 0x38, len = 4 }
devices = ["dt2", "dn2"]
mark = "V"
users = ["core/ui"]
doc = "The View primary vptr that the ctor stores (DT2 0x4021dfd8, DN2 0x402079a4); the 17 slots start here and the header (offset_to_top, typeinfo) is the 8 bytes before. A module copies 19 words from vptr - 8 and replaces slot 2 (key) and 4 (draw). Slot 0 is the complete destructor (no free) and slot 1 the deleting one (destructor, then free)."

[[site]]
name = "cf.view.site.sp_view_cb_vptr_lit"
cpu = "cf"
rule = { kind = "cf_ptr", hash = "e427a70e2c95815987c648e84eba4737", offset = 0x2e, len = 4 }
devices = ["dt2", "dn2"]
mark = "D"
users = ["core/ui"]
doc = "The control block vptr of `_Sp_counted_ptr<View*>`, the immediate of `move.l #vptr,(a0)` in `cf.string.fn.shared_ptr.make` (DT2 0x401f1130, DN2 0x401d9ca0): its dispose calls the View's deleting destructor (slot 1). The make_shared (inplace) blocks differ: their dispose calls slot 0 and the block's destroy frees the memory. The offset is that of the 4-byte immediate (the opcode is 2 bytes before it)."
