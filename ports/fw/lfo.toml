# The LFO tick and its second reader (docs/findings/149-lfo-waveforms.md): the sites that make a wave value above RAND a table shape, DT2 1.17 and DN2 1.12.
# Each site is the six bytes `moveq 6,Dn; cmp.l D3,Dn; beq|bne` that compare the clamped wave with 6. The hook of the lfo service (`core/services/lfo`, `dks/src/hooks-*.s`) replaces them: it runs the moveq, the compare
# and the stock branch itself, and only on the outcome "clamped wave is 6" (RAND, or an extended value that was clamped to 6) reads the raw wave byte again. Without the service nothing is installed and the site stays stock.
# `regs.clobbers` lists the registers the routine leaves changed, `dk_lfo_eval` included (it writes d0, d1, a0, a1 and the flags and saves d2; the routines of the `call` sites save and restore a0 and a1, and d1 where it is live).
# The `regs` of each hook were found from the stock bytes with `uv run python -m tools.coldfire.liveness PORT SITE` (docs/findings/149-lfo-waveforms.md, "Registers"): the
# scratch register of the hook (the moveq's) is dead where the "clamped wave is 6" outcome continues (and where the routine continues for an extended wave); the flags are dead there too.

[[site]]
name = "cf.lfo.site.tick_call"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "b121ea94a360f3ab5670cbda5f32a501", offset = 0x1e6, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "de34999302c8ac3ccee8402fc8c461a3", offset = 0x2c0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DT2 0x40139804, DN2 0x40137cc6: the LFO tick: `moveq 6,Dn; cmp.l D3,Dn; beq` before the wave function table call (D3 is the wave clamped to 0..6; the beq goes to the RAND code)."

