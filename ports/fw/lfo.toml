# ---- The MOD page: the sites of the UI task hooks of the lfo service (docs/findings/149-lfo-waveforms.md, "The panel hooks"). They are `.dks` hooks (listed in the port file), not interrupt stubs.
# The name formatters are outside the functions that the Ghidra database of the image keeps (`catalog declare` finds no containing function), so each site is a `cf_words` signature of the stock
# words from the function entry. A wildcard `"*"` is a whole 32-bit word: the one after `pea table` covers the low half of the name table's address (DN2 1.11 has other table addresses) and the opcode
# half `0x486e` of the next instruction (`pea -0x1c(A6)`), which the DT2 word 0x3ffc486e shows. The high half of the address stays in the word before it: it tells the
# four-character formatter (0x401f....) from the three-character one (0x401d....). The other name formatters differ in the size of the frame and the length of their tables.

[[site]]
name = "cf.lfo.site.wave_name"
cpu = "cf"
rule.dt2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x48794021, 0x3ffc486e, 0xffe44eb9], offset = 0, len = 6 }
rule.dn2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x4879401f, "*", 0xffe44eb9], offset = 0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DT2 0x400e1b68, DN2 0x400e3610: the entry of the wave name formatter `fmt(int value, char *buf)` (the four-character names of the seven stock waves; DN2 also has `wave_name3`): `link.w A6,-0x1c; moveq 6,D0` (6 bytes), then `value >> 8` against 6 (unsigned) and the sprintf of the name table, or of \"ERR\"."

[[site]]
name = "cf.lfo.site.wave_name3"
cpu = "cf"
rule.dn2 = { kind = "cf_words", as = "code", words = [0x4e56ffe4, 0x70062f03, 0x2f02242e, 0x0008e082, 0x262e000c, 0xb0826536, 0x4878001c, 0x4879401d, "*", 0xffe44eb9], offset = 0, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DN2 0x4000766c: the entry of the second wave name formatter of the Digitone II, the three-character names (TRI SIN SQR SAW EXP RMP RND): `link.w A6,-0x1c; moveq 6,D0` (6 bytes)."

[[hook]]
name = "cf.lfo.hook.wave_name"
site = "cf.lfo.site.wave_name"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["d0", "ccr"] }   # d1, a0 and a1 are saved around the call
devices = ["dt2", "dn2"]
mark = "D"
context = "ui"
users = ["core/services/lfo"]
doc = "The wave name formatter of the MOD page (UI task): `fmt(int value, char *buf)`, 4(SP) = value (wave << 8), 8(SP) = buf. For a value of 7 to 14 with a loaded shape the hook writes the shape's name and returns its length; otherwise it runs the displaced `link.w A6,-0x1c; moveq 6,D0` and continues at the end of the site. At the entry the flags are dead (strict liveness) and D0 is written by the displaced moveq."

[[hook]]
name = "cf.lfo.hook.wave_name3"
site = "cf.lfo.site.wave_name3"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["d0", "ccr"] }   # d1, a0 and a1 are saved around the call
devices = ["dn2"]
mark = "D"
context = "ui"
users = ["core/services/lfo"]
doc = "The three-character wave name formatter of the Digitone II (UI task): as `wave_name`, with the first three characters of the shape's name."

# ---- The graph of the MOD page (docs/findings/149-lfo-waveforms.md, "Graph"): the cell FUN_4010c5ee (DT2) / FUN_4010df62 (DN2) of LfoPageView, one call site each. The function is in the
# Ghidra database; both images hash alike (h_strict), and so do DT2 1.16 and DN2 1.11 and 1.10E.

[[site]]
name = "cf.lfo.site.graph_vec"
cpu = "cf"
rule.dt2 = { kind = "cf_func", hash = "200c6ac9ca95aed9ace6308aa35abfee", offset = 0x24e, len = 6 }
rule.dn2 = { kind = "cf_func", hash = "200c6ac9ca95aed9ace6308aa35abfee", offset = 0x24e, len = 6 }
mark = "D"
users = ["core/services/lfo"]
doc = "DT2 0x4010c83c, DN2 0x4010e1b0: the vector pick of the LFO page's cell: `addi.l #TABLE,D6` (D6 = 12 * the clamped wave) before `move.l D6,-(SP); jsr (A5)`. TABLE is the RAM table of seven tile vectors (DT2 0x44d2e37c, DN2 0x44508b68)."

[[hook]]
name = "cf.lfo.hook.graph_vec"
site = "cf.lfo.site.graph_vec"
cpu = "cf"
mode = "replace"
tail = true
regs = { in = ["d5", "d6", "a6"], clobbers = ["d6", "ccr"] }   # the shape path sets D6 and clears the flags like the stock addi; every other path runs the displaced addi in the tail
devices = ["dt2", "dn2"]
mark = "D"
context = "ui"
users = ["core/services/lfo"]
doc = "The cell of the LFO page (UI task): for a wave 7 to 14 with a published shape graph D6 becomes the service's vector of four tiles and the byte at -0x11(A6) the unipolar mark; otherwise the tail runs the displaced `addi.l #TABLE,D6`. The wave is 0x18(A6). The vtable word of the tiles is read from the stock vector (the tail's displaced `addi` gives TABLE; TABLE + D6 is the vector, its first word the first Bitmap's vtable). Strict liveness: only the flags are dead; D0, D1, A0 and A1 are saved."

# ---- The WAVE rows of the parameter table (docs/findings/149-lfo-waveforms.md, "Direct readers of the parameter table"): the rows of the parameters 79, 89 and 99, the WAVE of the three LFOs.
# The lfo service writes the maximum word of each row (+0xc) in the RAM copy of the table that `core/rows` makes, so the encoder stops at the highest loaded shape. A signature of the
# row's words from its owner: the mirror index (+4), the minimum 0, the maximum 0x600 (RND), the default, the flag 0, the CC half (a wildcard: the CC and the NRPN halves differ between
# the devices), the slot (+0x1c) and wildcards for the owner, name, template and formatter words (the addresses of each firmware).

[[data]]
name = "cf.lfo.data.wave_row.1"
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_words", words = ["*", 0x5, 0x0, 0x600, 0x100, 0x0, "*", 0xae, "*", "*", "*", "*", "*", "*", "*"] }
mark = "D"
users = ["core/services/lfo"]
doc = "The descriptor row (60 bytes) of the WAVE parameter of LFO 1 (code 79): mirror index 5, range 0..0x600, default 0x100, slot 0xae."

[[data]]
name = "cf.lfo.data.wave_row.2"
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_words", words = ["*", 0xd, 0x0, 0x600, 0x0, 0x0, "*", 0xb6, "*", "*", "*", "*", "*", "*", "*"] }
mark = "D"
users = ["core/services/lfo"]
doc = "The descriptor row of the WAVE parameter of LFO 2 (code 89): mirror index 0xd, range 0..0x600, default 0, slot 0xb6."

[[data]]
name = "cf.lfo.data.wave_row.3"
cpu = "cf"
devices = ["dt2", "dn2"]
rule = { kind = "cf_words", words = ["*", 0x15, 0x0, 0x600, 0x0, 0x0, "*", 0xbe, "*", "*", "*", "*", "*", "*", "*"] }
mark = "D"
users = ["core/services/lfo"]
doc = "The descriptor row of the WAVE parameter of LFO 3 (code 99): mirror index 0x15, range 0..0x600, default 0, slot 0xbe."
