[[value]]
name = "cf.rtos.value.console.queue"
cpu = "cf"
rule.dt2 = { kind = "cf_literal", hash = "9d6efd6eebbf956849b58bc3cd1cd556", offset = 0xe, len = 4 }
rule.dn2 = { kind = "cf_literal", hash = "0cfa77e0415e93225c42eafae994ed9f", offset = 0xe, len = 4 }
devices = ["dt2", "dn2"]
port_file = true
codegen = false
mark = "D"
users = ["core/runtime"]
doc = "The queue the console task pops its command lines from (DT2 1.17 0x403a0eac, DN2 1.12 0x4038be9c; the literal of the queue init in its creation function). The pop pends on the queue's semaphore at queue + 8, so the waiter word is at queue + 0xc (the queue layout is the kernel's, the same on both images). The firmware builds the queue and creates the task only on a unit whose flag word (DN2 1.12 0x40287a60 bit 0x20) has the serial console on: elsewhere the queue stays zero (the buffer pointer at queue + 0x14 is the first word `queue_init` sets), no task exists and the installer counts it as parked. [D]: DN2 emulator memory read, console create path read from the image."

