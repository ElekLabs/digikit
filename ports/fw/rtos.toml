[[fn]]
name = "cf.rtos.fn.sleep_us"
cpu = "cf"
sig = "void (u32 us)"
rule = { kind = "cf_func", hash = "113f4261cb994d31a918bb90032ffe45", offset = 0x0, len = 4 }
mark = "D"
users = ["core/sample-pool", "core/runtime"]
doc = "Stock short sleep (DT2 1.17 0x40136544, DN2 1.12 0x4013492c, DN2 1.11 0x4013464c; DT2 stock name dtim1_sleep_100us): locks its own mutex, loads timer DTIM1 (prescaler 0x84, about 1 MHz) with `us` and blocks the task on a semaphore until the timer interrupt. Task context only. The LP0 sender waits 100 after each page with it; the runtime's I/O task uses it for delays (the kernel has no timed pend)."

