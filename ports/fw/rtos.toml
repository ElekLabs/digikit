cpu = "cf"
rule.dt2 = { kind = "cf_literal", hash = "9d6efd6eebbf956849b58bc3cd1cd556", offset = 0x2c, len = 4 }
rule.dn2 = { kind = "cf_literal", hash = "0cfa77e0415e93225c42eafae994ed9f", offset = 0x2c, len = 4 }
